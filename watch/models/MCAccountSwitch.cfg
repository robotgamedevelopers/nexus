\* AccountSwitch.tla on a small instance: three accounts (one not signed in), two choices, one phone restart, two
\* frames and two answers in flight at once.
CONSTANTS
    Accounts = {"a", "b", "d"}
    SignedIn = {"a", "b"}
    Start = "a"
    MaxChoice = 2
    MaxCrash = 1
    MaxMsgs = 2
SPECIFICATION FairSpec
INVARIANTS
    TypeOK
    OnlySignedIn
    NoSilentDrop
PROPERTIES
    ChoiceChanges
    ChoiceLeaves
