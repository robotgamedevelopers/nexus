\* VoiceTurn.tla on a small instance: two AIs, three prompts and recordings, two replies queued.
CONSTANTS
    Ais = {"ann", "bo"}
    MaxPrompts = 3
    MaxUtter = 3
    MaxReplies = 2
    MaxSaid = 3
CONSTRAINT Bounded
SPECIFICATION FairSpec
INVARIANTS
    TypeOK
    TalkOnlyConnected
    DisconnectedExactly
    SendingExactly
    PromptsNumbered
    SpeakingHasReply
    NoReplyLeftUnread
    LockedQuiet
PROPERTIES
    PressRefusedSays
    LostSays
    TurnEndsSaid
    PromptConfirmed
    PromptsOnlyChosen
    PromptsNeverDropped
    RefusedChangesNothing
    TranscribingEnds
