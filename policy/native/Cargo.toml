[package]
name = "nexus-policy-runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "nexus-policy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starlark = "=0.14.3"
tempfile = "3"
