# iOS and iPadOS (cmake/ios.cmake, docs/ios.md): the client built for devices and for the simulator, and the simulator
# build's tests run on a simulator device (Prax's runner, ctest's emulator). In a workflow of its own, beside ci.yml,
# with ci.yml's rules: GitHub-hosted runners only (no fleet runner and no secret per pull request), each job finishes
# in 2 minutes, warnings are errors (CMakeLists.txt), and the build starts from cache-warm's cache for its target
# (ios-device, ios-simulator: .github/actions/hosted-caches), so only what the pull request changed is rebuilt.
#
# Per pull request the iOS builds are Debug at -O0 without debug information (nexus-build's ios-device and
# ios-simulator): no LTO (Prax turns it on for Release only) and asserts on, as ci.yml's macOS build.
#
# The iOS port is not on main yet (it is on port/ios, pull request #88). The tree job looks for cmake/ios.cmake and
# says when this tree has no iOS build, and the iOS jobs then do not run; a pull request of the port, once rebased
# onto main, has it and runs them. Until the port is on main, cache-warm builds the iOS caches from port/ios.

name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      ios: ${{ steps.look.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Does this tree build iOS?
        id: look
        shell: bash
        run: |
          set -euo pipefail
          if [ -f cmake/ios.cmake ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "cmake/ios.cmake is here: the iOS jobs run"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "::notice::this tree has no iOS build (no cmake/ios.cmake): the iOS jobs do not apply to it"
          fi

  ios:
    needs: tree
    if: needs.tree.outputs.ios == 'true'
    runs-on: macos-26
    name: ios-${{ matrix.target }}
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        # Devices (arm64): the app and the shot build, signed ad hoc; nothing runs. The simulator: the same, and the
        # unit tests and the iOS tests run on a simulator device.
        target: [device, simulator]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Tools and caches
        uses: ./.github/actions/hosted-caches
        with:
          name: ios-${{ matrix.target }}
          brew: ninja
      # Starlark (cmake/policy.cmake) is built for the iOS target with the pinned Rust; its standard library for the
      # targets is in the restored toolchain (cache-warm adds it), so this only checks.
      - name: Rust's iOS standard library
        shell: bash
        run: rustup target add --toolchain "$RUSTUP_TOOLCHAIN" aarch64-apple-ios aarch64-apple-ios-sim
      - name: Configure and build
        uses: ./.github/actions/nexus-build
        with:
          config: ios-${{ matrix.target }}
      - name: Unit and iOS tests on a simulator device
        if: matrix.target == 'simulator'
        run: ctest --test-dir build -L 'unit|ios' -j "$TEST_JOBS" --output-on-failure --no-tests=error
