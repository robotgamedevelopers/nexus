# iOS and iPadOS (cmake/ios.cmake, docs/ios.md): the client built for devices and for the simulator, and the simulator
# build's tests run on a simulator device (Prax's runner, ctest's emulator). In a workflow of its own, beside ci.yml,
# with ci.yml's rules: the fleet's own runners only (the fleet Mac, label nexus-pr; never GitHub-hosted ones, and no
# secret), each job finishes in 2 minutes, warnings are errors (CMakeLists.txt), and each target builds in the runner's
# own build directory (ios-device, ios-simulator: .github/actions/fleet-build), so only what changed is rebuilt.
#
# Per pull request the iOS builds are Debug at -O0 without debug information (nexus-build's ios-device and
# ios-simulator): no LTO (Prax turns it on for Release only) and asserts on, as ci.yml's macOS build.
#
# The iOS port is not on main yet (it is on port/ios, pull request #88), so main has no iOS build (no cmake/ios.cmake)
# and this workflow runs on no push or pull request: a job that would only skip is not defined, and nothing in CI is
# skipped. Dispatched by hand on a tree without the port, its build fails. The port brings back the push and
# pull_request triggers with cmake/ios.cmake. Until the port is on main, cache-warm builds the iOS caches from
# port/ios.

name: ios

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ios:
    runs-on: [self-hosted, nexus-pr, macOS, ARM64, xcode]
    name: ios-${{ matrix.target }}
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        # Devices (arm64): the app and the shot build, signed ad hoc; nothing runs. The simulator: the same, and the
        # unit tests and the iOS tests run on a simulator device.
        target: [device, simulator]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build directory and caches
        uses: ./.github/actions/fleet-build
        with:
          name: ios-${{ matrix.target }}
      # Starlark (cmake/policy.cmake) is built for the iOS target with the pinned Rust; its standard library for the
      # targets is added to the machine's toolchain once, and after that this only checks.
      - name: Rust's iOS standard library
        shell: bash
        run: rustup target add --toolchain "$RUSTUP_TOOLCHAIN" aarch64-apple-ios aarch64-apple-ios-sim
      - name: Configure and build
        uses: ./.github/actions/nexus-build
        with:
          config: ios-${{ matrix.target }}
          dir: ${{ env.NEXUS_BUILD }}
      - name: Record the sources the build was made from
        run: bash .github/source-times.sh record "$NEXUS_BUILD/.nexus-ci-sources"
      - name: Unit and iOS tests on a simulator device
        if: matrix.target == 'simulator'
        run: bash .github/ctest.sh --test-dir "$NEXUS_BUILD" -L 'unit|ios' -j "$TEST_JOBS" --output-on-failure
