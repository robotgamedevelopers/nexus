# The Tailscale shim (docs/tailscale.md, layer 0) on each OS, in jobs of its own: src/tailscale/CMakeLists.txt builds it
# alone, without Prax, so a job is the shim's Go build (nexus's and the test program's), its test program and
# `ctest -L tailscale` (no test here reaches another machine). Called by ci.yml for every pull request and push to main,
# with the 2-minute limit of those events, and by tailscale-prime.yml, without it.
#
# The verdict is a commit status. Each OS's result for a commit is the status tailscale-<os> (tailscale-macos,
# tailscale-linux, tailscale-windows) on that exact commit: on a pull request its head, which is what these jobs check
# out (not the merge commit the other jobs build), and on a push or a merge queue the pushed commit. It is set only by
# a job that built and tested that commit on that OS: success or failure, or failure when the job is cancelled or times
# out. A lander waits for all three to be success on the head it lands; a missing or pending one is not a pass.
#
# Caches. Go comes from the runner's machine (PATH, or ~/sdk/bin as the fleet installs it) and fetches the pinned Go
# toolchain into the module cache itself. The toolchain, the modules, Go's build cache and (on Windows) llvm-mingw live
# outside the workspace, in a directory of their own on the runner's machine that no other job cleans:
#   macOS    ~/Library/Caches/nexus-ci-tailscale/<key>
#   Linux    ~/.cache/nexus-ci-tailscale/<key>
#   Windows  %LOCALAPPDATA%\nexus-ci-tailscale\<key>   (the windows job removes what it does not know in
#                                                       %LOCALAPPDATA%\nexus-ci\<runner>, so not there)
# where <key> is the first 16 hex digits of the sha256 over src/tailscale/pins.cmake, go.mod and go.sum: the pins and
# nothing else, so only a pin change is cold. Everything in it is checked: the toolchain and modules against go.sum and
# Go's checksum database, llvm-mingw against its pinned sha256 (cmake/tailscale.cmake). The machine's runners share it
# (Go locks its caches; llvm-mingw is renamed into place). A key directory unused for 7 days is removed: its own time on
# macOS and Linux, its `used` file on Windows (or, while it has none, which is while a job is still creating it, the
# directory's creation time).
#
# Primed. A key directory holds `primed` once a build and the tests have finished in it. A cold build (a new key: the
# toolchain and modules downloaded, tsnet compiled) does not fit 2 minutes (docs/tailscale.md has the numbers), so a
# per-commit job on a machine whose key directory is not primed builds nothing: it sets its commit status to pending,
# linked to tailscale-prime's runs, dispatches tailscale-prime.yml for the same commit and OS (one slot, which GitHub
# places on any runner of that OS), and fails, since it built and tested nothing. That prime run builds and tests the
# commit with no limit and sets the status to its result (.github/tailscale-dispatch.sh, .ps1 on Windows).
#
# Permissions come from the caller: ci.yml grants contents: read, actions: write (the dispatch) and statuses: write;
# tailscale-prime.yml grants contents: read and statuses: write.

name: tailscale

on:
  workflow_call:
    inputs:
      prime:
        description: true in tailscale-prime.yml (no time limit, never dispatches); false from ci.yml
        type: boolean
        required: true
      sha:
        description: the commit to check out, build and test (empty for the caller's)
        type: string
        default: ""
      status:
        description: set the commit status tailscale-<os> on that commit to the result
        type: boolean
        default: false
      skip-primed:
        description: a slot whose machine is already primed marks its key directory used and builds nothing (nightly)
        type: boolean
        default: false
      cold:
        description: with prime, Windows builds in a fresh key directory of its own (removed after), to measure cold
        type: boolean
        default: false
      macos:
        type: boolean
        default: true
      linux:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true
      # The matrix slots of each job, a JSON array: one from ci.yml and for a dispatch; from the nightly as many as the
      # OS has runners, so that GitHub may place one on every machine.
      macos-slots:
        type: string
        default: "[1]"
      linux-slots:
        type: string
        default: "[1]"
      windows-slots:
        type: string
        default: "[1]"

jobs:
  # macOS builds arm64 and x86_64 (joined by lipo) and runs both, the second under Rosetta.
  tailscale-macos:
    if: inputs.macos
    runs-on: [self-hosted, fleet, macOS, ARM64]
    timeout-minutes: ${{ inputs.prime && 30 || 2 }}
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.macos-slots) }}
    env:
      OS: macos
      SHA: ${{ inputs.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
      - name: Caches for these pins
        id: caches
        shell: bash
        env:
          KEY: ${{ hashFiles('src/tailscale/pins.cmake', 'src/tailscale/go.mod', 'src/tailscale/go.sum') }}
          SKIP_PRIMED: ${{ inputs.skip-primed }}
        run: |
          set -euo pipefail
          root="$HOME/Library/Caches/nexus-ci-tailscale"
          dir="$root/${KEY:0:16}"
          mkdir -p "$dir/go/mod" "$dir/go/build"
          # The key directory's own time is its last use; Go's module cache is read-only, hence the chmod.
          touch "$dir"
          find "$root" -mindepth 1 -maxdepth 1 -type d ! -path "$dir" -mtime +7 -print -exec chmod -R u+w {} + -exec rm -rf {} +
          echo "NEXUS_GO_CACHES=$dir/go" >> "$GITHUB_ENV"
          echo "JOBS=$(sh .github/job-cores.sh)" >> "$GITHUB_ENV"
          echo "TEST_JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          primed=false
          if [ -f "$dir/primed" ]; then primed=true; fi
          echo "primed=$primed" >> "$GITHUB_OUTPUT"
          if [ "$SKIP_PRIMED" = true ] && [ "$primed" = true ]; then
            echo "$(hostname -s) is primed for these pins already: nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Status pending (this job builds and tests this commit)
        if: ${{ inputs.status && (inputs.prime || steps.caches.outputs.primed == 'true') }}
        shell: bash
        env:
          STATE: pending
          DESCRIPTION: building and testing on ${{ runner.name }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/tailscale-status.sh
      - name: Not primed here, so tailscale-prime builds and tests this commit (this job fails)
        id: dispatch
        if: ${{ !inputs.prime && steps.caches.outputs.primed != 'true' }}
        shell: bash
        env:
          DIR: ${{ steps.caches.outputs.dir }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: bash .github/tailscale-dispatch.sh
      - name: Configure (Release, arm64 and x86_64)
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: >-
          cmake -S src/tailscale -B build-tailscale -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          "-DNEXUS_GO_MODCACHE=$NEXUS_GO_CACHES/mod" "-DNEXUS_GO_BUILDCACHE=$NEXUS_GO_CACHES/build"
      # tailscale_checks: the test program, nexus's build of the shim, go vet and the licence notices' check, side by
      # side (tests/tailscale).
      - name: Build the shim (both builds) and its test program, go vet, and the licence notices
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: cmake --build build-tailscale --parallel "$JOBS" --target tailscale_checks
      - name: Tests (arm64)
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: ctest --test-dir build-tailscale -L tailscale -j "$TEST_JOBS" --output-on-failure --no-tests=error
      # The x86_64 slice runs every group; the children that lock_two_process and quiet start are the program again,
      # which macOS runs as its native (arm64) slice.
      - name: Tests (x86_64, under Rosetta)
        if: ${{ steps.caches.outputs.build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::error::Rosetta is not installed on $(hostname -s), so the shim's x86_64 slice cannot run here: install it (softwareupdate --install-rosetta --agree-to-license) through the fleet play"
            exit 1
          fi
          test=build-tailscale/tests/tailscale/tailscale_test
          arch -x86_64 "$test" version
          for group in state_dir refusals lock lock_two_process panics log_cap quiet; do
            (cd "build-tailscale/tests/tailscale/work_$group" && arch -x86_64 ../tailscale_test "$group")
          done
          (cd build-tailscale/tests/tailscale/work_refuses_inherited_key &&
            TS_AUTHKEY=a-value-that-must-not-be-shown arch -x86_64 ../tailscale_test refuses_inherited_key)
      - name: Primed
        if: ${{ steps.caches.outputs.build == 'true' }}
        shell: bash
        run: touch "${{ steps.caches.outputs.dir }}/primed"
      - name: Status (the result of this job's build and tests)
        if: ${{ always() && inputs.status && steps.dispatch.outcome == 'skipped' }}
        shell: bash
        env:
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: built and tested on ${{ runner.name }} (job ${{ job.status }})
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/tailscale-status.sh

  # On the fleet's Linux runners with clang and lld, as build-and-unit-linux; also the licence notices
  # (src/tailscale/NOTICES.md) against the modules the shim links on every platform.
  tailscale-linux:
    if: inputs.linux
    runs-on: [self-hosted, fleet, Linux, X64]
    timeout-minutes: ${{ inputs.prime && 30 || 2 }}
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.linux-slots) }}
    env:
      CC: clang
      CXX: clang++
      OS: linux
      SHA: ${{ inputs.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
      - name: Caches for these pins
        id: caches
        shell: bash
        env:
          KEY: ${{ hashFiles('src/tailscale/pins.cmake', 'src/tailscale/go.mod', 'src/tailscale/go.sum') }}
          SKIP_PRIMED: ${{ inputs.skip-primed }}
        run: |
          set -euo pipefail
          root="$HOME/.cache/nexus-ci-tailscale"
          dir="$root/${KEY:0:16}"
          mkdir -p "$dir/go/mod" "$dir/go/build"
          # The key directory's own time is its last use; Go's module cache is read-only, hence the chmod.
          touch "$dir"
          find "$root" -mindepth 1 -maxdepth 1 -type d ! -path "$dir" -mtime +7 -print -exec chmod -R u+w {} + -exec rm -rf {} +
          echo "NEXUS_GO_CACHES=$dir/go" >> "$GITHUB_ENV"
          echo "JOBS=$(sh .github/job-cores.sh)" >> "$GITHUB_ENV"
          echo "TEST_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          primed=false
          if [ -f "$dir/primed" ]; then primed=true; fi
          echo "primed=$primed" >> "$GITHUB_OUTPUT"
          if [ "$SKIP_PRIMED" = true ] && [ "$primed" = true ]; then
            echo "$(hostname -s) is primed for these pins already: nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Status pending (this job builds and tests this commit)
        if: ${{ inputs.status && (inputs.prime || steps.caches.outputs.primed == 'true') }}
        shell: bash
        env:
          STATE: pending
          DESCRIPTION: building and testing on ${{ runner.name }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/tailscale-status.sh
      - name: Not primed here, so tailscale-prime builds and tests this commit (this job fails)
        id: dispatch
        if: ${{ !inputs.prime && steps.caches.outputs.primed != 'true' }}
        shell: bash
        env:
          DIR: ${{ steps.caches.outputs.dir }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: bash .github/tailscale-dispatch.sh
      - name: Configure (Release)
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: >-
          cmake -S src/tailscale -B build-tailscale -DCMAKE_BUILD_TYPE=Release -DCMAKE_LINKER_TYPE=LLD
          "-DNEXUS_GO_MODCACHE=$NEXUS_GO_CACHES/mod" "-DNEXUS_GO_BUILDCACHE=$NEXUS_GO_CACHES/build"
      # tailscale_checks: the test program, nexus's build of the shim, go vet and the licence notices' check, side by
      # side (tests/tailscale).
      - name: Build the shim (both builds) and its test program, go vet, and the licence notices
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: cmake --build build-tailscale --parallel "$JOBS" --target tailscale_checks
      - name: Tests
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: ctest --test-dir build-tailscale -L tailscale -j "$TEST_JOBS" --output-on-failure --no-tests=error
      - name: Primed
        if: ${{ steps.caches.outputs.build == 'true' }}
        shell: bash
        run: touch "${{ steps.caches.outputs.dir }}/primed"
      - name: Status (the result of this job's build and tests)
        if: ${{ always() && inputs.status && steps.dispatch.outcome == 'skipped' }}
        shell: bash
        env:
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: built and tested on ${{ runner.name }} (job ${{ job.status }})
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/tailscale-status.sh

  # On captain's Windows runners with MSVC: the DLL (whose C parts llvm-mingw compiles), its import library, and the
  # test program with the Windows 10 manifest.
  tailscale-windows:
    if: inputs.windows
    runs-on: [self-hosted, fleet, Windows, X64, captain]
    timeout-minutes: ${{ inputs.prime && 30 || 2 }}
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.windows-slots) }}
    env:
      OS: windows
      SHA: ${{ inputs.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
      - name: Caches for these pins
        id: caches
        env:
          KEY: ${{ hashFiles('src/tailscale/pins.cmake', 'src/tailscale/go.mod', 'src/tailscale/go.sum') }}
          COLD: ${{ inputs.prime && inputs.cold }}
          SKIP_PRIMED: ${{ inputs.skip-primed }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA "nexus-ci-tailscale"
          $dir = Join-Path $root $env:KEY.Substring(0, 16)
          # A cold measurement (tailscale-prime's cold input) builds in a key directory of its own, removed after.
          if ($env:COLD -eq 'true') { $dir = Join-Path $root "cold-$env:GITHUB_RUN_ID-${{ matrix.slot }}" }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path "$dir\used" -Value ''
          New-Item -ItemType Directory -Force -Path "$dir\go\mod", "$dir\go\build", "$dir\downloads" | Out-Null
          # Unused for 7 days: by its used file, or, while it has none (a job on another runner is creating it, and
          # writes it next), by the directory's creation time.
          $cutoff = (Get-Date).AddDays(-7)
          Get-ChildItem -Directory $root | Where-Object { $_.FullName -ne $dir } | ForEach-Object {
            $used = Join-Path $_.FullName 'used'
            $last = if (Test-Path $used) { (Get-Item $used).LastWriteTime } else { $_.CreationTime }
            if ($last -lt $cutoff) {
              Write-Output "removing $($_.FullName), unused since $last"
              Remove-Item -Recurse -Force $_.FullName
            }
          }
          "NEXUS_GO_CACHES=$dir\go" >> $env:GITHUB_ENV
          "NEXUS_TAILSCALE_DOWNLOADS=$dir\downloads" >> $env:GITHUB_ENV
          # Compiles use the runner's core share and tests the processor count, as ci.yml's windows job.
          $jobs = [Environment]::ProcessorCount
          $share = 0
          if ("$env:NOVA_JOB_CORES" -match '^[1-9][0-9]*$' -and [int]::TryParse($env:NOVA_JOB_CORES, [ref]$share)) {
            $jobs = $share
            Write-Output "NOVA_JOB_CORES on ${env:COMPUTERNAME} is ${share}: jobs use it"
          } else {
            $shown = if ($null -eq $env:NOVA_JOB_CORES) { 'unset' } else { $env:NOVA_JOB_CORES }
            Write-Output "NOVA_JOB_CORES on ${env:COMPUTERNAME} is '$shown', not a positive integer: jobs use the processor count, $jobs"
          }
          "JOBS=$jobs" >> $env:GITHUB_ENV
          "TEST_JOBS=$([Environment]::ProcessorCount)" >> $env:GITHUB_ENV
          "dir=$dir" >> $env:GITHUB_OUTPUT
          $primed = Test-Path "$dir\primed"
          "primed=$(if ($primed) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          if ($env:SKIP_PRIMED -eq 'true' -and $primed) {
            "$env:COMPUTERNAME is primed for these pins already: nothing to build"
            "build=false" >> $env:GITHUB_OUTPUT
          } else {
            "build=true" >> $env:GITHUB_OUTPUT
          }
      - name: Status pending (this job builds and tests this commit)
        if: ${{ inputs.status && (inputs.prime || steps.caches.outputs.primed == 'true') }}
        env:
          STATE: pending
          DESCRIPTION: building and testing on ${{ runner.name }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./.github/tailscale-status.ps1
      - name: Not primed here, so tailscale-prime builds and tests this commit (this job fails)
        id: dispatch
        if: ${{ !inputs.prime && steps.caches.outputs.primed != 'true' }}
        env:
          DIR: ${{ steps.caches.outputs.dir }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: ./.github/tailscale-dispatch.ps1
      - name: Configure (Release, MSVC x64)
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: |
          cmake -S src/tailscale -B build-tailscale -A x64 "-DNEXUS_GO_MODCACHE=$env:NEXUS_GO_CACHES\mod" "-DNEXUS_GO_BUILDCACHE=$env:NEXUS_GO_CACHES\build" "-DNEXUS_TAILSCALE_DOWNLOADS=$env:NEXUS_TAILSCALE_DOWNLOADS"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure exited $LASTEXITCODE" }
      # Measurements, in tailscale-prime only: the Go caches the generated build really passes to Go (GOCACHE and
      # GOMODCACHE, read from the build files; nothing else of the environment is printed) and how many files Go's
      # build cache holds before and after the build.
      - name: Go's caches in use
        if: ${{ inputs.prime && steps.caches.outputs.build == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.vcxproj build-tailscale | Select-String -Pattern '(GOCACHE|GOMODCACHE)=[^ "&;]+' -AllMatches |
            ForEach-Object { $_.Matches.Value } | Sort-Object -Unique
          "build cache files before the build: $((Get-ChildItem -Recurse -File "$env:NEXUS_GO_CACHES\build").Count)"
      # tailscale_checks: the test program, nexus's build of the shim, go vet and the licence notices' check, side by
      # side (tests/tailscale).
      - name: Build the shim (both builds) and its test program, go vet, and the licence notices
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: |
          cmake --build build-tailscale --config Release --parallel $env:JOBS --target tailscale_checks
          if ($LASTEXITCODE -ne 0) { throw "cmake --build exited $LASTEXITCODE" }
      - name: Tests
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: |
          ctest --test-dir build-tailscale -C Release -L tailscale -j $env:TEST_JOBS --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "ctest exited $LASTEXITCODE" }
      # In tailscale-prime only: the build cache's files after the build; the antivirus's state (measured, never
      # changed); the time to read every build cache file twice (the first read is scanned on access by a real-time
      # scanner, the second mostly not); and a no-change rebuild (the shim's sources touched, so Go runs and finds
      # everything cached).
      - name: Cache, antivirus and no-change measurements
        if: ${{ inputs.prime && steps.caches.outputs.build == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -File "$env:NEXUS_GO_CACHES\build"
          "build cache files after the build: $($files.Count), $([math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB)) MB"
          try {
            $mp = Get-MpComputerStatus
            "antivirus: real-time protection $($mp.RealTimeProtectionEnabled), on-access $($mp.OnAccessProtectionEnabled), engine $($mp.AMEngineVersion)"
          } catch { "antivirus status not readable here: $($_.Exception.Message)" }
          try {
            $ex = (Get-MpPreference).ExclusionPath
            "antivirus path exclusions: $(if ($ex) { $ex -join '; ' } else { 'none listed' })"
          } catch { "antivirus exclusions not readable here: $($_.Exception.Message)" }
          foreach ($pass in 1, 2) {
            $t = Measure-Command { foreach ($f in $files) { [void][IO.File]::ReadAllBytes($f.FullName) } }
            "read every build cache file, pass ${pass}: $([math]::Round($t.TotalSeconds, 1)) s"
          }
          Get-ChildItem src/tailscale/shim/*.go | ForEach-Object { $_.LastWriteTime = Get-Date }
          $t = Measure-Command { cmake --build build-tailscale --config Release --parallel $env:JOBS --target tailscale_checks | Out-Null }
          if ($LASTEXITCODE -ne 0) { throw "the no-change rebuild exited $LASTEXITCODE" }
          "no-change rebuild (shim sources touched, Go cache warm): $([math]::Round($t.TotalSeconds, 1)) s"
      - name: Primed
        if: ${{ steps.caches.outputs.build == 'true' && !(inputs.prime && inputs.cold) }}
        run: Set-Content -Path "${{ steps.caches.outputs.dir }}\primed" -Value ''
      - name: Status (the result of this job's build and tests)
        if: ${{ always() && inputs.status && steps.dispatch.outcome == 'skipped' }}
        env:
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: built and tested on ${{ runner.name }} (job ${{ job.status }})
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./.github/tailscale-status.ps1
      - name: Remove the cold measurement's key directory
        if: ${{ always() && inputs.prime && inputs.cold }}
        run: |
          $dir = "${{ steps.caches.outputs.dir }}"
          if ($dir -and (Split-Path -Leaf $dir) -like 'cold-*') { Remove-Item -Recurse -Force $dir }
