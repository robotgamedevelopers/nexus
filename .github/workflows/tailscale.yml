# The Tailscale shim (docs/tailscale.md, layer 0) on macOS and Linux, in jobs of its own (Windows: tailscale-windows.yml,
# which no per-commit workflow calls): src/tailscale/CMakeLists.txt builds it alone, without Prax, so a job is the
# shim's Go build (nexus's and the test program's), its test program and `ctest -L tailscale` (no test here reaches
# another machine). Called by ci.yml for every pull request and push to main, with the 2-minute limit of those events,
# and by cache-warm.yml and nightly.yml, without it. Every job here runs in every call: a call that does not want one
# does not call this workflow.
#
# The verdict is a commit status. Each OS's result for a commit is the status tailscale-<os> (tailscale-macos,
# tailscale-linux, tailscale-windows) on that exact commit: on a pull request its head, which is what these jobs check
# out (not the merge commit the other jobs build), and on a push or a merge queue the pushed commit. It is set only by
# a job that built and tested that commit on that OS: success or failure, or failure when the job is cancelled or times
# out. A lander waits for tailscale-macos and tailscale-linux to be success on the head it lands (ci.yml runs those
# two per commit, macOS for arm64 alone; the nightly runs Windows, whose restore alone does not fit 2 minutes, and
# macOS's x86_64 slice under Rosetta); a missing or pending one is not a pass.
#
# Caches. Go comes from the runner's machine (PATH, or ~/sdk/bin as the fleet installs it) and fetches the pinned Go
# toolchain into the module cache itself. The toolchain, the modules, Go's build cache and (on Windows) llvm-mingw live
# outside the workspace, in a directory of their own on the runner's machine that no other job cleans:
#   macOS    ~/Library/Caches/nexus-ci-tailscale/<key>
#   Linux    ~/.cache/nexus-ci-tailscale/<key>
#   Windows  %LOCALAPPDATA%\nexus-ci-tailscale\<key>   (the windows job removes what it does not know in
#                                                       %LOCALAPPDATA%\nexus-ci\<runner>, so not there)
# where <key> is the first 16 hex digits of the sha256 over src/tailscale/pins.cmake, go.mod and go.sum: the pins and
# nothing else, so only a pin change is cold. Everything in it is checked: the toolchain and modules against go.sum and
# Go's checksum database, llvm-mingw against its pinned sha256 (cmake/tailscale.cmake). The machine's runners share it
# (Go locks its caches; llvm-mingw is renamed into place). A key directory unused for 7 days is removed: its own time on
# macOS and Linux, its `used` file on Windows (or, while it has none, which is while a job is still creating it, the
# directory's creation time).
#
# Primed. A key directory holds `primed` once a build and the tests have finished in it. A cold build (a new key: the
# toolchain and modules downloaded, tsnet compiled) does not fit 2 minutes (docs/tailscale.md has the numbers). The jobs
# run on GitHub-hosted runners, which start empty: the key directory comes from the cache cache-warm.yml saves on main
# (prime: true, save: true, no 2-minute limit), and a per-commit job that finds no primed cache for its pins builds
# nothing, sets its status to failure and fails, saying to run cache-warm.
#
# Permissions come from the caller: ci.yml grants contents: read and statuses: write; cache-warm.yml and nightly.yml
# contents: read.

name: tailscale

on:
  workflow_call:
    inputs:
      prime:
        description: true from cache-warm.yml and nightly.yml (no 2-minute limit); false from ci.yml
        type: boolean
        required: true
      sha:
        description: the commit to check out, build and test (empty for the caller's)
        type: string
        default: ""
      save:
        description: with prime, save the primed key directory as the cache per-commit jobs restore
        type: boolean
        default: false
      status:
        description: set the commit status tailscale-<os> on that commit to the result
        type: boolean
        default: false
      skip-primed:
        description: a slot whose machine is already primed marks its key directory used and builds nothing (nightly)
        type: boolean
        default: false
      cold:
        description: with prime, saves no cache (tailscale-windows.yml's cold build measures a cold one)
        type: boolean
        default: false
      rosetta:
        description: macOS also builds the x86_64 slice and runs it under Rosetta (false from ci.yml, whose 2 minutes it does not fit; the nightly runs it)
        type: boolean
        default: true
      # The matrix slots of each job, a JSON array: one from ci.yml and for a dispatch; from the nightly as many as the
      # OS has runners, so that GitHub may place one on every machine.
      macos-slots:
        type: string
        default: "[1]"
      linux-slots:
        type: string
        default: "[1]"

jobs:
  # macOS builds arm64 and x86_64 (joined by lipo) and runs both, the second under Rosetta; with rosetta false (ci.yml),
  # arm64 alone.
  tailscale-macos:
    runs-on: macos-26
    timeout-minutes: ${{ inputs.prime && 30 || 2 }}
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.macos-slots) }}
    env:
      OS: macos
      SHA: ${{ inputs.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
      # Go for the shim's build where the hosted image has none (macOS), at the shim's pin, so Go fetches no other.
      # The Linux and Windows images carry a Go, which fetches the pinned toolchain into the cached module cache.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: runner.os == 'macOS'
        with:
          go-version: '1.27.4'
          cache: false
      # The pins' key directory, from the cache cache-warm saved on main (a hosted runner starts empty).
      - name: Restore the cache for these pins
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/Library/Caches/nexus-ci-tailscale
          key: tailscale-macos-v2-${{ hashFiles('src/tailscale/pins.cmake', 'src/tailscale/go.mod', 'src/tailscale/go.sum') }}
      - name: Caches for these pins
        id: caches
        shell: bash
        env:
          KEY: ${{ hashFiles('src/tailscale/pins.cmake', 'src/tailscale/go.mod', 'src/tailscale/go.sum') }}
          SKIP_PRIMED: ${{ inputs.skip-primed }}
        run: |
          set -euo pipefail
          root="$HOME/Library/Caches/nexus-ci-tailscale"
          dir="$root/${KEY:0:16}"
          mkdir -p "$dir/go/mod" "$dir/go/build"
          # The key directory's own time is its last use; Go's module cache is read-only, hence the chmod.
          touch "$dir"
          find "$root" -mindepth 1 -maxdepth 1 -type d ! -path "$dir" -mtime +7 -print -exec chmod -R u+w {} + -exec rm -rf {} +
          echo "NEXUS_GO_CACHES=$dir/go" >> "$GITHUB_ENV"
          echo "JOBS=$(sh .github/job-cores.sh)" >> "$GITHUB_ENV"
          echo "TEST_JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          primed=false
          if [ -f "$dir/primed" ]; then primed=true; fi
          echo "primed=$primed" >> "$GITHUB_OUTPUT"
          if [ "$SKIP_PRIMED" = true ] && [ "$primed" = true ]; then
            echo "$(hostname -s) is primed for these pins already: nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Status pending (this job builds and tests this commit)
        if: ${{ inputs.status && (inputs.prime || steps.caches.outputs.primed == 'true') }}
        shell: bash
        env:
          STATE: pending
          DESCRIPTION: building and testing on ${{ runner.name }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/tailscale-status.sh
      - name: No primed cache for these pins (this job fails; cache-warm makes one)
        if: ${{ !inputs.prime && steps.caches.outputs.primed != 'true' }}
        shell: bash
        run: |
          echo "::error::no primed Tailscale cache for these pins on main: run the cache-warm workflow on main (gh workflow run cache-warm.yml --ref main), then re-run; a cold Go build does not fit the 2 minutes"
          exit 1
      - name: Configure (Release, ${{ inputs.rosetta && 'arm64 and x86_64' || 'arm64' }})
        if: ${{ steps.caches.outputs.build == 'true' }}
        env:
          ARCHS: ${{ inputs.rosetta && 'arm64;x86_64' || 'arm64' }}
        run: >-
          cmake -S src/tailscale -B build-tailscale -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=$ARCHS"
          "-DNEXUS_GO_MODCACHE=$NEXUS_GO_CACHES/mod" "-DNEXUS_GO_BUILDCACHE=$NEXUS_GO_CACHES/build"
      # tailscale_checks: the test program, nexus's build of the shim, go vet and the licence notices' check, side by
      # side (tests/tailscale).
      - name: Build the shim (both builds) and its test program, go vet, and the licence notices
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: cmake --build build-tailscale --parallel "$JOBS" --target tailscale_checks
      - name: Tests (arm64)
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: bash .github/ctest.sh --test-dir build-tailscale -L tailscale -j "$TEST_JOBS" --output-on-failure
      # The x86_64 slice runs every group (tests/tailscale/CMakeLists.txt's lists), side by side as ctest runs them; the
      # children that lock_two_process and quiet start are the program again, which macOS runs as its native (arm64)
      # slice.
      - name: Tests (x86_64, under Rosetta)
        if: ${{ steps.caches.outputs.build == 'true' && inputs.rosetta }}
        shell: bash
        run: |
          set -euo pipefail
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::error::Rosetta is not installed on $(hostname -s), so the shim's x86_64 slice cannot run here: install it (softwareupdate --install-rosetta --agree-to-license) through the fleet play"
            exit 1
          fi
          groups=(tailnet sign_in restart expiry control_down auth_key long_sign_in control_error control_blackhole
            close_each_other version licences_unit names handles start_checks panics_unit licences state_dir refusals
            lock lock_two_process panics log_cap quiet unreachable certificate watch threads)
          printf '%s\n' "${groups[@]}" | xargs -n 1 -P "$TEST_JOBS" /bin/bash -ec '
            cd "build-tailscale/tests/tailscale/work_$1"
            exec arch -x86_64 ../tailscale_test "$1"
          ' _
          (cd build-tailscale/tests/tailscale/work_refuses_inherited_key &&
            TS_AUTHKEY=a-value-that-must-not-be-shown arch -x86_64 ../tailscale_test refuses_inherited_key)
      - name: Primed
        if: ${{ steps.caches.outputs.build == 'true' }}
        shell: bash
        run: touch "${{ steps.caches.outputs.dir }}/primed"
      - name: Save the cache for these pins (cache-warm only)
        if: ${{ inputs.prime && inputs.save && !(inputs.cold) && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/Library/Caches/nexus-ci-tailscale
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Status (the result of this job's build and tests)
        if: ${{ always() && inputs.status }}
        shell: bash
        env:
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: built and tested on ${{ runner.name }} (job ${{ job.status }})
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/tailscale-status.sh

  # On the fleet's Linux runners with clang and lld, as build-and-unit-linux; also the licence notices
  # (src/tailscale/NOTICES.md) against the modules the shim links on every platform.
  tailscale-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.prime && 30 || 2 }}
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.linux-slots) }}
    env:
      CC: clang
      CXX: clang++
      OS: linux
      SHA: ${{ inputs.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
      # Go for the shim's build where the hosted image has none (macOS), at the shim's pin, so Go fetches no other.
      # The Linux and Windows images carry a Go, which fetches the pinned toolchain into the cached module cache.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: runner.os == 'macOS'
        with:
          go-version: '1.27.4'
          cache: false
      # The pins' key directory, from the cache cache-warm saved on main (a hosted runner starts empty).
      - name: Restore the cache for these pins
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/nexus-ci-tailscale
          key: tailscale-linux-v2-${{ hashFiles('src/tailscale/pins.cmake', 'src/tailscale/go.mod', 'src/tailscale/go.sum') }}
      - name: Caches for these pins
        id: caches
        shell: bash
        env:
          KEY: ${{ hashFiles('src/tailscale/pins.cmake', 'src/tailscale/go.mod', 'src/tailscale/go.sum') }}
          SKIP_PRIMED: ${{ inputs.skip-primed }}
        run: |
          set -euo pipefail
          root="$HOME/.cache/nexus-ci-tailscale"
          dir="$root/${KEY:0:16}"
          mkdir -p "$dir/go/mod" "$dir/go/build"
          # The key directory's own time is its last use; Go's module cache is read-only, hence the chmod.
          touch "$dir"
          find "$root" -mindepth 1 -maxdepth 1 -type d ! -path "$dir" -mtime +7 -print -exec chmod -R u+w {} + -exec rm -rf {} +
          echo "NEXUS_GO_CACHES=$dir/go" >> "$GITHUB_ENV"
          echo "JOBS=$(sh .github/job-cores.sh)" >> "$GITHUB_ENV"
          echo "TEST_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          primed=false
          if [ -f "$dir/primed" ]; then primed=true; fi
          echo "primed=$primed" >> "$GITHUB_OUTPUT"
          if [ "$SKIP_PRIMED" = true ] && [ "$primed" = true ]; then
            echo "$(hostname -s) is primed for these pins already: nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Status pending (this job builds and tests this commit)
        if: ${{ inputs.status && (inputs.prime || steps.caches.outputs.primed == 'true') }}
        shell: bash
        env:
          STATE: pending
          DESCRIPTION: building and testing on ${{ runner.name }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/tailscale-status.sh
      - name: No primed cache for these pins (this job fails; cache-warm makes one)
        if: ${{ !inputs.prime && steps.caches.outputs.primed != 'true' }}
        shell: bash
        run: |
          echo "::error::no primed Tailscale cache for these pins on main: run the cache-warm workflow on main (gh workflow run cache-warm.yml --ref main), then re-run; a cold Go build does not fit the 2 minutes"
          exit 1
      - name: Configure (Release)
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: >-
          cmake -S src/tailscale -B build-tailscale -DCMAKE_BUILD_TYPE=Release -DCMAKE_LINKER_TYPE=LLD
          "-DNEXUS_GO_MODCACHE=$NEXUS_GO_CACHES/mod" "-DNEXUS_GO_BUILDCACHE=$NEXUS_GO_CACHES/build"
      # tailscale_checks: the test program, nexus's build of the shim, go vet and the licence notices' check, side by
      # side (tests/tailscale).
      - name: Build the shim (both builds) and its test program, go vet, and the licence notices
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: cmake --build build-tailscale --parallel "$JOBS" --target tailscale_checks
      - name: Tests
        if: ${{ steps.caches.outputs.build == 'true' }}
        run: bash .github/ctest.sh --test-dir build-tailscale -L tailscale -j "$TEST_JOBS" --output-on-failure
      - name: Primed
        if: ${{ steps.caches.outputs.build == 'true' }}
        shell: bash
        run: touch "${{ steps.caches.outputs.dir }}/primed"
      - name: Save the cache for these pins (cache-warm only)
        if: ${{ inputs.prime && inputs.save && !(inputs.cold) && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/nexus-ci-tailscale
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Status (the result of this job's build and tests)
        if: ${{ always() && inputs.status }}
        shell: bash
        env:
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: built and tested on ${{ runner.name }} (job ${{ job.status }})
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/tailscale-status.sh
