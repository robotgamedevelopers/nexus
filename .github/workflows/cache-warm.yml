# Makes the caches ci.yml's GitHub-hosted jobs restore (ci.yml's header says what each holds), on main only, so that
# every pull request may restore them. It builds with the same steps as the jobs it serves
# (.github/actions/hosted-caches, nexus-build, windows-build; tailscale.yml with prime) and saves the result under a new
# key; ci.yml's jobs then restore the newest. It is not a per-commit check and has no 2-minute limit: a cold build of
# Prax (a new pin) or of the Tailscale shim's Go dependencies does not fit one, and per-commit jobs never build them
# cold. Daily, so ccache holds main's newest objects; and by hand after a Prax or Tailscale pin changes
# (gh workflow run cache-warm.yml --ref main), before the pull requests that need the new pin run.

name: cache-warm

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warm
  cancel-in-progress: false

jobs:
  unix:
    if: github.ref == 'refs/heads/main'
    name: ${{ matrix.cache }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - cache: mac-release
            os: macos-26
            config: mac-release
            brew: ccache ninja protobuf
            targets: ""
          - cache: mac-asan-units
            os: macos-26
            config: mac-asan
            brew: ccache ninja
            targets: >-
              model_test overlay_test nexus_terminal_watch_tests sync_test redial_test secrets_test signin_test
              store_test durable_test driver_protocol_test supervisor_test server_pass_test wire_test
              nexus_versions_test builds_test handover_test supervision_test migration_test takeover_test
          - cache: mac-asan-walks
            os: macos-26
            config: mac-asan
            brew: ccache ninja
            targets: >-
              overlay_walk watch_walk trace_walk strip_walk link_walk reconnect_walk secrets_walk signin_walk
              journal_walk store_lock_walk supervisor_walk pass_walk builds_walk handover_walk supervision_walk
              migration_walk takeover_walk
          - cache: linux-release
            os: ubuntu-24.04
            config: linux-release
            apt: ccache ninja-build lld
            targets: ""
          - cache: linux-asan-units
            os: ubuntu-24.04
            config: linux-asan
            apt: ccache ninja-build lld
            targets: >-
              model_test overlay_test nexus_terminal_watch_tests sync_test redial_test secrets_test signin_test
              store_test durable_test driver_protocol_test supervisor_test server_pass_test wire_test
              nexus_versions_test builds_test handover_test supervision_test migration_test takeover_test
          - cache: linux-asan-walks
            os: ubuntu-24.04
            config: linux-asan
            apt: ccache ninja-build lld
            targets: >-
              overlay_walk watch_walk trace_walk strip_walk link_walk reconnect_walk secrets_walk signin_walk
              journal_walk store_lock_walk supervisor_walk pass_walk builds_walk handover_walk supervision_walk
              migration_walk takeover_walk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Tools and the newest cache, if any
        id: caches
        uses: ./.github/actions/hosted-caches
        with:
          name: ${{ matrix.cache }}
          require: "false"
          brew: ${{ matrix.brew }}
          apt: ${{ matrix.apt }}
      - name: Configure and build
        uses: ./.github/actions/nexus-build
        with:
          config: ${{ matrix.config }}
          targets: ${{ matrix.targets }}
      - name: Record the sources the build was made from
        shell: bash
        run: bash .github/source-times.sh record build/.nexus-ci-sources
      - name: Trim ccache to its size
        shell: bash
        run: ccache --cleanup
      - name: Save
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            build
            ~/nexus-ci
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.caches.outputs.key }}

  windows-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The newest cache, if any; configure and build
        id: build
        uses: ./.github/actions/windows-build
        with:
          require: "false"
      - name: Record the sources the build was made from
        shell: bash
        run: bash .github/source-times.sh record C:/nexus-ci/sources.txt
      - name: Save
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            C:\nexus-ci
            ~\.rustup\toolchains\1.98.1-x86_64-pc-windows-msvc
            ~\.cargo\registry\index
            ~\.cargo\registry\cache
          key: ${{ steps.build.outputs.key }}

  # The Tailscale shim's primed key directory on each OS, built and tested with no time limit, saved for its pins.
  tailscale:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tailscale.yml
    permissions:
      contents: read
    with:
      prime: true
      save: true
