# Makes the caches ci.yml's GitHub-hosted jobs restore (ci.yml's header says what each holds), on main only, so that
# every pull request may restore them. It builds with the same steps as the jobs it serves
# (.github/actions/hosted-caches, nexus-build, windows-build; tailscale.yml with prime) and saves the result under a new
# key; ci.yml's jobs then restore the newest. It is not a per-commit check and has no 2-minute limit: a cold build of
# Prax (a new pin) or of the Tailscale shim's Go dependencies does not fit one, and per-commit jobs never build them
# cold. On every push to main, so a pull request's build starts from main as it is now and rebuilds only what the
# pull request changed (with a cache from an older main, every file main changed since is rebuilt too, and the hosted
# per-commit jobs went past 2 minutes on 2026-11-25); daily; and by hand after a Prax or Tailscale pin changes
# (gh workflow run cache-warm.yml --ref main), before the pull requests that need the new pin run. The Tailscale shim's
# cache is keyed by its pins alone, so it is made daily and by hand, not on every push.
#
# Each build cache is about 0.5 GB and the repository's caches share one quota, so after saving, a job deletes the
# older caches of its own name (the one it restored and any before it); a pull request restores the newest, and looks
# it up once more when the one it matched is deleted while it downloads (hosted-caches, windows-build).

name: cache-warm

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cache-warm
  cancel-in-progress: false

jobs:
  unix:
    if: github.ref == 'refs/heads/main'
    name: ${{ matrix.cache }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ci.yml's build-macos (Debug, no LTO) and the nightly's build-linux-asan (every program its parts run).
          - cache: mac-debug
            os: macos-26
            config: mac-debug
            brew: ninja protobuf
            brew-keep: protobuf abseil
            targets: ""
          - cache: linux-asan
            os: ubuntu-24.04
            config: linux-asan
            apt: ""
            targets: >-
              model_test overlay_test nexus_terminal_watch_tests sync_test redial_test secrets_test signin_test
              store_test durable_test driver_protocol_test supervisor_test server_pass_test wire_test
              nexus_versions_test builds_test handover_test supervision_test migration_test takeover_test
              overlay_walk watch_walk trace_walk strip_walk link_walk reconnect_walk secrets_walk signin_walk
              journal_walk store_lock_walk supervisor_walk pass_walk builds_walk handover_walk supervision_walk
              migration_walk takeover_walk
          - cache: linux-release
            os: ubuntu-24.04
            config: linux-release
            apt: libprotobuf-dev protobuf-compiler zlib1g-dev libssl-dev
            targets: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Tools and the newest cache, if any
        id: caches
        uses: ./.github/actions/hosted-caches
        with:
          name: ${{ matrix.cache }}
          require: "false"
          brew: ${{ matrix.brew }}
          apt: ${{ matrix.apt }}
          brew-keep: ${{ matrix.brew-keep }}
      # cargo runs only when a policy source is newer than its outputs, so a cache could keep crates built by a Rust the
      # jobs no longer use (the image's, before Rust was pinned), and then every pull request that touches the policy
      # rebuilt all of them (about 100 s on 4 cores, PR #89 on 2026-11-25). Removing the outputs makes cargo run here,
      # with the pinned Rust and the jobs' own environment, so the cached target directory matches what they build.
      # The Homebrew kegs (hosted-caches' brew-keep), in a cache of their own: saved once per image, kept until the
      # image's name changes (the key), so a job links the same versions every time.
      - name: Save the Homebrew kegs
        if: steps.caches.outputs.brew-key != '' && steps.caches.outputs.brew-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.caches.outputs.brew-paths }}
          key: ${{ steps.caches.outputs.brew-key }}
      - name: The policy crate built by the pinned Rust
        shell: bash
        run: rm -f build/policy-rust/release/libnexus_policy_runtime.a build/nexus-policy
      - name: Configure and build
        uses: ./.github/actions/nexus-build
        with:
          config: ${{ matrix.config }}
          targets: ${{ matrix.targets }}
      - name: Record the sources the build was made from
        shell: bash
        run: bash .github/source-times.sh record build/.nexus-ci-sources
      # ccache is not kept in the cache. A pull request's build rebuilds only the files whose content changed
      # (.github/source-times.sh keeps every other file's old time), and ccache cannot hold a result for content it has
      # not seen: on 2026-11-25 big pull requests' builds hit it in 0 to 4 percent of their compiles (1 of 24, 0 of 28,
      # 0 of 15). Kept, it only made the cache larger and slower to restore. The sizes are printed for the record.
      - name: Leave ccache out of the cache
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
          rm -rf "${CCACHE_DIR:?}"
          mkdir -p "$CCACHE_DIR"
          for path in build "$NEXUS_CACHES"/* ~/.cargo/registry/index ~/.cargo/registry/cache; do
            if [ -e "$path" ]; then du -sh "$path"; fi
          done
      - name: Save
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            build
            ~/nexus-ci
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.caches.outputs.key }}
      - name: Delete this name's older caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.cache }}
          KEY: ${{ steps.caches.outputs.key }}
        run: bash .github/cache-prune.sh "$NAME" "$KEY"

  # The iOS caches (ios.yml's ios-device and ios-simulator). Until the iOS port is on main, its tree comes from port/ios
  # (pull request #88), with main's CI steps (.github/actions, source-times.sh, cache-prune.sh) over it, so the cache is
  # what an iOS pull request rebased onto main builds; once cmake/ios.cmake is on main, main's own tree is built.
  ios:
    if: github.ref == 'refs/heads/main'
    name: ios-${{ matrix.target }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [device, simulator]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: The iOS tree
        shell: bash
        run: |
          set -euo pipefail
          if [ -f cmake/ios.cmake ]; then
            echo "main has the iOS port: building main"
            exit 0
          fi
          main=$(git rev-parse HEAD)
          git fetch --no-tags --depth=1 origin port/ios
          git checkout -q --detach -f FETCH_HEAD
          git checkout -q "$main" -- .github/actions .github/source-times.sh .github/cache-prune.sh
          git submodule update --init --recursive --depth 1
          if [ ! -f cmake/ios.cmake ]; then
            echo "::error::neither main nor port/ios has cmake/ios.cmake: there is no iOS tree to build"
            exit 1
          fi
          echo "building port/ios at $(git rev-parse --short FETCH_HEAD) with main's CI steps at $(git rev-parse --short "$main")"
      - name: Tools and the newest cache, if any
        id: caches
        uses: ./.github/actions/hosted-caches
        with:
          name: ios-${{ matrix.target }}
          require: "false"
          brew: ninja
      - name: Rust's iOS standard library
        shell: bash
        run: rustup target add --toolchain "$RUSTUP_TOOLCHAIN" aarch64-apple-ios aarch64-apple-ios-sim
      - name: Configure and build
        uses: ./.github/actions/nexus-build
        with:
          config: ios-${{ matrix.target }}
      - name: Record the sources the build was made from
        shell: bash
        run: bash .github/source-times.sh record build/.nexus-ci-sources
      # ccache is not kept in the cache (the unix job says why); the sizes are printed for the record.
      - name: Leave ccache out of the cache
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
          rm -rf "${CCACHE_DIR:?}"
          mkdir -p "$CCACHE_DIR"
          for path in build "$NEXUS_CACHES"/* ~/.cargo/registry/index ~/.cargo/registry/cache; do
            if [ -e "$path" ]; then du -sh "$path"; fi
          done
      - name: Save
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            build
            ~/nexus-ci
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.caches.outputs.key }}
      - name: Delete this name's older caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ios-${{ matrix.target }}
          KEY: ${{ steps.caches.outputs.key }}
        run: bash .github/cache-prune.sh "$NAME" "$KEY"

  windows-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The newest cache, if any; configure and build
        id: build
        uses: ./.github/actions/windows-build
        with:
          require: "false"
      # Prax's libraries that the native window links (prax::<name> is the target pr_<name>), built into the cache too,
      # so that a pull request turning the window on for Windows (NEXUS_WINDOW) compiles only nexus's own code within
      # the windows job's 2 minutes rather than these from cold (124 s and cancelled, run 45713484539). Prax's options do
      # not depend on nexus's, so these objects stay current when such a pull request configures the directory again.
      - name: Prax's libraries the window links
        run: |
          $targets = @('pr_html', 'pr_html_quickjs', 'pr_svg_quickjs', 'pr_url_quickjs', 'pr_dom', 'pr_fetch', 'pr_net',
            'pr_tls', 'pr_http', 'pr_image_select', 'pr_compress_select', 'pr_text', 'pr_font', 'pr_draw', 'pr_audio',
            'pr_png', 'pr_studio_app', 'pr_app_select', 'pr_gpu_select', 'pr_draw_select', 'pr_surface')
          cmake --build "$env:NEXUS_BUILD" --config Release --parallel $env:JOBS --target @targets
          if ($LASTEXITCODE -ne 0) { throw "cmake --build of Prax's window libraries exited $LASTEXITCODE" }
      - name: Record the sources the build was made from
        shell: bash
        run: bash .github/source-times.sh record D:/nexus-ci/sources.txt
      # The sizes are printed for the record.
      - name: Sizes
        shell: bash
        run: |
          set -euo pipefail
          du -sh D:/nexus-ci/*
          echo "$(find D:/nexus-ci -type f | wc -l) files in D:/nexus-ci"
      - name: Save
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\nexus-ci
          key: ${{ steps.build.outputs.key }}
      - name: Delete this name's older caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.build.outputs.key }}
        run: bash .github/cache-prune.sh windows-release "$KEY"

  # The Tailscale shim's primed key directory on each OS, built and tested with no time limit, saved for its pins.
  tailscale:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    uses: ./.github/workflows/tailscale.yml
    permissions:
      contents: read
    with:
      prime: true
      save: true
  tailscale-windows:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    uses: ./.github/workflows/tailscale-windows.yml
    permissions:
      contents: read
    with:
      prime: true
      save: true
