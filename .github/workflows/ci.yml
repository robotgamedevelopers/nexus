# CI for nexus: the build with its unit and functional tests, the model under the sanitizers, the Claude driver
# (drivers/claude) and the tab label's trace checks, as jobs in parallel on the fleet's macOS runners (never
# GitHub-hosted); and the build without the window, its unit and functional tests and the sanitizers' programs, the
# TLA+ models with their trace checks (in parallel shards), and the code generated from
# schema/Nexus.schema regenerated at schema's pin, on the fleet's Linux runners; the functional tests inside WSL2 on
# captain (wsl2-functional), where nexus runs everything but the overlay on Windows; and the Windows build with its unit
# tests (windows), whose WSL2 terminal test then runs from inside captain's WSL2 (wsl2-terminal). Every pull request runs it, whatever its base,
# and so does every push to main.
#
# Each per-commit job finishes in 2 minutes: timeout-minutes says so here, and the runners' own job hook
# enforces the same limit. Longer work belongs in a nightly (schedule) workflow.
#
# Warnings are errors: CMakeLists.txt sets the flags, so these jobs use the plain build commands.
#
# Java and the TLC jar come from the runner's machine (the fleet installs them), never downloaded here. The
# jar must be the pinned tla2tools.jar v1.7.4, whose sha256 is in .github/tla2tools.sha256; any other jar
# fails the job.
#
# Compiles use the job's share of its host's cores (JOBS, for `cmake --build --parallel`): NOVA_JOB_CORES, which each
# fleet runner exports, or the machine's core count where it is unset or not a positive integer (.github/job-cores.sh;
# the windows job does the same in pwsh). Runners share hosts, and a compile that took every core starved the other
# jobs on its host. Tests run one ctest job per core of the whole machine (TEST_JOBS, for `ctest -j`), as before: the
# model shards' TLC tests reserve 8 processors each (PROCESSORS) and run one at a time under a share of 2, and the
# functional tests mostly wait on processes and sockets, so a share made them slower (2 s to 16 s on hulk) for no
# saving in CPU. Caches live outside the workspace, under ~/Library/Caches/nexus-ci on the runner's machine, so a build
# is from scratch but Prax is not recompiled each time:
#   ccache/                    compiled objects, when the machine has ccache; CCACHE_BASEDIR makes the runners'
#                              different workspaces hit (it compiles with relative paths, so objects are identical)
#   lto/                       the linker's ThinLTO cache (Prax builds Release with ThinLTO, so a link recompiles
#                              everything it pulls in unless this cache holds it); it hits across workspaces only
#                              because ccache made the objects identical
# Both are shared by the machine's runners: ccache and LLVM's LTO cache write each entry to a temporary file and rename
# it into place, so concurrent jobs are safe.
#   <runner>/prax-downloads/   Prax's download cache (PR_DOWNLOAD_DIR). One per runner, because Prax writes a download
#                              straight to its final path and two jobs fetching one file at once corrupt it; a runner
#                              runs one job at a time.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-unit:
    # a pull request from a fork never runs on the fleet's runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The build compiles Metal shaders (Prax) and needs Xcode's Metal toolchain. Today only the runners labelled
    # `services` have Xcode; drop the extra label when every macOS runner has it.
    runs-on: [self-hosted, fleet, macOS, ARM64, services]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          caches="$HOME/Library/Caches/nexus-ci"
          mkdir -p "$caches/ccache" "$caches/lto" "$caches/$RUNNER_NAME/prax-downloads"
          {
            echo "NEXUS_CACHES=$caches"
            echo "PR_DOWNLOAD_DIR=$caches/$RUNNER_NAME/prax-downloads"
            echo "CCACHE_DIR=$caches/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=4G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            echo "JOBS=$(sh .github/job-cores.sh)"
            echo "TEST_JOBS=$(sysctl -n hw.ncpu)"
          } >> "$GITHUB_ENV"
      - name: Configure (Release)
        shell: bash
        run: |
          set -euo pipefail
          launcher=()
          if command -v ccache >/dev/null; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
                      -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache)
          else
            echo "::warning::no ccache on $(hostname -s): Prax compiles from scratch (install ccache there through the fleet play)"
          fi
          # The link's functional tests reach this machine over ssh by its loopback and, when it is on the tailnet, by
          # its tailnet address too (tests/link/CMakeLists.txt).
          tailnet=""
          if command -v tailscale >/dev/null; then
            tailnet=$(tailscale ip -4 2>/dev/null | head -n 1 || true)
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${launcher[@]}" \
            "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-cache_path_lto,$NEXUS_CACHES/lto" \
            "-DNEXUS_E2E_TAILNET=$tailnet"
      - name: Build
        run: cmake --build build --parallel "$JOBS"
      - name: Unit tests
        run: ctest --test-dir build -L unit -j "$TEST_JOBS" --output-on-failure
      # The headless window (system fonts), real child processes and a real file, and the link end to end (nexus-server
      # over ssh to this machine, mosh's transport over real UDP): not unit tests.
      # The frame budget (docs/frame-budget.md) times the frame thread on the real clock, so it runs after the others,
      # alone, and with every nova-reserve slot on this host when it can have them within 20 s; else shared.
      - name: Functional tests
        run: ctest --test-dir build -L functional -E '^window_frame_budget$' -j "$TEST_JOBS" --output-on-failure
      - name: Frame budget, alone
        shell: bash
        run: |
          set -uo pipefail
          frames=(ctest --test-dir build -R '^window_frame_budget$' --output-on-failure --no-tests=error)
          if command -v nova-reserve >/dev/null; then
            held="$RUNNER_TEMP/frame-budget-held"
            rm -f "$held"
            if nova-reserve run --exclusive --wait 20s --why "nexus CI frame budget" -- \
                sh -c 'touch "$0" && exec "$@"' "$held" "${frames[@]}"; then
              exit 0
            fi
            if [ -f "$held" ]; then
              exit 1
            fi
            echo "::notice::no exclusive hold on $(hostname -s) within 20 s: the frame budget runs shared"
          fi
          "${frames[@]}"
      - name: ccache hits in this job
        if: always()
        shell: bash
        run: if command -v ccache >/dev/null && [ -f "$CCACHE_STATSLOG" ]; then ccache --show-log-stats; fi

  # The model and its check programs built Debug with AddressSanitizer and UndefinedBehaviorSanitizer, which stop at
  # the first report: the unit tests, and the trace walks (the window's on every friend count, the overlay's) with every
  # fault (no TLC); the same for the link's states (src/sync) and their walks, and the store (store_test, durable_test
  # and journal_walk). Configured without the link's transport (NEXUS_LINK=OFF: mosh and protobuf), which these programs
  # do not use, so any macOS runner will do.
  sanitizers:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, macOS, ARM64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Prax's download cache, one per runner
        shell: bash
        run: |
          set -euo pipefail
          downloads="$HOME/Library/Caches/nexus-ci/$RUNNER_NAME/prax-downloads"
          mkdir -p "$downloads"
          echo "PR_DOWNLOAD_DIR=$downloads" >> "$GITHUB_ENV"
          echo "JOBS=$(sh .github/job-cores.sh)" >> "$GITHUB_ENV"
          echo "TEST_JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
      - name: Configure (Debug, ASan and UBSan)
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEXUS_LINK=OFF
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build the model checks, wire_test and nexus_versions_test
        run: cmake --build build --parallel "$JOBS" --target model_checks wire_test nexus_versions_test
      - name: Unit tests and trace walks under the sanitizers
        shell: bash
        run: |
          set -euo pipefail
          build/tests/model/model_test
          build/tests/model/overlay_test
          mkdir -p walks
          for seed in 1 2 3; do
            build/tests/model/overlay_walk "$seed" 1000 walks/overlay.tla
          done
          for fault in --faulty-hide-unkeyed --faulty-hotkey-hides; do
            build/tests/model/overlay_walk 1 1000 "$fault" walks/overlay.tla
          done
          for friends in 0 1 2 3; do
            for seed in 1 2 3 4 5 6 7 8; do
              build/tests/model/trace_walk "$seed" 1000 "$friends" walks/walk.tla
            done
            build/tests/model/trace_walk 1 1000 "$friends" --no-sprint walks/walk.tla
          done
          for fault in --faulty --faulty-queue --faulty-move --faulty-queue-cap --faulty-send-trim --faulty-send-dedup --faulty-close --faulty-sprint-move --faulty-sprint-close --faulty-close-fallback; do
            build/tests/model/trace_walk 1 1000 3 "$fault" walks/walk.tla
          done
          build/tests/sync/sync_test
          for windows in 1 2 3 4; do
            for seed in 1 2 3 4; do
              build/tests/sync/link_walk "$seed" 1000 "$windows" walks/link.tla
            done
          done
          for fault in --faulty-applier --faulty-mirror --faulty-tail; do
            build/tests/sync/link_walk 1 1000 2 "$fault" walks/link.tla
          done
          # the secret dialog: every unit group (the leak test among them), then its walks, each failing if a value's
          # bytes reach anything but the keeper
          build/tests/server/secrets_test
          for seed in 1 2 3 4 5 6 7 8; do
            build/tests/sync/secrets_walk "$seed" 2000 walks/secrets.tla
            build/tests/sync/secrets_walk "$seed" 2000 --format 4 walks/secrets.tla
          done
          # the store: every unit group (MemFs, crashes at every write and sync), the server's tabs on it, then the
          # journal's walks
          build/tests/store/store_test
          build/tests/store/durable_test
          for seed in 1 2 3 4 5 6 7 8; do
            build/tests/store/journal_walk "$seed" 1000 walks/journal.tla
          done
          for fault in accept-torn cut-too-far no-truncate no-sync; do
            build/tests/store/journal_walk 1 1000 --fault "$fault" walks/journal.tla
          done
          # the store's lock and the start-up order: their walks and the faulty orders, all at once (each on real files,
          # about 9 s under the sanitizers, each with its own trace and store directory; any failure fails the step)
          lock_pids=()
          for seed in 1 2 3 4 5; do
            build/tests/store/store_lock_walk "$seed" 2000 "walks/store_lock_$seed.tla" & lock_pids+=($!)
          done
          for fault in --faulty-unlocked --faulty-restore-first --faulty-held-refused --faulty-reader-busy --faulty-no-gate; do
            build/tests/store/store_lock_walk 1 2000 "$fault" "walks/store_lock$fault.tla" & lock_pids+=($!)
          done
          for pid in "${lock_pids[@]}"; do
            wait "$pid"
          done
          # the driver protocol: every group (the parser and the reader over every chunking)
          build/tests/driver/driver_protocol_test
          # the driver supervisor: every group, then its walks and their faults
          build/tests/server/supervisor_test
          for seed in 1 2 3 4 5 6 7 8; do
            build/tests/server/supervisor_walk "$seed" 1000 walks/supervisor.tla
          done
          for fault in --faulty-turn --faulty-resume; do
            build/tests/server/supervisor_walk 1 1000 "$fault" walks/supervisor.tla
          done
          # the formats as schema's tables: every table read back, and two versions reading each other both ways, in
          # schema's own tables and in nexus's state and actions
          build/tests/wire/wire_test
          build/tests/wire/nexus_versions_test

  # The Claude driver (drivers/claude): compiled under the strict tsconfig, linted with warnings as errors, its unit
  # tests (a scripted query: no process, clock or network), and the protocol's conformance cases run against it as a
  # process (ctest -L claude_driver). Node comes from the runner's machine (the fleet's sdk/bin on the runner's PATH),
  # never installed here; npm ci takes the pinned packages from package-lock.json, without the optional per-platform
  # Claude executable the tests never run. The live test (npm run test:live) spends a subscription and never runs here.
  claude-driver:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, macOS, ARM64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Node from the runner's machine
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "::error::no node or npm on $(hostname -s)'s runner PATH; the fleet installs Node (sdk/bin) on its runners"
            exit 1
          fi
          echo "node $(node --version), npm $(npm --version) on $(hostname -s)"
          downloads="$HOME/Library/Caches/nexus-ci/$RUNNER_NAME/prax-downloads"
          mkdir -p "$downloads"
          echo "PR_DOWNLOAD_DIR=$downloads" >> "$GITHUB_ENV"
          echo "JOBS=$(sh .github/job-cores.sh)" >> "$GITHUB_ENV"
          echo "TEST_JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
      - name: Install the pinned packages
        working-directory: drivers/claude
        run: npm ci --omit=optional --no-audit --no-fund
      - name: Compile, lint and unit tests
        working-directory: drivers/claude
        run: npm run check
      - name: Configure (the protocol and the conformance test only)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF -DNEXUS_WINDOW_LOGIC=OFF
      - name: Build the conformance test
        run: cmake --build build --parallel "$JOBS" --target driver_conformance_test
      - name: Conformance of the Claude driver
        run: ctest --test-dir build -L claude_driver -j "$TEST_JOBS" --output-on-failure --no-tests=error

  # The Claude driver's token wall (drivers/claude/src/wall.ts, docs/secrets.md "The token wall"), end to end: the real
  # Claude executable the pinned SDK ships (so npm ci with the optional per-platform package here), on a fake token,
  # against a fake Messages API on 127.0.0.1, in the OS sandbox, trying every way an AI could read its login. Spends
  # nothing and reaches no outside service.
  claude-driver-wall:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, macOS, ARM64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Node from the runner's machine
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "::error::no node or npm on $(hostname -s)'s runner PATH; the fleet installs Node (sdk/bin) on its runners"
            exit 1
          fi
          echo "node $(node --version), npm $(npm --version) on $(hostname -s)"
      - name: Install the pinned packages, with the Claude executable
        working-directory: drivers/claude
        run: npm ci --no-audit --no-fund
      - name: Compile
        working-directory: drivers/claude
        run: npm run build
      - name: The token wall
        working-directory: drivers/claude
        env:
          NEXUS_WALL_REPORT: '1'
        # Where this runner's own login reaches hulk, ssh there must work from the sandbox too, and from there no
        # login back to this machine; a runner with no fleet login skips that probe.
        run: |
          if ssh -o BatchMode=yes -o ConnectTimeout=5 hulk true 2>/dev/null; then
            export NEXUS_WALL_SSH_HOST=hulk NEXUS_WALL_SSH_BACK="$(hostname -s)"
          else
            echo "no login to hulk from $(hostname -s) as $(id -un): the ssh-out probe is skipped"
          fi
          npm run test:functional

  # The same wall on Linux, where Claude's sandbox is bubblewrap and socat, both built by nexus from pinned sources
  # (cmake/sandbox.cmake) and found by the driver (drivers/claude/src/tools.ts), with nothing installed for them: on an
  # Ubuntu bench (the tlc runners are the amd benches, never WSL2), whose AppArmor lets a program make user namespaces
  # only with a profile, which the driver loads for nexus's bwrap through passwordless sudo (the test unloads it first
  # where sudo -n can, NEXUS_WALL_FRESH_PROFILE, so that the real step runs each time), and inside captain's WSL2, which
  # has no AppArmor. The sandbox tools' build directory is kept per runner under ~/.cache/nexus-ci, so they are built
  # once per pin.
  claude-driver-wall-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        where: [ubuntu, wsl2]
        # Each of the test's two runs in a job of its own: on WSL2 under load one run took 52 s, both past the cap.
        run: [whole-wall, without-the-hook]
        include:
          - where: ubuntu
            labels: [self-hosted, fleet, Linux, X64, tlc]
          - where: wsl2
            labels: [self-hosted, fleet, Linux, X64, wsl2]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Where this runs, and caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          kernel=$(cat /proc/sys/kernel/osrelease)
          case "$kernel" in *microsoft*|*WSL2*) wsl=wsl2 ;; *) wsl=ubuntu ;; esac
          if [ "$wsl" != "${{ matrix.where }}" ]; then
            echo "::error::$(hostname -s) (kernel $kernel) is not a ${{ matrix.where }} machine"
            exit 1
          fi
          restrict=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo none)
          echo "$(hostname -s): kernel $kernel; apparmor_restrict_unprivileged_userns: $restrict; passwordless sudo: $(sudo -n true 2>/dev/null && echo yes || echo no)"
          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "::error::no node or npm on $(hostname -s)'s runner PATH; the fleet installs Node (sdk/bin) on its runners"
            exit 1
          fi
          # The runs' directories under a temporary directory of this runner's own: two Claude sandboxes at once whose
          # working directories share an ancestor a few levels up fail each other's commands now and then (bwrap:
          # Can't find source path .../runner-tmp/.mcp.json; two jobs on amd-2, 2026-11-15). A short path: under the
          # job's runner.temp the sandbox could not make its sockets ("Failed to create bridge sockets").
          own="${TMPDIR:-/tmp}/$RUNNER_NAME"
          mkdir -p "$own"
          echo "TMPDIR=$own" >> "$GITHUB_ENV"
          caches="$HOME/.cache/nexus-ci"
          mkdir -p "$caches/$RUNNER_NAME/prax-downloads"
          {
            echo "SANDBOX_BUILD=$caches/$RUNNER_NAME/sandbox-build"
            echo "PR_DOWNLOAD_DIR=$caches/$RUNNER_NAME/prax-downloads"
            echo "NEXUS_SANDBOX_BIN=$caches/$RUNNER_NAME/sandbox-build/sandbox"
          } >> "$GITHUB_ENV"
      - name: Build bubblewrap and socat
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$SANDBOX_BUILD" -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF \
            -DNEXUS_WINDOW_LOGIC=OFF -DNEXUS_SANDBOX_TOOLS=ON > /dev/null
          cmake --build "$SANDBOX_BUILD" --target nexus_sandbox_tools --parallel "$(sh .github/job-cores.sh)"
          "$NEXUS_SANDBOX_BIN/bwrap/bwrap" --version
          "$NEXUS_SANDBOX_BIN/socat/socat" -V | head -2
      - name: Install the pinned packages, with the Claude executable
        working-directory: drivers/claude
        # Installed once per lockfile on each runner and kept beside its other caches: WSL2's install took 24 to 47 s
        # when it asked the registry each time, and 26 to 38 s from npm's cache on a loaded captain (Ubuntu: 4 s).
        shell: bash
        run: |
          set -euo pipefail
          base="$HOME/.cache/nexus-ci/$RUNNER_NAME/claude-driver-packages"
          kept="$base/$(sha256sum package-lock.json | cut -c1-16)"
          if [ ! -d "$kept/node_modules" ]; then
            npm ci --prefer-offline --no-audit --no-fund
            rm -rf "$base"
            mkdir -p "$kept"
            mv node_modules "$kept/node_modules"
          fi
          rm -rf node_modules
          ln -s "$kept/node_modules" node_modules
      - name: Compile
        working-directory: drivers/claude
        run: npm run build
      - name: The token wall
        working-directory: drivers/claude
        env:
          NEXUS_WALL_REPORT: '1'
          NEXUS_WALL_FRESH_PROFILE: '1'
          NEXUS_WALL_RUN: ${{ matrix.run }}
        # Where this runner's own login reaches hulk, ssh there must work from the sandbox too, and from there no
        # login back to this machine; a runner with no fleet login skips that probe.
        run: |
          if ssh -o BatchMode=yes -o ConnectTimeout=5 hulk true 2>/dev/null; then
            export NEXUS_WALL_SSH_HOST=hulk NEXUS_WALL_SSH_BACK="$(hostname -s)"
          else
            echo "no login to hulk from $(hostname -s) as $(id -un): the ssh-out probe is skipped"
          fi
          npm run test:functional

  # Linux: everything but the window, which Prax cannot run here yet (no lib/app backend for Linux, no system fonts in
  # lib/font; CMakeLists.txt NEXUS_WINDOW), and the window's logic, which starts processes through Prax's lib/process,
  # whose POSIX backend does not link on Linux at nexus's pin (NEXUS_WINDOW_LOGIC). The link (nexus-server) uses the
  # window's logic, so it is off too (NEXUS_LINK=OFF); it also needs protobuf, which the Linux runners do not have yet.
  # On the fleet's Linux runners, with clang and lld, warnings as errors as on macOS. Caches live under
  # ~/.cache/nexus-ci on the runner's machine, laid out as the macOS jobs' (the linker's ThinLTO cache is lld's).
  build-and-unit-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, Linux, X64]
    timeout-minutes: 2
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          caches="$HOME/.cache/nexus-ci"
          mkdir -p "$caches/ccache" "$caches/lto" "$caches/$RUNNER_NAME/prax-downloads"
          {
            echo "NEXUS_CACHES=$caches"
            echo "PR_DOWNLOAD_DIR=$caches/$RUNNER_NAME/prax-downloads"
            echo "CCACHE_DIR=$caches/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=4G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            echo "JOBS=$(sh .github/job-cores.sh)"
            echo "TEST_JOBS=$(nproc)"
          } >> "$GITHUB_ENV"
      - name: Configure (Release)
        shell: bash
        run: |
          set -euo pipefail
          launcher=()
          if command -v ccache >/dev/null; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          else
            echo "::warning::no ccache on $(hostname -s): Prax compiles from scratch (install ccache there through the fleet play)"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF -DNEXUS_WINDOW_LOGIC=OFF "${launcher[@]}" \
            -DCMAKE_LINKER_TYPE=LLD "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--thinlto-cache-dir=$NEXUS_CACHES/lto"
      # A configure with no options at all takes the defaults that hold here (no window, no window logic, no link), so
      # a plain `cmake -S . -B build` on Linux works rather than failing late; this proves it.
      - name: Configure with the defaults
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-plain
          for option in NEXUS_WINDOW NEXUS_WINDOW_LOGIC NEXUS_LINK; do
            value=$(sed -n "s/^$option:BOOL=//p" build-plain/CMakeCache.txt)
            if [ "$value" != "OFF" ]; then
              echo "::error::a plain configure on Linux left $option at '$value', not OFF: its default in CMakeLists.txt is wrong"
              exit 1
            fi
          done
      - name: Build
        run: cmake --build build --parallel "$JOBS"
      - name: Unit tests
        run: ctest --test-dir build -L unit -j "$TEST_JOBS" --output-on-failure
      # Real child processes and real files: not unit tests.
      - name: Functional tests
        run: ctest --test-dir build -L functional -j "$TEST_JOBS" --output-on-failure
      - name: ccache hits in this job
        if: always()
        shell: bash
        run: if command -v ccache >/dev/null && [ -f "$CCACHE_STATSLOG" ]; then ccache --show-log-stats; fi

  # The code generated from schema/Nexus.schema (and the tests' later version) is checked in; this regenerates it with
  # schema's compiler at the pinned commit (cmake/schema.cmake) and fails on any difference, so the checked-in code is
  # always what the pin makes of the schema files, and schema/tables.baseline has refused any edit that changes what
  # stored data means. Go comes from the runner's machine (the fleet's sdk/bin); the compiler is built once per pin and
  # runner, and kept outside the workspace under ~/.cache/nexus-ci/<runner>/schema.
  schema-generated:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, Linux, X64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Regenerate at the pin
        shell: bash
        run: cmake "-DSCHEMA_CACHE=$HOME/.cache/nexus-ci/$RUNNER_NAME/schema" -P cmake/schema.cmake
      - name: The checked-in code is what the pin generates
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --porcelain -- schema tests/wire/next)
          if [ -n "$changed" ]; then
            echo "$changed"
            git --no-pager diff --stat -- schema tests/wire/next
            echo "::error::the generated code differs from what schema at the pin makes of the schema files: run cmake -P cmake/schema.cmake (or build the target schema_generate) and commit schema/gen and tests/wire/next/gen"
            exit 1
          fi

  # The macOS sanitizers job's programs and walks on Linux, with clang's AddressSanitizer and UndefinedBehaviorSanitizer.
  # On the runners labelled tlc, as the model shards: on hulk's loaded general runners its build ran past the 2 minutes.
  # It builds the programs it runs and nothing else, through ccache (sanitizer flags key their own entries).
  # Two parts in parallel, each within the 2 minutes: the unit programs, and the trace walks with their faults. Both
  # share the compiler cache outside the workspace, and each builds only the programs it runs.
  sanitizers-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, Linux, X64, tlc]
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: units
            targets: >-
              model_test overlay_test sync_test secrets_test store_test durable_test driver_protocol_test
              supervisor_test wire_test nexus_versions_test
          - part: walks
            targets: >-
              overlay_walk trace_walk link_walk secrets_walk journal_walk store_lock_walk supervisor_walk
    name: sanitizers-linux (${{ matrix.part }})
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          caches="$HOME/.cache/nexus-ci"
          mkdir -p "$caches/ccache" "$caches/$RUNNER_NAME/prax-downloads"
          {
            echo "PR_DOWNLOAD_DIR=$caches/$RUNNER_NAME/prax-downloads"
            echo "CCACHE_DIR=$caches/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=4G"
            echo "JOBS=$(sh .github/job-cores.sh)"
            echo "TEST_JOBS=$(nproc)"
          } >> "$GITHUB_ENV"
      - name: Configure (Debug, ASan and UBSan)
        shell: bash
        run: |
          set -euo pipefail
          launcher=()
          if command -v ccache >/dev/null; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF -DNEXUS_WINDOW_LOGIC=OFF \
            -DCMAKE_LINKER_TYPE=LLD "${launcher[@]}" \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      # Exactly the programs this part runs (model_checks would add the accounts' and the glide's, which it does not).
      - name: Build the programs it runs
        run: cmake --build build --parallel "$JOBS" --target ${{ matrix.targets }}
      - name: Unit tests under the sanitizers
        if: matrix.part == 'units'
        shell: bash
        run: |
          set -euo pipefail
          build/tests/model/model_test
          build/tests/model/overlay_test
          build/tests/sync/sync_test
          # the secret dialog: every unit group, the leak test among them
          build/tests/server/secrets_test
          # the store: every unit group (MemFs, crashes at every write and sync, the lock, the start-up order), and
          # the server's tabs on it
          build/tests/store/store_test
          build/tests/store/durable_test
          # the driver protocol: every group (the parser and the reader over every chunking)
          build/tests/driver/driver_protocol_test
          # the driver supervisor: every group
          build/tests/server/supervisor_test
          # the formats as schema's tables: every table read back, and two versions reading each other both ways, in
          # schema's own tables and in nexus's state and actions
          build/tests/wire/wire_test
          build/tests/wire/nexus_versions_test
      - name: Trace walks and their faults under the sanitizers
        if: matrix.part == 'walks'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p walks
          for seed in 1 2 3; do
            build/tests/model/overlay_walk "$seed" 1000 walks/overlay.tla
          done
          for fault in --faulty-hide-unkeyed --faulty-hotkey-hides; do
            build/tests/model/overlay_walk 1 1000 "$fault" walks/overlay.tla
          done
          for friends in 0 1 2 3; do
            for seed in 1 2 3 4 5 6 7 8; do
              build/tests/model/trace_walk "$seed" 1000 "$friends" walks/walk.tla
            done
            build/tests/model/trace_walk 1 1000 "$friends" --no-sprint walks/walk.tla
          done
          for fault in --faulty --faulty-queue --faulty-move --faulty-queue-cap --faulty-send-trim --faulty-send-dedup --faulty-close --faulty-sprint-move --faulty-sprint-close --faulty-close-fallback; do
            build/tests/model/trace_walk 1 1000 3 "$fault" walks/walk.tla
          done
          for windows in 1 2 3 4; do
            for seed in 1 2 3 4; do
              build/tests/sync/link_walk "$seed" 1000 "$windows" walks/link.tla
            done
          done
          for fault in --faulty-applier --faulty-mirror --faulty-tail; do
            build/tests/sync/link_walk 1 1000 2 "$fault" walks/link.tla
          done
          # the secret dialog's walks, each failing if a value's bytes reach anything but the keeper
          for seed in 1 2 3 4 5 6 7 8; do
            build/tests/sync/secrets_walk "$seed" 2000 walks/secrets.tla
            build/tests/sync/secrets_walk "$seed" 2000 --format 4 walks/secrets.tla
          done
          # the journal's walks
          for seed in 1 2 3 4 5 6 7 8; do
            build/tests/store/journal_walk "$seed" 1000 walks/journal.tla
          done
          for fault in accept-torn cut-too-far no-truncate no-sync; do
            build/tests/store/journal_walk 1 1000 --fault "$fault" walks/journal.tla
          done
          # the store's lock and the start-up order: their walks and the faulty orders, all at once (each on real files,
          # about 9 s under the sanitizers, each with its own trace and store directory; any failure fails the step)
          lock_pids=()
          for seed in 1 2 3 4 5; do
            build/tests/store/store_lock_walk "$seed" 2000 "walks/store_lock_$seed.tla" & lock_pids+=($!)
          done
          for fault in --faulty-unlocked --faulty-restore-first --faulty-held-refused --faulty-reader-busy --faulty-no-gate; do
            build/tests/store/store_lock_walk 1 2000 "$fault" "walks/store_lock$fault.tla" & lock_pids+=($!)
          done
          for pid in "${lock_pids[@]}"; do
            wait "$pid"
          done
          # the driver supervisor's walks and their faults
          for seed in 1 2 3 4 5 6 7 8; do
            build/tests/server/supervisor_walk "$seed" 1000 walks/supervisor.tla
          done
          for fault in --faulty-turn --faulty-resume; do
            build/tests/server/supervisor_walk 1 1000 "$fault" walks/supervisor.tla
          done

  # The TLA+ models and their trace checks, on the fleet's Linux runners: TLC is Java and checks the same on every
  # platform, so these run where runners are many, in parallel shards, each well within the 2 minutes. Every test
  # labelled model runs in exactly one shard: each shard names its tests by regex (`run`, less `skip`) and builds only
  # the walks they run (`build`), and the last, window, takes every test no other shard names, so a new test is never
  # missed. `--no-tests=error` fails a shard whose regex matches nothing. The largest instances each have a shard of
  # their own, on eight TLC workers, timed two at a time on a loaded tlc runner host (the CMakeLists beside them give
  # the times); supervisor switch and place and link ensure are capped at 75 s, not 60, which keeps their jobs well
  # inside the 2 minutes. The tab label's traces need the window's logic, which does not build on Linux at Prax's pin
  # (build-and-unit-linux says why), so they run on macOS (model-label).
  model:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Every shard on the fleet's runners labelled tlc (two per machine, so a machine runs at most two shards, sixteen TLC
    # workers), away from hulk, whose general Linux runners share one machine with other repositories' CI and ran these
    # past their 60 s. A shard waiting for a runner is not counted in its 2 minutes.
    runs-on: [self-hosted, fleet, Linux, X64, tlc]
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: supervisor
            run: '^tlc_supervisor$'
          - shard: supervisor-switch
            run: '^tlc_supervisor_switch$'
          - shard: supervisor-place
            run: '^tlc_supervisor_place$'
          - shard: supervisor-signin
            run: '^tlc_supervisor_signin$'
          - shard: supervisor-rest
            run: '^tlc_supervisor_'
            build: supervisor_walk
            skip: '^tlc_supervisor_(switch|place|signin)$'
          - shard: link-ensure
            run: '^tlc_link_ensure$'
          - shard: link-one-window
            run: '^tlc_link_one_window$'
          - shard: link-tabs
            run: '^tlc_link_tabs$'
          - shard: link-two-windows
            run: '^tlc_link_two_windows$'
          - shard: link-rest
            run: '^tlc_link_'
            build: link_walk
            skip: '^tlc_link_(ensure|one_window|tabs|two_windows)$'
          - shard: accounts
            run: '^tlc_accounts$'
          - shard: accounts-rest
            run: '^tlc_accounts_'
            build: accounts_walk
          - shard: journal
            run: '^tlc_journal'
            build: journal_walk
          # The store's lock and the start-up order (models/store/StoreLock.tla): its instances, witnesses and the
          # code's walks.
          - shard: store-lock
            run: '^tlc_store_lock'
            build: store_lock_walk
          - shard: claude
            run: '^tlc_claude'
            node: true
          - shard: witnesses
            run: '^tlc_witness'
          # The secret dialog's instances and witnesses (models/Secrets.tla), then its code's walks against
          # SecretsTrace.tla (about 90 records each) and their faults.
          - shard: secrets
            run: '^tlc_secrets_'
            skip: '^tlc_secrets_trace_'
          - shard: secrets-trace
            run: '^tlc_secrets_trace_'
            build: secrets_walk
          # The rest: every model test no shard above names. Its skip is one alternative per family of shards above; a
          # new family adds its prefix there.
          - shard: window
            run: ''
            build: trace_walk overlay_walk glide_walk
            skip: '^tlc_(supervisor|link|accounts|journal|store_lock|claude|witness|secrets)'
    name: model (${{ matrix.shard }})
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Java and the pinned TLC jar from the runner's machine
        shell: bash
        run: |
          set -euo pipefail
          java=""
          for c in "$(command -v java || true)" "$HOME/sdk/bin/java" /usr/bin/java; do
            if [ -n "$c" ] && [ -x "$c" ] && "$c" -version >/dev/null 2>&1; then java=$c; break; fi
          done
          if [ -z "$java" ]; then
            echo "::error::no working java on $(hostname -s) (looked on PATH, at \$HOME/sdk/bin/java and /usr/bin/java): install a JDK 21 on this runner's machine through the fleet play, then re-run"
            exit 1
          fi
          "$java" -version
          dirname "$java" >> "$GITHUB_PATH"
          jar=""
          for c in "$HOME/sdk/tla/tla2tools.jar" /opt/tla/tla2tools.jar; do
            if [ -f "$c" ]; then jar=$c; break; fi
          done
          if [ -z "$jar" ]; then
            echo "::error::no TLC jar on $(hostname -s) (looked at \$HOME/sdk/tla/tla2tools.jar and /opt/tla/tla2tools.jar): place tla2tools.jar v1.7.4 there (sha256 in .github/tla2tools.sha256; another fleet machine holds one), then re-run"
            exit 1
          fi
          want=$(cut -d' ' -f1 .github/tla2tools.sha256)
          have=$(sha256sum "$jar" | cut -d' ' -f1)
          if [ "$want" != "$have" ]; then
            echo "::error::$jar on $(hostname -s) is not the pinned tla2tools.jar v1.7.4 (sha256 $have, want $want): replace it with the pinned jar, then re-run"
            exit 1
          fi
          echo "TLA2TOOLS_JAR=$jar" >> "$GITHUB_ENV"
      - name: Caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          caches="$HOME/.cache/nexus-ci"
          mkdir -p "$caches/ccache" "$caches/$RUNNER_NAME/prax-downloads"
          {
            echo "PR_DOWNLOAD_DIR=$caches/$RUNNER_NAME/prax-downloads"
            echo "CCACHE_DIR=$caches/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=4G"
            echo "JOBS=$(sh .github/job-cores.sh)"
            echo "TEST_JOBS=$(nproc)"
          } >> "$GITHUB_ENV"
      # The Claude driver's trace checks (models/ClaudeDriverTrace.tla) run its unit tests and its walk under Node, from
      # its build: Node from the runner's machine as in the claude-driver job, the pinned packages, the compile alone.
      - name: Node from the runner's machine, and the Claude driver built
        if: matrix.node
        shell: bash
        working-directory: drivers/claude
        run: |
          set -euo pipefail
          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "::error::no node or npm on $(hostname -s)'s runner PATH; the fleet installs Node (sdk/bin) on its runners"
            exit 1
          fi
          npm ci --omit=optional --no-audit --no-fund
          npm run build
      # Without the window, its logic and the link's transport, which no check program uses (as build-and-unit-linux).
      - name: Configure (Release)
        shell: bash
        run: |
          set -euo pipefail
          launcher=()
          if command -v ccache >/dev/null; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF -DNEXUS_WINDOW_LOGIC=OFF \
            -DCMAKE_LINKER_TYPE=LLD "${launcher[@]}"
      # Only the walks this shard's trace checks run (`build`); a shard of specs and witnesses alone builds nothing.
      - name: Build the shard's walks
        if: matrix.build
        shell: bash
        env:
          TARGETS: ${{ matrix.build }}
        run: |
          set -euo pipefail
          read -r -a targets <<< "$TARGETS"
          cmake --build build --parallel "$JOBS" --target "${targets[@]}"
      # One TLC worker per core: the instances with tens of thousands of states run eight workers each and ctest counts
      # them as eight of its slots (PROCESSORS in tests/model/CMakeLists.txt). The largest instances, label
      # model_nightly, run in nightly.yml; every property is still checked here, on the smaller instances.
      - name: Models and trace checks
        shell: bash
        env:
          RUN: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}
        run: |
          set -euo pipefail
          select=()
          if [ -n "$RUN" ]; then select+=(-R "$RUN"); fi
          if [ -n "$SKIP" ]; then select+=(-E "$SKIP"); fi
          ctest --test-dir build -L '^model$' "${select[@]}" -j "$TEST_JOBS" --output-on-failure --no-tests=error

  # The tab label's trace checks (TabLabelTrace.tla), whose walk needs the window's logic: on macOS, as the model job
  # ran them before it moved to Linux.
  model-label:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, macOS, ARM64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Java and the pinned TLC jar from the runner's machine
        shell: bash
        run: |
          set -euo pipefail
          java=""
          for c in "$HOME/sdk/bin/java" /opt/homebrew/opt/openjdk/bin/java; do
            if [ -x "$c" ] && "$c" -version >/dev/null 2>&1; then java=$c; break; fi
          done
          if [ -z "$java" ]; then
            echo "::error::no working java on $(hostname -s) (looked at \$HOME/sdk/bin/java and /opt/homebrew/opt/openjdk/bin/java): install a JDK 21 on this runner's machine through the fleet play, then re-run"
            exit 1
          fi
          "$java" -version
          dirname "$java" >> "$GITHUB_PATH"
          jar="$HOME/sdk/tla/tla2tools.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::no TLC jar at $jar on $(hostname -s): place tla2tools.jar v1.7.4 there (sha256 in .github/tla2tools.sha256; another fleet machine holds one), then re-run"
            exit 1
          fi
          want=$(cut -d' ' -f1 .github/tla2tools.sha256)
          have=$(shasum -a 256 "$jar" | cut -d' ' -f1)
          if [ "$want" != "$have" ]; then
            echo "::error::$jar on $(hostname -s) is not the pinned tla2tools.jar v1.7.4 (sha256 $have, want $want): replace it with the pinned jar, then re-run"
            exit 1
          fi
          echo "TLA2TOOLS_JAR=$jar" >> "$GITHUB_ENV"
      - name: Caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          caches="$HOME/Library/Caches/nexus-ci"
          mkdir -p "$caches/ccache" "$caches/$RUNNER_NAME/prax-downloads"
          {
            echo "PR_DOWNLOAD_DIR=$caches/$RUNNER_NAME/prax-downloads"
            echo "CCACHE_DIR=$caches/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=4G"
            echo "JOBS=$(sh .github/job-cores.sh)"
            echo "TEST_JOBS=$(sysctl -n hw.ncpu)"
          } >> "$GITHUB_ENV"
      # Without the link's transport (mosh and protobuf), which the walk does not use.
      - name: Configure (Release)
        shell: bash
        run: |
          set -euo pipefail
          launcher=()
          if command -v ccache >/dev/null; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
                      -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF "${launcher[@]}"
      - name: Build the label's walk
        run: cmake --build build --parallel "$JOBS" --target label_walk
      - name: The label's trace checks
        run: ctest --test-dir build -L '^model$' -R '^tlc_label_trace' -j "$TEST_JOBS" --output-on-failure --no-tests=error

  # Windows' functional tests, inside WSL2: on Windows the overlay stays native and everything else (nexus-server, the
  # link, the drivers and their tests) runs as the Linux build inside WSL2 (AGENTS.md, platform targets). So these run
  # on captain's WSL2 runners (label wsl2: Linux runners inside captain's WSL2 distro, from the fleet's record), with
  # the same configure as build-and-unit-linux, and so with what Prax lets Linux build at its pin (no window logic, so
  # no link and no nexus-server yet: build-and-unit-linux says why). The first step refuses to run anywhere but WSL2.
  # Caches as build-and-unit-linux's, under ~/.cache/nexus-ci inside the distro.
  wsl2-functional:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, Linux, X64, wsl2]
    timeout-minutes: 2
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Inside WSL2, and caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          kernel=$(cat /proc/sys/kernel/osrelease)
          case "$kernel" in
            *microsoft*WSL2*|*WSL2*) echo "WSL2 kernel $kernel${WSL_DISTRO_NAME:+, distro $WSL_DISTRO_NAME}" ;;
            *) echo "::error::$(hostname -s) is not inside WSL2 (kernel $kernel): the wsl2 label belongs only to runners in captain's WSL2 distro"; exit 1 ;;
          esac
          caches="$HOME/.cache/nexus-ci"
          mkdir -p "$caches/ccache" "$caches/lto" "$caches/$RUNNER_NAME/prax-downloads"
          {
            echo "NEXUS_CACHES=$caches"
            echo "PR_DOWNLOAD_DIR=$caches/$RUNNER_NAME/prax-downloads"
            echo "CCACHE_DIR=$caches/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=4G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            echo "JOBS=$(sh .github/job-cores.sh)"
            echo "TEST_JOBS=$(nproc)"
          } >> "$GITHUB_ENV"
      - name: Configure (Release)
        shell: bash
        run: |
          set -euo pipefail
          launcher=()
          if command -v ccache >/dev/null; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          else
            echo "::warning::no ccache on $(hostname -s): Prax compiles from scratch (install ccache there through the fleet play)"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF -DNEXUS_WINDOW_LOGIC=OFF "${launcher[@]}" \
            -DCMAKE_LINKER_TYPE=LLD "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--thinlto-cache-dir=$NEXUS_CACHES/lto"
      - name: Build
        run: cmake --build build --parallel "$JOBS"
      - name: Functional tests
        run: ctest --test-dir build -L functional -j "$TEST_JOBS" --output-on-failure --no-tests=error
      - name: ccache hits in this job
        if: always()
        shell: bash
        run: if command -v ccache >/dev/null && [ -f "$CCACHE_STATSLOG" ]; then ccache --show-log-stats; fi

  # 64-bit Windows (x64 only; there is no 32-bit build), with MSVC at /W4 and warnings as errors (CMakeLists.txt sets
  # the flags), on captain's Windows runners: the native window's code and its unit tests, nothing else. On Windows only
  # the overlay window is native; nexus-server, its store, the driver protocol and supervisor, the link and every test
  # of them build and run as the Linux build inside WSL2 (wsl2-functional) and on Linux (build-and-unit-linux), so a
  # native Windows build leaves them out (CMakeLists.txt NEXUS_SERVER_PARTS), and the model checks' walks with them,
  # which TLC runs on Linux and macOS. What is built here: the libraries the window links (the model and overlay, the
  # link's states with the accounts, the settings files, the hitch detector, the board's scroller, the terminal tab's
  # launch line), the formats' tables (nexus_wire), src/platform_win.cpp, their unit tests, and the WSL2 terminal test,
  # which wsl2-terminal runs. Not the window itself (Prax's Win32 backend of lib/app does not compile at its pin).
  #
  # The build directory lives outside the workspace, one per runner, under %LOCALAPPDATA%\nexus-ci\<runner>, so that a
  # build is incremental and Prax is not recompiled each time (no ccache for MSVC on the runner); the first build on a
  # runner is cold. Prax's download cache sits beside it (PR_DOWNLOAD_DIR), one per runner for the reason given above.
  # The repository has no submodules, so the checkout does not look for them (its submodule sync, update and foreach
  # cost about 2.5 s here, where each git command takes most of a second).
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, Windows, X64, captain]
    timeout-minutes: 2
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Each native command's exit code is checked by hand ($LASTEXITCODE): pwsh does not stop on one by itself.
      - name: Build directory and caches outside the workspace
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'pdoane/prax\.git\s+GIT_TAG\s+([0-9a-f]{40})').Groups[1].Value
          if (-not $pin) { throw "no Prax pin found in CMakeLists.txt (FetchContent_Declare(prax ... GIT_TAG <sha>))" }
          $caches = Join-Path $env:LOCALAPPDATA "nexus-ci\$env:RUNNER_NAME"
          $build = "$caches\build-x64"
          New-Item -ItemType Directory -Force -Path $caches | Out-Null
          # The runner's directory holds only what this job keeps: anything else (an old Prax pin, a leftover build
          # directory) goes.
          $keep = @('build-x64', 'build-x64.ok', 'build-x64.unfinished', 'prax-downloads', "prax-$pin")
          Get-ChildItem -Force $caches | Where-Object { $keep -notcontains $_.Name } | ForEach-Object {
            Write-Output "removing $($_.FullName)"
            Remove-Item -Recurse -Force $_.FullName
          }
          # build-x64.ok is written only after a build that finished. A build directory without it is from a run cut
          # off (or failed) mid-configure or mid-build: it is resumed, since a cold build outlasts one run's 2 minutes,
          # but at most 3 times (build-x64.unfinished counts them); the 4th start without a finished build starts from
          # nothing, so a directory a cut left broken does not stay.
          $finished = Test-Path "$build.ok"
          if ($finished) {
            Remove-Item -Force -ErrorAction SilentlyContinue "$build.unfinished"
          } elseif (Test-Path $build) {
            $starts = 1
            if (Test-Path "$build.unfinished") { $starts = [int](Get-Content "$build.unfinished") + 1 }
            if ($starts -gt 3) {
              Write-Output "the build directory has had 3 starts without a finished build; removing it"
              Remove-Item -Recurse -Force $build
              $starts = 0
            } else {
              Write-Output "the build directory has no finished build; resuming it (start $starts of 3)"
            }
            Set-Content -Path "$build.unfinished" -Value $starts
          }
          Remove-Item -Force -ErrorAction SilentlyContinue "$build.ok"
          "NEXUS_BUILD_FINISHED=$finished" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $build, "$caches\prax-downloads" | Out-Null
          "PRAX_PIN=$pin" >> $env:GITHUB_ENV
          "NEXUS_CACHES=$caches" >> $env:GITHUB_ENV
          "NEXUS_BUILD=$build" >> $env:GITHUB_ENV
          "PR_DOWNLOAD_DIR=$caches\prax-downloads" >> $env:GITHUB_ENV
          # The job's share of the host's cores, as .github/job-cores.sh: NOVA_JOB_CORES, else the processor count.
          $jobs = [Environment]::ProcessorCount
          $share = 0
          if ("$env:NOVA_JOB_CORES" -match '^[1-9][0-9]*$' -and [int]::TryParse($env:NOVA_JOB_CORES, [ref]$share)) {
            $jobs = $share
            Write-Output "NOVA_JOB_CORES on ${env:COMPUTERNAME} is ${share}: jobs use it"
          } else {
            $shown = if ($null -eq $env:NOVA_JOB_CORES) { 'unset' } else { $env:NOVA_JOB_CORES }
            Write-Output "NOVA_JOB_CORES on ${env:COMPUTERNAME} is '$shown', not a positive integer: jobs use the processor count, $jobs"
          }
          "JOBS=$jobs" >> $env:GITHUB_ENV
          "TEST_JOBS=$([Environment]::ProcessorCount)" >> $env:GITHUB_ENV
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "cmake --version exited $LASTEXITCODE" }
      # Prax at the commit CMakeLists.txt pins, fetched once per runner at depth 1 (a full clone outlasts the job's 2
      # minutes) into a directory of its own, then renamed into place, so a fetch cut short leaves nothing half made. A
      # kept checkout is used only when its HEAD is the pin.
      - name: Prax at its pin, outside the workspace
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $pin = $env:PRAX_PIN
          $prax = "$env:NEXUS_CACHES\prax-$pin"
          if (Test-Path $prax) {
            $head = git -C $prax rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $head -ne $pin) {
              Write-Output "the Prax checkout at $prax is at '$head', not $pin; fetching it again"
              Remove-Item -Recurse -Force $prax
            }
          }
          if (-not (Test-Path $prax)) {
            $partial = "$env:NEXUS_CACHES\prax-partial"
            if (Test-Path $partial) { Remove-Item -Recurse -Force $partial }
            git init -q $partial
            if ($LASTEXITCODE -ne 0) { throw "git init exited $LASTEXITCODE" }
            git -C $partial fetch -q --depth 1 https://github.com/pdoane/prax.git $pin
            if ($LASTEXITCODE -ne 0) { throw "git fetch of Prax $pin exited $LASTEXITCODE" }
            git -C $partial checkout -q FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw "git checkout of Prax $pin exited $LASTEXITCODE" }
            $head = git -C $partial rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $head -ne $pin) { throw "the fetched Prax is at '$head', not $pin" }
            Rename-Item $partial "prax-$pin"
          }
          "PRAX_SOURCE=$prax" >> $env:GITHUB_ENV
          # Prax's Slang compiler, into Prax's download cache the same way (downloaded beside, checked, then renamed):
          # Prax's own configure writes it straight to its final path, and a download the 2 minutes cut short would
          # start again from nothing on the next run.
          $deps = Get-Content -Raw "$prax\cmake\dependencies.cmake"
          $asset = 'windows-x86_64.zip'
          $hash = [regex]::Match($deps, 'PR_SLANG_ASSET ' + [regex]::Escape($asset) + '\)\s+set\(PR_SLANG_HASH ([0-9a-f]{64})').Groups[1].Value
          $url = [regex]::Match($deps, 'URL (https://github.com/shader-slang/\S+)\$\{PR_SLANG_ASSET\}').Groups[1].Value
          if (-not $hash -or -not $url) { throw "Prax's cmake/dependencies.cmake no longer names Slang's $asset as this step reads it" }
          $file = ($url -split '/')[-1] + $asset
          $slang = "$env:PR_DOWNLOAD_DIR\slang"
          New-Item -ItemType Directory -Force -Path $slang | Out-Null
          $have = if (Test-Path "$slang\$file") { (Get-FileHash -Algorithm SHA256 "$slang\$file").Hash.ToLower() } else { '' }
          if ($have -ne $hash) {
            # curl.exe resumes a download that an earlier run's 2 minutes cut short (-C -).
            curl.exe -fsSL --retry 3 -C - -o "$slang\$file.partial" ($url + $asset)
            if ($LASTEXITCODE -ne 0) { throw "curl of Slang's $file exited $LASTEXITCODE (the partial file is kept to resume)" }
            $got = (Get-FileHash -Algorithm SHA256 "$slang\$file.partial").Hash.ToLower()
            if ($got -ne $hash) {
              Remove-Item -Force "$slang\$file.partial"
              throw "Slang's $file has sha256 $got, and Prax pins $hash (removed; the next run downloads it again)"
            }
            Move-Item -Force "$slang\$file.partial" "$slang\$file"
          }
      # Every NEXUS_* option is given, so a kept CMakeCache.txt never decides what is built. The window, its logic and
      # the link are off on Windows (CMakeLists.txt says why for each); src/platform_win.cpp is compiled on its own.
      # A configure here regenerates every project file (Prax's included), about 6 s. It is skipped when the kept build
      # directory finished its last build and was configured with these same arguments by this same cmake (the stamp
      # nexus-ci-configured.txt inside it, so it goes with the directory): `cmake --build` then re-runs the configure
      # itself (the solution's ZERO_CHECK project) whenever a CMakeLists.txt or an included .cmake file has changed
      # since, so a skip never builds a stale project.
      - name: Configure (Release, MSVC x64)
        run: |
          $configure = @('-S', '.', '-B', $env:NEXUS_BUILD, '-A', 'x64', "-DFETCHCONTENT_SOURCE_DIR_PRAX=$env:PRAX_SOURCE",
                         '-DNEXUS_WINDOW=OFF', '-DNEXUS_WINDOW_LOGIC=OFF', '-DNEXUS_LINK=OFF')
          # All of its output, then the first line: Select-Object -First would stop cmake mid-write and fail it.
          $versionText = @(cmake --version)
          if ($LASTEXITCODE -ne 0) { throw "cmake --version exited $LASTEXITCODE" }
          $version = $versionText[0]
          $stamp = "$version`n$($configure -join "`n")"
          $stampFile = Join-Path $env:NEXUS_BUILD 'nexus-ci-configured.txt'
          $kept = if (Test-Path $stampFile) { [string](Get-Content -Raw $stampFile) } else { '' }
          if ($env:NEXUS_BUILD_FINISHED -ne 'True') {
            Write-Output "configuring: the kept build directory has no finished build"
          } elseif (-not (Test-Path "$env:NEXUS_BUILD\CMakeCache.txt")) {
            Write-Output "configuring: the kept build directory has no CMakeCache.txt"
          } elseif ($kept.TrimEnd() -ne $stamp) {
            Write-Output "configuring: the kept build directory was configured otherwise (stamp '$($kept.TrimEnd())', now '$stamp')"
          } else {
            Write-Output "configured already with these arguments by $version; cmake --build re-runs it if a CMake file changed"
            exit 0
          }
          Remove-Item -Force -ErrorAction SilentlyContinue $stampFile
          cmake @configure
          if ($LASTEXITCODE -ne 0) { throw "cmake configure exited $LASTEXITCODE" }
          Set-Content -NoNewline -Path $stampFile -Value $stamp
      - name: Build
        run: |
          cmake --build "$env:NEXUS_BUILD" --config Release --parallel $env:JOBS
          if ($LASTEXITCODE -ne 0) { throw "cmake --build exited $LASTEXITCODE" }
          New-Item -ItemType File -Force -Path "$env:NEXUS_BUILD.ok" | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:NEXUS_BUILD.unfinished"
      - name: Unit tests
        run: |
          ctest --test-dir "$env:NEXUS_BUILD" -C Release -L unit -j $env:TEST_JOBS --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "ctest exited $LASTEXITCODE" }
      # The terminal tab's WSL2 shell test, for wsl2-terminal to run (this job's NETWORK SERVICE has no WSL2 distribution).
      - name: Keep the WSL2 terminal test for wsl2-terminal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wsl2-terminal-test
          path: ${{ env.NEXUS_BUILD }}\tests\window\Release\nexus_wsl2_terminal_tests.exe
          if-no-files-found: error
          retention-days: 1

  # A Windows terminal tab's shell for real (tests/window/test_wsl2_terminal.cpp, ctest wsl2_terminal): the probe through
  # wsl.exe, then the launch line on a Windows pseudoconsole through Prax's lib/process, as a terminal tab starts it; the
  # shell's prompt, TERM, home directory, Escape and exit. The windows job builds it with MSVC; it runs here, on captain's
  # WSL2 runners, through WSL interop, which starts it on Windows as the user whose WSL2 distribution that is. It cannot
  # run in the windows job: those runners run as NETWORK SERVICE, which has no WSL2 distribution.
  wsl2-terminal:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: windows
    runs-on: [self-hosted, fleet, Linux, X64, wsl2]
    timeout-minutes: 2
    steps:
      - name: Inside WSL2, with interop to Windows
        shell: bash
        run: |
          set -euo pipefail
          kernel=$(cat /proc/sys/kernel/osrelease)
          case "$kernel" in
            *microsoft*WSL2*|*WSL2*) echo "WSL2 kernel $kernel${WSL_DISTRO_NAME:+, distro $WSL_DISTRO_NAME}" ;;
            *) echo "::error::$(hostname -s) is not inside WSL2 (kernel $kernel): the wsl2 label belongs only to runners in captain's WSL2 distro"; exit 1 ;;
          esac
          if [ ! -e /proc/sys/fs/binfmt_misc/WSLInterop ]; then
            echo "::error::WSL interop is off on $(hostname -s) (no /proc/sys/fs/binfmt_misc/WSLInterop): Windows programs cannot start from here; turn it on in /etc/wsl.conf ([interop] enabled=true)"
            exit 1
          fi
      - name: The test the windows job built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl2-terminal-test
          path: ${{ runner.temp }}/wsl2-terminal
      - name: wsl2_terminal (functional)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/wsl2-terminal/nexus_wsl2_terminal_tests.exe"
          "$RUNNER_TEMP/wsl2-terminal/nexus_wsl2_terminal_tests.exe"
