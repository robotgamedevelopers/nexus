# CI for nexus: the build with its unit and functional tests, the model under the sanitizers, and the TLA+ models
# with their trace checks, as three jobs in parallel on the fleet's macOS runners (never GitHub-hosted); and the build
# without the window, its unit and functional tests and the sanitizers' programs on the fleet's Linux runners. Every pull request runs it, whatever its base,
# and so does every push to main.
#
# Each per-commit job finishes in 2 minutes: timeout-minutes says so here, and the runners' own job hook
# enforces the same limit. Longer work belongs in a nightly (schedule) workflow.
#
# Warnings are errors: CMakeLists.txt sets the flags, so these jobs use the plain build commands.
#
# Java and the TLC jar come from the runner's machine (the fleet installs them), never downloaded here. The
# jar must be the pinned tla2tools.jar v1.7.4, whose sha256 is in .github/tla2tools.sha256; any other jar
# fails the job.
#
# Builds use every core and tests run one job per core (`sysctl -n hw.ncpu`). Caches live outside the workspace, under
# ~/Library/Caches/nexus-ci on the runner's machine, so a build is from scratch but Prax is not recompiled each time:
#   ccache/                    compiled objects, when the machine has ccache; CCACHE_BASEDIR makes the runners'
#                              different workspaces hit (it compiles with relative paths, so objects are identical)
#   lto/                       the linker's ThinLTO cache (Prax builds Release with ThinLTO, so a link recompiles
#                              everything it pulls in unless this cache holds it); it hits across workspaces only
#                              because ccache made the objects identical
# Both are shared by the machine's runners: ccache and LLVM's LTO cache write each entry to a temporary file and rename
# it into place, so concurrent jobs are safe.
#   <runner>/prax-downloads/   Prax's download cache (PR_DOWNLOAD_DIR). One per runner, because Prax writes a download
#                              straight to its final path and two jobs fetching one file at once corrupt it; a runner
#                              runs one job at a time.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-unit:
    # a pull request from a fork never runs on the fleet's runners
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The build compiles Metal shaders (Prax) and needs Xcode's Metal toolchain. Today only the runners labelled
    # `services` have Xcode; drop the extra label when every macOS runner has it.
    runs-on: [self-hosted, fleet, macOS, ARM64, services]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          caches="$HOME/Library/Caches/nexus-ci"
          mkdir -p "$caches/ccache" "$caches/lto" "$caches/$RUNNER_NAME/prax-downloads"
          {
            echo "NEXUS_CACHES=$caches"
            echo "PR_DOWNLOAD_DIR=$caches/$RUNNER_NAME/prax-downloads"
            echo "CCACHE_DIR=$caches/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=4G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            echo "JOBS=$(sysctl -n hw.ncpu)"
          } >> "$GITHUB_ENV"
      - name: Configure (Release)
        shell: bash
        run: |
          set -euo pipefail
          launcher=()
          if command -v ccache >/dev/null; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
                      -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache)
          else
            echo "::warning::no ccache on $(hostname -s): Prax compiles from scratch (install ccache there through the fleet play)"
          fi
          # The link's functional tests reach this machine over ssh by its loopback and, when it is on the tailnet, by
          # its tailnet address too (tests/link/CMakeLists.txt).
          tailnet=""
          if command -v tailscale >/dev/null; then
            tailnet=$(tailscale ip -4 2>/dev/null | head -n 1 || true)
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${launcher[@]}" \
            "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-cache_path_lto,$NEXUS_CACHES/lto" \
            "-DNEXUS_E2E_TAILNET=$tailnet"
      - name: Build
        run: cmake --build build --parallel "$JOBS"
      - name: Unit tests
        run: ctest --test-dir build -L unit -j "$JOBS" --output-on-failure
      # The headless window (system fonts), real child processes and a real file, and the link end to end (nexus-server
      # over ssh to this machine, mosh's transport over real UDP): not unit tests.
      - name: Functional tests
        run: ctest --test-dir build -L functional -j "$JOBS" --output-on-failure
      - name: ccache hits in this job
        if: always()
        shell: bash
        run: if command -v ccache >/dev/null && [ -f "$CCACHE_STATSLOG" ]; then ccache --show-log-stats; fi

  # The model and its check programs built Debug with AddressSanitizer and UndefinedBehaviorSanitizer, which stop at
  # the first report: the unit tests, and the trace walks (the window's on every friend count, the overlay's) with every
  # fault (no TLC); the same for the link's states (src/sync) and their walks, and the store (store_test, durable_test
  # and journal_walk). Configured without the link's transport (NEXUS_LINK=OFF: mosh and protobuf), which these programs
  # do not use, so any macOS runner will do.
  sanitizers:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, macOS, ARM64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Prax's download cache, one per runner
        shell: bash
        run: |
          set -euo pipefail
          downloads="$HOME/Library/Caches/nexus-ci/$RUNNER_NAME/prax-downloads"
          mkdir -p "$downloads"
          echo "PR_DOWNLOAD_DIR=$downloads" >> "$GITHUB_ENV"
          echo "JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
      - name: Configure (Debug, ASan and UBSan)
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEXUS_LINK=OFF
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build the model checks
        run: cmake --build build --parallel "$JOBS" --target model_checks
      - name: Unit tests and trace walks under the sanitizers
        shell: bash
        run: |
          set -euo pipefail
          build/tests/model/model_test
          build/tests/model/overlay_test
          mkdir -p walks
          for seed in 1 2 3; do
            build/tests/model/overlay_walk "$seed" 1000 walks/overlay.tla
          done
          for fault in --faulty-hide-unkeyed --faulty-hotkey-hides; do
            build/tests/model/overlay_walk 1 1000 "$fault" walks/overlay.tla
          done
          for friends in 0 1 2 3; do
            for seed in 1 2 3 4 5 6 7 8; do
              build/tests/model/trace_walk "$seed" 1000 "$friends" walks/walk.tla
            done
            build/tests/model/trace_walk 1 1000 "$friends" --no-sprint walks/walk.tla
          done
          for fault in --faulty --faulty-queue --faulty-move --faulty-queue-cap --faulty-send-trim --faulty-send-dedup --faulty-close --faulty-sprint-move --faulty-sprint-close --faulty-close-fallback; do
            build/tests/model/trace_walk 1 1000 3 "$fault" walks/walk.tla
          done
          build/tests/sync/sync_test
          for windows in 1 2 3 4; do
            for seed in 1 2 3 4; do
              build/tests/sync/link_walk "$seed" 1000 "$windows" walks/link.tla
            done
          done
          for fault in --faulty-applier --faulty-mirror --faulty-tail; do
            build/tests/sync/link_walk 1 1000 2 "$fault" walks/link.tla
          done
          # the store: every unit group (MemFs, crashes at every write and sync), the server's tabs on it, then the
          # journal's walks
          build/tests/store/store_test
          build/tests/store/durable_test
          for seed in 1 2 3 4 5 6 7 8; do
            build/tests/store/journal_walk "$seed" 1000 walks/journal.tla
          done
          for fault in accept-torn cut-too-far no-truncate no-sync; do
            build/tests/store/journal_walk 1 1000 --fault "$fault" walks/journal.tla
          done
          # the driver protocol: every group (the parser and the reader over every chunking)
          build/tests/driver/driver_protocol_test
          # the driver supervisor: every group, then its walks and their faults
          build/tests/server/supervisor_test
          for seed in 1 2 3 4 5 6 7 8; do
            build/tests/server/supervisor_walk "$seed" 1000 walks/supervisor.tla
          done
          for fault in --faulty-turn --faulty-resume; do
            build/tests/server/supervisor_walk 1 1000 "$fault" walks/supervisor.tla
          done

  # Linux: everything but the window, which Prax cannot run here yet (no lib/app backend for Linux, no system fonts in
  # lib/font; CMakeLists.txt NEXUS_WINDOW), and the window's logic, which starts processes through Prax's lib/process,
  # whose POSIX backend does not link on Linux at nexus's pin (NEXUS_WINDOW_LOGIC). The link (nexus-server) uses the
  # window's logic, so it is off too (NEXUS_LINK=OFF); it also needs protobuf, which the Linux runners do not have yet.
  # On the fleet's Linux runners, with clang and lld, warnings as errors as on macOS. Caches live under
  # ~/.cache/nexus-ci on the runner's machine, laid out as the macOS jobs' (the linker's ThinLTO cache is lld's).
  build-and-unit-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, Linux, X64]
    timeout-minutes: 2
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          caches="$HOME/.cache/nexus-ci"
          mkdir -p "$caches/ccache" "$caches/lto" "$caches/$RUNNER_NAME/prax-downloads"
          {
            echo "NEXUS_CACHES=$caches"
            echo "PR_DOWNLOAD_DIR=$caches/$RUNNER_NAME/prax-downloads"
            echo "CCACHE_DIR=$caches/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=4G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            echo "JOBS=$(nproc)"
          } >> "$GITHUB_ENV"
      - name: Configure (Release)
        shell: bash
        run: |
          set -euo pipefail
          launcher=()
          if command -v ccache >/dev/null; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          else
            echo "::warning::no ccache on $(hostname -s): Prax compiles from scratch (install ccache there through the fleet play)"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF -DNEXUS_WINDOW_LOGIC=OFF "${launcher[@]}" \
            -DCMAKE_LINKER_TYPE=LLD "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--thinlto-cache-dir=$NEXUS_CACHES/lto"
      # A configure with no options at all takes the defaults that hold here (no window, no window logic, no link), so
      # a plain `cmake -S . -B build` on Linux works rather than failing late; this proves it.
      - name: Configure with the defaults
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-plain
          for option in NEXUS_WINDOW NEXUS_WINDOW_LOGIC NEXUS_LINK; do
            value=$(sed -n "s/^$option:BOOL=//p" build-plain/CMakeCache.txt)
            if [ "$value" != "OFF" ]; then
              echo "::error::a plain configure on Linux left $option at '$value', not OFF: its default in CMakeLists.txt is wrong"
              exit 1
            fi
          done
      - name: Build
        run: cmake --build build --parallel "$JOBS"
      - name: Unit tests
        run: ctest --test-dir build -L unit -j "$JOBS" --output-on-failure
      # Real child processes and real files: not unit tests.
      - name: Functional tests
        run: ctest --test-dir build -L functional -j "$JOBS" --output-on-failure
      - name: ccache hits in this job
        if: always()
        shell: bash
        run: if command -v ccache >/dev/null && [ -f "$CCACHE_STATSLOG" ]; then ccache --show-log-stats; fi

  # The macOS sanitizers job's programs and walks on Linux, with clang's AddressSanitizer and UndefinedBehaviorSanitizer.
  sanitizers-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, Linux, X64]
    timeout-minutes: 2
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Prax's download cache, one per runner
        shell: bash
        run: |
          set -euo pipefail
          downloads="$HOME/.cache/nexus-ci/$RUNNER_NAME/prax-downloads"
          mkdir -p "$downloads"
          echo "PR_DOWNLOAD_DIR=$downloads" >> "$GITHUB_ENV"
          echo "JOBS=$(nproc)" >> "$GITHUB_ENV"
      - name: Configure (Debug, ASan and UBSan)
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF -DNEXUS_WINDOW_LOGIC=OFF -DCMAKE_LINKER_TYPE=LLD
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build the model checks
        run: cmake --build build --parallel "$JOBS" --target model_checks
      - name: Unit tests and trace walks under the sanitizers
        shell: bash
        run: |
          set -euo pipefail
          build/tests/model/model_test
          build/tests/model/overlay_test
          mkdir -p walks
          for seed in 1 2 3; do
            build/tests/model/overlay_walk "$seed" 1000 walks/overlay.tla
          done
          for fault in --faulty-hide-unkeyed --faulty-hotkey-hides; do
            build/tests/model/overlay_walk 1 1000 "$fault" walks/overlay.tla
          done
          for friends in 0 1 2 3; do
            for seed in 1 2 3 4 5 6 7 8; do
              build/tests/model/trace_walk "$seed" 1000 "$friends" walks/walk.tla
            done
            build/tests/model/trace_walk 1 1000 "$friends" --no-sprint walks/walk.tla
          done
          for fault in --faulty --faulty-queue --faulty-move --faulty-queue-cap --faulty-send-trim --faulty-send-dedup --faulty-close --faulty-sprint-move --faulty-sprint-close --faulty-close-fallback; do
            build/tests/model/trace_walk 1 1000 3 "$fault" walks/walk.tla
          done
          build/tests/sync/sync_test
          for windows in 1 2 3 4; do
            for seed in 1 2 3 4; do
              build/tests/sync/link_walk "$seed" 1000 "$windows" walks/link.tla
            done
          done
          for fault in --faulty-applier --faulty-mirror --faulty-tail; do
            build/tests/sync/link_walk 1 1000 2 "$fault" walks/link.tla
          done
          # the store: every unit group (MemFs, crashes at every write and sync), the server's tabs on it, then the
          # journal's walks
          build/tests/store/store_test
          build/tests/store/durable_test
          for seed in 1 2 3 4 5 6 7 8; do
            build/tests/store/journal_walk "$seed" 1000 walks/journal.tla
          done
          for fault in accept-torn cut-too-far no-truncate no-sync; do
            build/tests/store/journal_walk 1 1000 --fault "$fault" walks/journal.tla
          done
          # the driver protocol: every group (the parser and the reader over every chunking)
          build/tests/driver/driver_protocol_test
          # the driver supervisor: every group, then its walks and their faults
          build/tests/server/supervisor_test
          for seed in 1 2 3 4 5 6 7 8; do
            build/tests/server/supervisor_walk "$seed" 1000 walks/supervisor.tla
          done
          for fault in --faulty-turn --faulty-resume; do
            build/tests/server/supervisor_walk 1 1000 "$fault" walks/supervisor.tla
          done


  model:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, macOS, ARM64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Java and the pinned TLC jar from the runner's machine
        shell: bash
        run: |
          set -euo pipefail
          java=""
          for c in "$HOME/sdk/bin/java" /opt/homebrew/opt/openjdk/bin/java; do
            if [ -x "$c" ] && "$c" -version >/dev/null 2>&1; then java=$c; break; fi
          done
          if [ -z "$java" ]; then
            echo "::error::no working java on $(hostname -s) (looked at \$HOME/sdk/bin/java and /opt/homebrew/opt/openjdk/bin/java): install a JDK 21 on this runner's machine through the fleet play, then re-run"
            exit 1
          fi
          "$java" -version
          dirname "$java" >> "$GITHUB_PATH"
          jar="$HOME/sdk/tla/tla2tools.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::no TLC jar at $jar on $(hostname -s): place tla2tools.jar v1.7.4 there (sha256 in .github/tla2tools.sha256; another fleet machine holds one), then re-run"
            exit 1
          fi
          want=$(cut -d' ' -f1 .github/tla2tools.sha256)
          have=$(shasum -a 256 "$jar" | cut -d' ' -f1)
          if [ "$want" != "$have" ]; then
            echo "::error::$jar on $(hostname -s) is not the pinned tla2tools.jar v1.7.4 (sha256 $have, want $want): replace it with the pinned jar, then re-run"
            exit 1
          fi
          echo "TLA2TOOLS_JAR=$jar" >> "$GITHUB_ENV"
      - name: Prax's download cache, one per runner
        shell: bash
        run: |
          set -euo pipefail
          downloads="$HOME/Library/Caches/nexus-ci/$RUNNER_NAME/prax-downloads"
          mkdir -p "$downloads"
          echo "PR_DOWNLOAD_DIR=$downloads" >> "$GITHUB_ENV"
          echo "JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
      # Without the link's transport (mosh and protobuf), which no check program uses.
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF
      # Only the model and its check programs: no app and no Prax shaders, so any macOS runner will do.
      - name: Build the model checks
        run: cmake --build build --parallel "$JOBS" --target model_checks
      # One TLC worker per core: the instances with tens of thousands of states run eight workers each and ctest counts
      # them as eight of its slots (PROCESSORS in tests/model/CMakeLists.txt). The largest instances, label
      # model_nightly (the window model's three largest, the link's and the store's), run in nightly.yml; every property is still checked here, on the smaller instances.
      - name: Models and trace checks
        run: ctest --test-dir build -L '^model$' -j "$JOBS" --output-on-failure

  # The window on 64-bit Windows (x64 only; there is no 32-bit build) (the port: AGENTS.md "the overlay acts exactly the same on every platform"), with MSVC at /W4
  # and warnings as errors (CMakeLists.txt sets the flags), on captain's Windows runners: everything that builds there
  # today, and its unit tests. Not the window (Prax's Win32 backend does not compile at its pin) and not the link
  # (mosh's network layer is POSIX).
  #
  # The build directory lives outside the workspace, one per runner, under %LOCALAPPDATA%\nexus-ci\<runner>, so that a
  # build is incremental and Prax is not recompiled each time (no ccache for MSVC on the runner); the first build on a
  # runner is cold. Prax's download cache sits beside it (PR_DOWNLOAD_DIR), one per runner for the reason given above.
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet, Windows, X64, captain]
    timeout-minutes: 2
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build directory and caches outside the workspace
        run: |
          $ErrorActionPreference = 'Stop'
          $caches = Join-Path $env:LOCALAPPDATA "nexus-ci\$env:RUNNER_NAME"
          New-Item -ItemType Directory -Force -Path "$caches\build-x64", "$caches\prax-downloads" | Out-Null
          "NEXUS_BUILD=$caches\build-x64" >> $env:GITHUB_ENV
          "PR_DOWNLOAD_DIR=$caches\prax-downloads" >> $env:GITHUB_ENV
          "JOBS=$([Environment]::ProcessorCount)" >> $env:GITHUB_ENV
          cmake --version
      # Prax at the commit CMakeLists.txt pins, fetched once per runner at depth 1 (a full clone outlasts the job's 2
      # minutes) into a directory of its own, then renamed into place, so a fetch cut short leaves nothing half made.
      - name: Prax at its pin, outside the workspace
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $ProgressPreference = 'SilentlyContinue'   # Invoke-WebRequest's progress bar slows it many times over
          $pin = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'pdoane/prax\.git\s+GIT_TAG\s+([0-9a-f]{40})').Groups[1].Value
          if (-not $pin) { throw "no Prax pin found in CMakeLists.txt (FetchContent_Declare(prax ... GIT_TAG <sha>))" }
          $caches = Join-Path $env:LOCALAPPDATA "nexus-ci\$env:RUNNER_NAME"
          $prax = "$caches\prax-$pin"
          if (-not (Test-Path "$prax\CMakeLists.txt")) {
            $partial = "$caches\prax-partial"
            if (Test-Path $partial) { Remove-Item -Recurse -Force $partial }
            git init -q $partial
            git -C $partial fetch -q --depth 1 https://github.com/pdoane/prax.git $pin
            git -C $partial checkout -q FETCH_HEAD
            Rename-Item $partial "prax-$pin"
          }
          "PRAX_SOURCE=$prax" >> $env:GITHUB_ENV
          # Prax's Slang compiler, into Prax's download cache the same way (downloaded beside, checked, then renamed):
          # Prax's own configure writes it straight to its final path, and a download the 2 minutes cut short would
          # start again from nothing on the next run.
          $deps = Get-Content -Raw "$prax\cmake\dependencies.cmake"
          $asset = 'windows-x86_64.zip'
          $hash = [regex]::Match($deps, 'PR_SLANG_ASSET ' + [regex]::Escape($asset) + '\)\s+set\(PR_SLANG_HASH ([0-9a-f]{64})').Groups[1].Value
          $url = [regex]::Match($deps, 'URL (https://github.com/shader-slang/\S+)\$\{PR_SLANG_ASSET\}').Groups[1].Value
          if (-not $hash -or -not $url) { throw "Prax's cmake/dependencies.cmake no longer names Slang's $asset as this step reads it" }
          $file = ($url -split '/')[-1] + $asset
          $slang = "$env:PR_DOWNLOAD_DIR\slang"
          New-Item -ItemType Directory -Force -Path $slang | Out-Null
          $have = if (Test-Path "$slang\$file") { (Get-FileHash -Algorithm SHA256 "$slang\$file").Hash.ToLower() } else { '' }
          if ($have -ne $hash) {
            # curl.exe resumes a download that an earlier run's 2 minutes cut short (-C -).
            curl.exe -fsSL --retry 3 -C - -o "$slang\$file.partial" ($url + $asset)
            $got = (Get-FileHash -Algorithm SHA256 "$slang\$file.partial").Hash.ToLower()
            if ($got -ne $hash) {
              Remove-Item -Force "$slang\$file.partial"
              throw "Slang's $file has sha256 $got, and Prax pins $hash (removed; the next run downloads it again)"
            }
            Move-Item -Force "$slang\$file.partial" "$slang\$file"
          }
      # NEXUS_WINDOW, NEXUS_WINDOW_LOGIC and NEXUS_LINK default off here (CMakeLists.txt says why for each).
      - name: Configure (Release, MSVC x64)
        run: cmake -S . -B "$env:NEXUS_BUILD" -A x64 "-DFETCHCONTENT_SOURCE_DIR_PRAX=$env:PRAX_SOURCE"
      - name: Build
        run: cmake --build "$env:NEXUS_BUILD" --config Release --parallel $env:JOBS
      - name: Unit tests
        run: ctest --test-dir "$env:NEXUS_BUILD" -C Release -L unit -j $env:JOBS --output-on-failure
      # TEMPORARY probe, removed before the pull request is ready: the window configured on, and every project compiled
      # on its own without building its references first, so that every compile error in Prax and in the window shows.
      - name: Probe (temporary)
        continue-on-error: true
        run: |
          cmake -S . -B "$env:NEXUS_BUILD-link" -A x64 -DNEXUS_WINDOW_LOGIC=ON -DNEXUS_LINK=ON "-DFETCHCONTENT_SOURCE_DIR_PRAX=$env:PRAX_SOURCE"
          $probe = "$env:NEXUS_BUILD-window"
          cmake -S . -B $probe -A x64 -DNEXUS_WINDOW=ON -DNEXUS_WINDOW_LOGIC=ON -DNEXUS_LINK=OFF "-DFETCHCONTENT_SOURCE_DIR_PRAX=$env:PRAX_SOURCE"
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $sln = Get-ChildItem "$probe\nexus.sln*" | Select-Object -First 1
          & $msbuild $sln.FullName /m /nologo /v:m /p:Configuration=Release /p:BuildProjectReferences=false
