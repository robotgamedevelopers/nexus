# Every job here runs on the fleet's own runners, never GitHub-hosted ones (Glenn, 2026-10-18: "all CI runs on our
# fleet's self-hosted runners"; restored for this workflow 2026-11-26: "Yes, fleet runners"), for every pull request and
# every push to main; no job needs a secret. .github/hosted-runners-check.sh refuses a GitHub-hosted runs-on in every
# workflow under .github/workflows, the nightly's included. The runners are nexus's own (registered to this repository only,
# label nexus-pr, from the fleet's machine records): Linux on amd-3 and intel, macOS on the macbook, Windows on captain.
# A pull request from a fork runs only after a maintainer approves it (the repository's Actions setting), since it runs
# on our machines. The nightly (.github/workflows/nightly.yml) runs from main on its own runner group.
#
# The happy path (docs/ci-tiers.md). A pull request builds each configuration once and runs its tier_pr tests: the fast
# unit tests and one end-to-end happy path per feature (tests/tiers.txt). Every other test is tier_nightly and runs in
# the nightly, with no time limit, as do the sanitizers, the Claude driver's conformance and token walls, the Release
# build with LTO and the model checks. Each test has exactly one tier, and every ctest call goes through
# .github/ctest.sh, which fails a skipped test and a selection of none.
# The Tailscale shim is built and its unit tests run separately on macOS and Linux (.github/workflows/tailscale.yml);
# its functional tests and Windows run in the nightly.
#
# Each per-commit job finishes in 2 minutes: timeout-minutes says so here. Longer work belongs in the nightly.
#
# Warnings are errors: CMakeLists.txt sets the flags, so these jobs use the plain build commands.
#
# Build directories. Each runner keeps its own build directory per configuration beside its checkout, never inside it
# (.github/actions/fleet-build, windows-build): nothing is downloaded or restored, and a build compiles only what changed
# since the last job on that runner; ccache is shared by the runners of a machine, so a runner whose directory is new
# compiles little. A cold directory (a new runner, a Prax pin change) is warmed by .github/workflows/cache-warm.yml,
# with no per-commit limit. Each configuration's build and its tests run in one job, on the runner that holds the
# build directory.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # No workflow here names a GitHub-hosted runner (ubuntu-*, macos-*, windows-*), the nightly's included.
  runners:
    runs-on: [self-hosted, nexus-pr, Linux, X64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The check refuses a GitHub-hosted runner, as planted
        run: bash .github/hosted-runners-check.sh --selftest
      - name: Only fleet runners
        run: bash .github/hosted-runners-check.sh

  # macOS Debug with the link (no LTO: Prax turns ThinLTO on for Release only; asserts on), built in the runner's own
  # build directory on the fleet Mac (Xcode, with its Metal toolchain for Prax's shaders), then the tier_pr tests. The
  # Release build with LTO, the frame budgets and every tier_nightly test run in the nightly.
  macos:
    runs-on: [self-hosted, nexus-pr, macOS, ARM64, xcode]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build directory and caches
        uses: ./.github/actions/fleet-build
        with:
          name: mac-debug
      - name: Configure and build
        uses: ./.github/actions/nexus-build
        with:
          config: mac-debug
          dir: ${{ env.NEXUS_BUILD }}
          targets: tier_pr_build
      # The link's happy paths reach this machine over `ssh localhost` (tests/link/CMakeLists.txt), which the fleet Mac
      # allows its runner's login; this job writes nothing to that login's ~/.ssh.
      - name: ssh localhost
        shell: bash
        run: |
          set -euo pipefail
          if ! ssh -o BatchMode=yes -o ConnectTimeout=5 localhost true; then
            echo "::error::ssh localhost does not work for $(id -un) on $(hostname -s); the link's tests need it (the fleet Mac's Remote Login, set at its console)"
            exit 1
          fi
          echo "ssh localhost works for $(id -un)"
      # The fast unit tests and each feature's happy path (tests/tiers.txt).
      - name: The tier_pr tests
        run: bash .github/ctest.sh --test-dir "$NEXUS_BUILD" -L '^tier_pr$' -j "$TEST_JOBS" --output-on-failure

  # The Apple Watch app (watch/, docs/watch.md): its core alone (cmake -S watch: no Prax, no link) with its unit tests,
  # then the watchOS app built warning-free for the simulator and for a watch (arm64_32, signed ad hoc), on the fleet Mac
  # (Xcode's watchOS SDKs, Ninja), each in the runner's own build directory. Its models run nightly (nightly.yml, shard
  # watch-app); its speech test is nightly.yml's watch-speech job.
  watch:
    runs-on: [self-hosted, nexus-pr, macOS, ARM64, xcode]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build directory
        uses: ./.github/actions/fleet-build
        with:
          name: watch
          rust: "false"
      - name: The watchOS SDKs
        shell: bash
        run: |
          set -euo pipefail
          for sdk in watchos watchsimulator; do
            if ! xcrun --sdk "$sdk" --show-sdk-path >/dev/null; then
              echo "::error::no $sdk SDK in $(xcode-select -p) on $(hostname -s)"
              exit 1
            fi
          done
      - name: The core and its unit tests
        run: |
          cmake -S watch -B "$NEXUS_BUILD/core" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$NEXUS_BUILD/core" --parallel "$JOBS" --target watch_core_test
          bash .github/ctest.sh --test-dir "$NEXUS_BUILD/core" -L unit --output-on-failure
      - name: The app, for the simulator
        run: |
          cmake -S . -B "$NEXUS_BUILD/sim" -G Ninja -DCMAKE_SYSTEM_NAME=watchOS -DCMAKE_OSX_SYSROOT=watchsimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$NEXUS_BUILD/sim" --parallel "$JOBS"
          cmake "-DAPP=$NEXUS_BUILD/sim/watch/nexus.app/nexus" -P watch/tests/no_test_options.cmake
      - name: The app, for a watch
        run: |
          cmake -S . -B "$NEXUS_BUILD/device" -G Ninja -DCMAKE_SYSTEM_NAME=watchOS -DCMAKE_OSX_SYSROOT=watchos \
            -DCMAKE_OSX_ARCHITECTURES=arm64_32 -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$NEXUS_BUILD/device" --parallel "$JOBS"
          cmake "-DAPP=$NEXUS_BUILD/device/watch/nexus.app/nexus" -P watch/tests/no_test_options.cmake
      - name: Record the sources the builds were made from
        run: bash .github/source-times.sh record "$NEXUS_BUILD/.nexus-ci-sources"

  server-policy:
    runs-on: [self-hosted, nexus-pr, Linux, X64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The Python runner fails on a skip, as planted
        run: bash .github/python-tests-selftest.sh
      # .github/python-tests.py fails on any skip, an empty run or a test the tier list names but cannot find. The tests
      # that need a real Mac (.github/python-native-tests.txt) are not this job's: the nightly python-native job runs them.
      - name: Exercise the installed Starlark host and driver launcher
        shell: bash
        run: |
          set -euo pipefail
          runtime=$(mktemp -d "$RUNNER_TEMP/nexus-policy.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          python3 -m venv "$runtime"
          "$runtime/bin/python" -I -m pip --disable-pip-version-check install ./policy ./drivers/rpc
          "$runtime/bin/python" .github/python-tests.py --tier pr --start policy
          "$runtime/bin/python" .github/python-tests.py --tier pr --start drivers/rpc

  # The Claude driver (drivers/claude), on a fleet Linux runner: compiled under the strict tsconfig, linted with warnings as
  # errors, and its unit tests (a scripted query: no process, clock or network). The protocol's conformance cases run
  # against it as a process (ctest -L claude_driver) in the nightly, on Linux and macOS, as do its token walls. Node
  # comes from the runner's machine, never installed here; npm ci takes the pinned packages from package-lock.json,
  # without the optional per-platform Claude executable the tests never run. The live test (npm run test:live) spends a
  # subscription and never runs here.
  claude-driver:
    runs-on: [self-hosted, nexus-pr, Linux, X64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Node from the runner's machine
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "::error::no node or npm on $(hostname -s)'s runner PATH; the fleet installs Node (sdk/bin) on its runners"
            exit 1
          fi
          echo "node $(node --version), npm $(npm --version) on $(hostname -s)"
          if [ "$RUNNER_OS" = macOS ]; then caches="$HOME/Library/Caches"; else caches="$HOME/.cache"; fi
          downloads="$caches/nexus-ci/$RUNNER_NAME/prax-downloads"
          mkdir -p "$downloads"
          echo "PR_DOWNLOAD_DIR=$downloads" >> "$GITHUB_ENV"
          echo "JOBS=$(sh .github/job-cores.sh)" >> "$GITHUB_ENV"
          echo "TEST_JOBS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      - name: Install the pinned packages
        working-directory: drivers/claude
        run: npm ci --omit=optional --no-audit --no-fund
      - name: Compile, lint and unit tests
        working-directory: drivers/claude
        run: npm run check

  # Linux: everything but the window, which Prax cannot run here yet (no lib/app backend for Linux, no system fonts in
  # lib/font; CMakeLists.txt NEXUS_WINDOW): the window's logic over Prax's lib/process (on a workaround for its link
  # error at this pin, CMakeLists.txt "Prax's lib/process on Linux"), the link and nexus-server over mosh and the
  # system's protobuf, and their tests. The sandbox's bubblewrap and socat are left to the nightly's
  # claude-driver-wall-linux, which builds and runs them (NEXUS_SANDBOX_TOOLS=OFF here, .github/actions/nexus-build
  # linux-release), so this job's 2 minutes go to nexus's own code. With clang and lld, warnings as errors as on macOS.
  # Built in the runner's own build directory, then tested there.
  linux:
    runs-on: [self-hosted, nexus-pr, Linux, X64]
    timeout-minutes: 2
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      # What the build and the link's programs need from the machine (protobuf and protobuf-lite, which mosh links,
      # OpenSSL, zlib, lld, and the ssh server the link's tests start), from the fleet's runner packages; this job
      # installs nothing.
      - name: The machine's packages
        shell: bash
        run: |
          set -euo pipefail
          need=()
          for package in libprotobuf-dev protobuf-compiler zlib1g-dev libssl-dev lld clang openssh-server openssh-client; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed' || need+=("$package")
          done
          if [ ${#need[@]} -gt 0 ]; then
            echo "::error::$(hostname -s) lacks ${need[*]}: they are fleet runner packages (nova-fleet runner-packages)"
            exit 1
          fi
      - name: Build directory and caches
        uses: ./.github/actions/fleet-build
        with:
          name: linux-release
      - name: Configure and build
        uses: ./.github/actions/nexus-build
        with:
          config: linux-release
          dir: ${{ env.NEXUS_BUILD }}
          targets: tier_pr_build
          # Whole-program optimisation is for shipping (CMakeLists.txt NEXUS_LTO); off for a pull request.
          lto: "OFF"
      # A configure with no options at all takes the defaults that hold here (no window; the window's logic, the link
      # and the sandbox's programs), so a plain `cmake -S . -B build` on Linux builds nexus-server; this proves it.
      - name: Configure with the defaults
        shell: bash
        run: |
          set -euo pipefail
          plain="$RUNNER_WORKSPACE/fleet-build/linux-plain"
          rm -rf "$plain"
          cmake -S . -B "$plain" > "$RUNNER_TEMP/configure-plain.log" || { cat "$RUNNER_TEMP/configure-plain.log"; exit 1; }
          for expect in NEXUS_WINDOW=OFF NEXUS_WINDOW_LOGIC=ON NEXUS_LINK=ON NEXUS_SANDBOX_TOOLS=ON; do
            option=${expect%%=*}
            value=$(sed -n "s/^$option:BOOL=//p" "$plain/CMakeCache.txt")
            if [ "$value" != "${expect#*=}" ]; then
              echo "::error::a plain configure on Linux left $option at '$value', not ${expect#*=}: its default in CMakeLists.txt is wrong"
              exit 1
            fi
          done
          echo "a plain configure takes the Linux defaults"
      # The link's happy paths reach this machine over `ssh localhost` (tests/link/CMakeLists.txt). A fleet Linux
      # runner's login has no ssh login of its own here, so the job starts an sshd of its own on 127.0.0.1 and the tests
      # reach it through NEXUS_E2E_SSH (.github/ssh-localhost.sh says how); nothing outside the job's directory changes.
      - name: ssh localhost, through this job's own sshd
        run: bash .github/ssh-localhost.sh "$RUNNER_TEMP/ssh-localhost"
      # The ctest wrapper every CI ctest call goes through fails a skipped or disabled test and a selection of none:
      # its planted cases (tests/ci/ctest-skips) say so.
      - name: The ctest wrapper refuses a skipped test and an empty selection
        run: bash .github/ctest-selftest.sh
      # Each test gets exactly one tier, and a row of tests/tiers.txt that names no test fails the configure: the
      # planted cases (tests/ci/tiers) say so.
      - name: The tiers, as planted
        run: bash .github/tiers-selftest.sh
      # The fast unit tests and each feature's happy path that builds here (tests/tiers.txt), the link's too
      # (link_e2e_loopback, link_e2e_signin).
      - name: The tier_pr tests
        run: bash .github/ctest.sh --test-dir "$NEXUS_BUILD" -L '^tier_pr$' -j "$TEST_JOBS" --output-on-failure
      - name: Stop this job's sshd
        if: always()
        run: bash .github/ssh-localhost.sh --stop "$RUNNER_TEMP/ssh-localhost"

  # The code generated from schema/Nexus.schema (and the tests' later version) is checked in; this regenerates it with
  # schema's compiler at the pinned commit (cmake/schema.cmake) and fails on any difference, so the checked-in code is
  # always what the pin makes of the schema files, and schema/tables.baseline has refused any edit that changes what
  # stored data means. Go comes from the runner's machine (the fleet's sdk/bin); the compiler is built once per pin and
  # runner, and kept outside the workspace under ~/.cache/nexus-ci/<runner>/schema.
  schema-generated:
    runs-on: [self-hosted, nexus-pr, Linux, X64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Regenerate at the pin
        shell: bash
        run: cmake "-DSCHEMA_CACHE=$HOME/.cache/nexus-ci/$RUNNER_NAME/schema" -P cmake/schema.cmake
      - name: The checked-in code is what the pin generates
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --porcelain -- schema tests/wire/next tests/wire/prev)
          if [ -n "$changed" ]; then
            echo "$changed"
            git --no-pager diff --stat -- schema tests/wire/next tests/wire/prev
            echo "::error::the generated code differs from what schema at the pin makes of the schema files: run cmake -P cmake/schema.cmake (or build the target schema_generate) and commit schema/gen, tests/wire/next/gen and tests/wire/prev/gen"
            exit 1
          fi

  # The Tailscale shim built alone on macOS and Linux, with its unit tests (.github/workflows/tailscale.yml, which says
  # how its caches are kept so that only a pin change is cold; its functional tests and Windows, tailscale-windows.yml,
  # run in the nightly). On a pull request it builds the head, not the merge commit, and each OS's verdict is the commit
  # status tailscale-<os> on that head, which a lander waits for; statuses: write sets it. A pull request from a fork has
  # a read-only token, so its jobs build and test but set no status (a lander of a fork's pull request reads the jobs).
  tailscale:
    uses: ./.github/workflows/tailscale.yml
    permissions:
      contents: read
      statuses: write
    with:
      prime: false
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
      tests: '^unit$'
      # macOS's x86_64 slice under Rosetta runs in the nightly: built and run beside arm64 it took the job past 2 minutes.
      rosetta: false
      status: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  # 64-bit Windows (x64 only; there is no 32-bit build), with MSVC at /W4 and warnings as errors (CMakeLists.txt sets
  # the flags): the native window and its unit tests, on captain's Windows side. On Windows only the overlay window is
  # native; nexus-server, its store, the driver protocol and supervisor, the link over mosh and every test of them build
  # and run as the Linux build inside WSL2 (the nightly's wsl2-functional and wsl2-link) and on Linux (the linux job),
  # so a native Windows build leaves them out (CMakeLists.txt NEXUS_SERVER_PARTS, NEXUS_LINK), and the model checks'
  # walks with them, which TLC runs on Linux and macOS. What is built here: nexus.exe over Prax's Win32 backend of
  # lib/app, its window logic, its link to nexus-link-relay inside WSL2 (src/relay/relay_port.h), the libraries it
  # links, and the unit tests among them that run per pull request (tier_pr_build); the two tests the nightly's
  # wsl2-terminal and wsl2-link run across the WSL2 boundary are built by its windows-wsl2-test. The runner's own
  # build directory, on D: (.github/actions/windows-build).
  windows:
    runs-on: [self-hosted, nexus-pr, Windows, X64]
    timeout-minutes: 2
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build directory, configure and build
        uses: ./.github/actions/windows-build
        with:
          # What the tier_pr tests run, and the window itself (no tier_pr test runs nexus.exe).
          target: tier_pr_build nexus
          # Whole-program optimisation is for shipping (CMakeLists.txt NEXUS_LTO); off for a pull request.
          lto: "OFF"
      # The fast unit tests (tests/tiers.txt); the slower ones run in the nightly's windows-nightly.
      - name: The tier_pr tests
        run: |
          & ./.github/ctest.ps1 --test-dir "$env:NEXUS_BUILD" -C Release -L '^tier_pr$' -j $env:TEST_JOBS --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "ctest exited $LASTEXITCODE" }
      - name: The window was built
        run: if (-not (Test-Path "$env:NEXUS_BUILD\Release\nexus.exe")) { throw "no nexus.exe in $env:NEXUS_BUILD\Release" }
