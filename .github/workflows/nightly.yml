# Nightly TLC model checking, including witnesses, implementation traces and the largest instances.
name: nightly

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # The largest instances, on the fleet Mac. On the hosted macos-26 image (3 cores, Prax built cold each night) it ran
  # past its 30 minutes on 2026-11-25 (run 45683088547) and was cut off. A nightly has no time limit: the model jobs
  # configure with NEXUS_TLC_UNCAPPED (CMakeLists.txt), so no check has a cap, and each job's 360 minutes is a safety
  # net for a hung runner, not a budget.
  model-large:
    runs-on: [self-hosted, nexus-nightly, macOS, ARM64, xcode]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Prepare the pinned TLC jar
        shell: bash
        run: |
          set -euo pipefail
          jdk=$(/usr/libexec/java_home -v 21)
          "$jdk/bin/java" -version
          echo "$jdk/bin" >> "$GITHUB_PATH"
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$jar"
          echo "$(cut -d' ' -f1 .github/tla2tools.sha256)  $jar" | shasum -a 256 -c -
          echo "TLA2TOOLS_JAR=$jar" >> "$GITHUB_ENV"
      - name: Prax's download cache, one per runner
        shell: bash
        run: |
          set -euo pipefail
          downloads="$HOME/Library/Caches/nexus-ci/$RUNNER_NAME/prax-downloads"
          mkdir -p "$downloads"
          echo "PR_DOWNLOAD_DIR=$downloads" >> "$GITHUB_ENV"
          echo "JOBS=$(sh .github/job-cores.sh)" >> "$GITHUB_ENV"
          echo "TEST_JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
      # Without the link's transport (mosh and protobuf), which no check program uses.
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_TLC_UNCAPPED=ON
      - name: Build the model checks
        run: cmake --build build --parallel "$JOBS" --target model_checks
      - name: The largest instances
        run: bash .github/ctest.sh --test-dir build -L '^model_nightly$' -j "$TEST_JOBS" --output-on-failure

  model:
    # Keep the compiled trace walks and the CPU-intensive specs on prebuilt runners.
    runs-on: ${{ (matrix.build || matrix.prebuilt) && fromJSON('["self-hosted","nexus-nightly","Linux","X64","tlc"]') || 'ubuntu-24.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # The five supervisor instances' temporal property (Settles), in two halves, each half in a shard of its own;
          # their invariants and action properties (`_rest`, seconds each) run in supervisor-rest
          # (tests/server/CMakeLists.txt says why).
          - shard: supervisor-1
            run: '^tlc_supervisor_temporal_1$'
          - shard: supervisor-2
            run: '^tlc_supervisor_temporal_2$'
          - shard: supervisor-switch-1
            run: '^tlc_supervisor_switch_temporal_1$'
          - shard: supervisor-switch-2
            run: '^tlc_supervisor_switch_temporal_2$'
          - shard: supervisor-place-1
            run: '^tlc_supervisor_place_temporal_1$'
          - shard: supervisor-place-2
            run: '^tlc_supervisor_place_temporal_2$'
          - shard: supervisor-signin-1
            run: '^tlc_supervisor_signin_temporal_1$'
          - shard: supervisor-signin-2
            run: '^tlc_supervisor_signin_temporal_2$'
          - shard: supervisor-friend-1
            run: '^tlc_supervisor_friend_temporal_1$'
          - shard: supervisor-friend-2
            run: '^tlc_supervisor_friend_temporal_2$'
          - shard: supervisor-rest
            run: '^tlc_supervisor_'
            build: supervisor_walk
            skip: '^tlc_supervisor_(switch_|place_|signin_|friend_)?temporal_[0-9]+$'
          - shard: link-ensure
            prebuilt: true
            run: '^tlc_link_ensure$'
          - shard: link-one-window
            run: '^tlc_link_one_window$'
          - shard: link-tabs
            run: '^tlc_link_tabs$'
          - shard: link-two-windows
            run: '^tlc_link_two_windows$'
          - shard: link-rest
            run: '^tlc_link_'
            build: link_walk
            skip: '^tlc_link_(ensure|one_window|tabs|two_windows)$'
          - shard: accounts
            prebuilt: true
            run: '^tlc_accounts$'
          - shard: accounts-rest
            run: '^tlc_accounts_'
            build: accounts_walk
          # The journal (models/store/Journal.tla): its spec alone (49 s on four workers of an idle 16-thread bench,
          # 2026-11-26), beside the witnesses and the code's walks with their faults, so the two run at once.
          - shard: journal-spec
            run: '^tlc_journal_spec$'
          - shard: journal
            run: '^tlc_journal'
            build: journal_walk
            skip: '^tlc_journal_spec$'
          # The store's lock and the start-up order (models/store/StoreLock.tla): its instances, witnesses and the
          # code's walks.
          - shard: store-lock
            run: '^tlc_store_lock'
            build: store_lock_walk
          # Placement (models/placement/Placement.tla): its two-actor instance alone (50 s on four workers), then the
          # one-actor instance, the witnesses and the code's walks with their faults (about 40 s on two cores).
          - shard: placement-spec
            run: '^tlc_placement_spec$'
          - shard: placement-rest
            run: '^tlc_placement_'
            build: builds_walk
            skip: '^tlc_placement_spec$'
          # Handover (models/handover/Handover.tla): its temporal spec instances in a shard of their own (capped at
          # 80 s), then the witnesses and the code's walks with their faults.
          - shard: handover-spec
            run: '^tlc_handover_(spec|cut_resume|legacy)$'
          - shard: handover-rest
            run: '^tlc_handover_'
            build: handover_walk
            skip: '^tlc_handover_(spec|cut_resume|legacy)$'
          # Supervision (models/supervision/Supervision.tla): its temporal spec instances in a shard of their own
          # (capped at 80 s), then the witnesses and the code's walks with their faults.
          - shard: supervision-spec
            run: '^tlc_supervision_(spec|rollback|dual_fail)$'
          - shard: supervision-rest
            run: '^tlc_supervision_'
            build: supervision_walk
            skip: '^tlc_supervision_(spec|rollback|dual_fail)$'
          # Old-layout migration and store format against rollback (models/migration/Migration.tla): its instances,
          # ten witnesses and the code's walks with their nine faults (about 16 s on four cores).
          - shard: migration
            run: '^tlc_migration_'
            build: migration_walk
          # End-to-end takeover composition across all five layers (models/takeover/Takeover.tla): its temporal spec
          # instances in `takeover-spec`, and its eleven witnesses plus real five-layer walks and eleven faults in
          # `takeover-rest`.
          - shard: takeover-spec
            run: '^tlc_takeover_(spec|format_rollback)$'
          - shard: takeover-rest
            run: '^tlc_takeover_'
            build: takeover_walk
            skip: '^tlc_takeover_(spec|format_rollback)$'
          # The Claude driver's turn and ask-secret instances (models/ClaudeDriver.tla), each in a shard of its own
          # with no Node setup, and its twelve witnesses and nine code traces in claude-rest (node: true).
          - shard: claude-driver
            run: '^tlc_claude_driver$'
          - shard: claude-secrets
            run: '^tlc_claude_driver_secrets$'
          - shard: claude-rest
            run: '^tlc_claude'
            skip: '^tlc_claude_driver(_secrets)?$'
            node: true
          - shard: witnesses
            run: '^tlc_witness'
          # The secret dialog's instances and witnesses (models/Secrets.tla), then its code's walks against
          # SecretsTrace.tla (about 90 records each) and their faults.
          - shard: secrets-spec
            run: '^tlc_secrets_spec$'
          - shard: secrets-rest
            run: '^tlc_secrets_'
            skip: '^tlc_secrets_(spec$|trace_)'
          - shard: secrets-trace
            run: '^tlc_secrets_trace_'
            build: secrets_walk
          # The board's scroller, the overlay and terminal foreground synchronization: their specs, witnesses and walks
          # (short tests), split from window, which ran 50 s at p50 and 112 s at worst with them.
          - shard: glide-overlay
            run: '^tlc_(glide|overlay|watch)_'
            build: overlay_walk glide_walk watch_walk
          # The Apple Watch client (watch/models, docs/watch.md): the voice turn and the relay to the phone, their
          # witnesses, and the code's walks against them with each planted fault rejected (short tests).
          - shard: watch-app
            run: '^tlc_watchapp_'
            build: watch_voice_walk watch_relay_walk
          # The Tailscale shim's node lifecycle (models/Tailscale.tla): the three liveness instances (47,169 to 74,329
          # states) each in a shard of their own on eight workers, then the witnesses, recorded orders and Go walks.
          - shard: tailscale-spec
            run: '^tlc_tailscale_spec$'
          - shard: tailscale-keys
            run: '^tlc_tailscale_spec_keys$'
          - shard: tailscale-certs
            run: '^tlc_tailscale_spec_certs$'
          - shard: tailscale-rest
            run: '^tlc_tailscale_'
            skip: '^tlc_tailscale_spec(_keys|_certs)?$'
          # The window's friends from the server's list (MCWindowFriends, 39,465 states on four workers), alone: in the
          # window shard it ran past its 60 s.
          - shard: window-friends
            run: '^tlc_spec_friends$'
          # The friend strip's shared-file instance (MCFriendStripShared, 150,016 states) in its own shard on eight
          # workers, then its single-window spec and its code's walks against FriendStripTrace.tla, and their faults.
          - shard: strip-shared
            run: '^tlc_spec_strip_shared$'
          - shard: strip-rest
            run: '^tlc_(strip_|spec_strip)'
            skip: '^tlc_spec_strip_shared$'
            build: strip_walk
          # In-app sign-in (models/SignIn.tla): its two large safety instances (MCSignInTwo, 371,695 states;
          # MCSignInGate, 813,557 states) each in a shard of their own on eight workers, then its one-window spec and
          # witnesses, and its code's walks against SignInTrace.tla (~800 records each) in two halves of four traces.
          - shard: signin-two
            run: '^tlc_signin_spec_two$'
          - shard: signin-gate
            run: '^tlc_signin_spec_gate$'
          - shard: signin-rest
            run: '^tlc_signin_'
            skip: '^tlc_signin_(trace_|spec_two$|spec_gate$)'
          - shard: signin-trace-1
            run: '^tlc_signin_trace_seed_[1-4]$'
            build: signin_walk
          - shard: signin-trace-2
            run: '^tlc_signin_trace_'
            skip: '^tlc_signin_trace_seed_[1-4]$'
            build: signin_walk
          # The window's link making its session again (models/Reconnect.tla): spec, witnesses and the code's walks.
          - shard: reconnect
            run: '^tlc_reconnect'
            build: reconnect_walk
          # One pass of nexus-server's loop (models/LoopPass.tla): its temporal instance in loop-pass-spec (no walk
          # build), and its two-window instance, eleven reversed witnesses, five seeded code walks and five faulty
          # walks in loop-pass-rest.
          - shard: bus-delivery
            run: '^tlc_bus_delivery_'
            build: bus_delivery_trace
          - shard: loop-pass-spec
            run: '^tlc_loop_pass_spec$'
          - shard: loop-pass-rest
            run: '^tlc_loop_pass_'
            skip: '^tlc_loop_pass_spec$'
            build: pass_walk
          # The rest: every model test no shard above names. Its skip is one alternative per family of shards above; a
          # new family adds its prefix there.
          - shard: window
            run: ''
            build: trace_walk service_process_functional
            skip: '^tlc_(supervisor|link|accounts|journal|store_lock|placement|handover|supervision|migration|takeover|claude|witness|secrets|glide|overlay|watch|tailscale|strip_|spec_strip|spec_friends$|signin|reconnect|loop_pass|bus_delivery)'
    name: model (${{ matrix.shard }})
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Fetch the pinned TLC jar for hosted runners
        if: runner.environment == 'github-hosted'
        run: |
          mkdir -p "$HOME/sdk/tla"
          curl -fsSL --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$HOME/sdk/tla/tla2tools.jar"
      - name: Java and the pinned TLC jar from the runner's machine
        shell: bash
        run: |
          set -euo pipefail
          java=""
          for c in "$(command -v java || true)" "$HOME/sdk/bin/java" /usr/bin/java; do
            if [ -n "$c" ] && [ -x "$c" ] && "$c" -version >/dev/null 2>&1; then java=$c; break; fi
          done
          if [ -z "$java" ]; then
            echo "::error::no working java on $(hostname -s) (looked on PATH, at \$HOME/sdk/bin/java and /usr/bin/java): install a JDK 21 on this runner's machine through the fleet play, then re-run"
            exit 1
          fi
          "$java" -version
          dirname "$java" >> "$GITHUB_PATH"
          jar=""
          for c in "$HOME/sdk/tla/tla2tools.jar" /opt/tla/tla2tools.jar; do
            if [ -f "$c" ]; then jar=$c; break; fi
          done
          if [ -z "$jar" ]; then
            echo "::error::no TLC jar on $(hostname -s) (looked at \$HOME/sdk/tla/tla2tools.jar and /opt/tla/tla2tools.jar): place tla2tools.jar v1.7.4 there (sha256 in .github/tla2tools.sha256; another fleet machine holds one), then re-run"
            exit 1
          fi
          want=$(cut -d' ' -f1 .github/tla2tools.sha256)
          have=$(sha256sum "$jar" | cut -d' ' -f1)
          if [ "$want" != "$have" ]; then
            echo "::error::$jar on $(hostname -s) is not the pinned tla2tools.jar v1.7.4 (sha256 $have, want $want): replace it with the pinned jar, then re-run"
            exit 1
          fi
          echo "TLA2TOOLS_JAR=$jar" >> "$GITHUB_ENV"
      - name: Caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          caches="$HOME/.cache/nexus-ci"
          mkdir -p "$caches/ccache" "$caches/$RUNNER_NAME/prax-downloads"
          {
            echo "PR_DOWNLOAD_DIR=$caches/$RUNNER_NAME/prax-downloads"
            echo "CCACHE_DIR=$caches/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=4G"
            echo "JOBS=$(sh .github/job-cores.sh)"
            echo "TEST_JOBS=$(nproc)"
          } >> "$GITHUB_ENV"
      # The runner's share of its host's cores, read at run time (NOVA_JOB_CORES, which each fleet runner exports; the
      # core count where it is unset): no TLC run takes more workers than that (tests/model/tlc-workers.cmake), so a
      # shard asks its host for what the fleet gives it, however many runners the host carries. Never below 4: the
      # instances with a shard of their own fit their 80 s on four cores (switch 45 s, place 40, link ensure 34, on
      # four pinned cores of an idle 16-thread host) and not on two (sign-in 94-107 s), so a share under 4 is a fleet
      # record to change, and the job says so in its log. TEST_JOBS stays the core count: it counts ctest's slots for
      # the trace checks and witnesses, each a JVM that runs a second or two on one core.
      - name: The runner's share of cores for TLC
        shell: bash
        run: |
          set -euo pipefail
          share=$(sh .github/job-cores.sh)
          if [ "$share" -lt 4 ]; then
            echo "::warning::this runner's share on $(hostname -s) is $share cores (NOVA_JOB_CORES); the model shards need 4 (ci.yml, model, says why), so TLC runs on 4"
            share=4
          fi
          echo "TLC runs take at most $share workers each"
          echo "NEXUS_TLC_CORES=$share" >> "$GITHUB_ENV"
      # The Claude driver's trace checks (models/ClaudeDriverTrace.tla) run its unit tests and its walk under Node, from
      # its build: Node from the runner's machine as in the claude-driver job, the pinned packages, the compile alone.
      - name: Node from the runner's machine, and the Claude driver built
        if: matrix.node
        shell: bash
        working-directory: drivers/claude
        run: |
          set -euo pipefail
          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "::error::no node or npm on $(hostname -s)'s runner PATH; the fleet installs Node (sdk/bin) on its runners"
            exit 1
          fi
          npm ci --omit=optional --no-audit --no-fund
          npm run build
      # Without the window, its logic and the link's transport, which no check program uses (as ci.yml's build-linux).
      - name: Configure (Release)
        shell: bash
        run: |
          set -euo pipefail
          launcher=()
          if command -v ccache >/dev/null; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF -DNEXUS_WINDOW_LOGIC=OFF \
            -DCMAKE_LINKER_TYPE=LLD -DNEXUS_TLC_UNCAPPED=ON "${launcher[@]}"
      # Only the walks this shard's trace checks run (`build`); a shard of specs and witnesses alone builds nothing.
      - name: Build the shard's walks
        if: matrix.build
        shell: bash
        env:
          TARGETS: ${{ matrix.build }}
        run: |
          set -euo pipefail
          read -r -a targets <<< "$TARGETS"
          cmake --build build --parallel "$JOBS" --target "${targets[@]}"
      # One TLC worker per core: the instances with tens of thousands of states run eight workers each and ctest counts
      # them as eight of its slots (PROCESSORS in tests/model/CMakeLists.txt). The largest instances, label
      # model_nightly, run in nightly.yml; every property is still checked here, on the smaller instances.
      - name: Models and trace checks
        shell: bash
        env:
          RUN: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}
        run: |
          set -euo pipefail
          select=()
          if [ -n "$RUN" ]; then select+=(-R "$RUN"); fi
          if [ -n "$SKIP" ]; then select+=(-E "$SKIP"); fi
          bash .github/ctest.sh --test-dir build -L '^model$' "${select[@]}" -j "$TEST_JOBS" --output-on-failure

  # The tab label's trace checks (TabLabelTrace.tla), whose walk needs the window's logic: on macOS, as the model job
  # ran them before it moved to Linux.
  model-window:
    runs-on: [self-hosted, nexus-nightly, macOS, ARM64, xcode]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Java and the pinned TLC jar from the runner's machine
        shell: bash
        run: |
          set -euo pipefail
          java=""
          for c in "$HOME/sdk/bin/java" /opt/homebrew/opt/openjdk/bin/java; do
            if [ -x "$c" ] && "$c" -version >/dev/null 2>&1; then java=$c; break; fi
          done
          if [ -z "$java" ]; then
            echo "::error::no working java on $(hostname -s) (looked at \$HOME/sdk/bin/java and /opt/homebrew/opt/openjdk/bin/java): install a JDK 21 on this runner's machine through the fleet play, then re-run"
            exit 1
          fi
          "$java" -version
          dirname "$java" >> "$GITHUB_PATH"
          jar="$HOME/sdk/tla/tla2tools.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::no TLC jar at $jar on $(hostname -s): place tla2tools.jar v1.7.4 there (sha256 in .github/tla2tools.sha256; another fleet machine holds one), then re-run"
            exit 1
          fi
          want=$(cut -d' ' -f1 .github/tla2tools.sha256)
          have=$(shasum -a 256 "$jar" | cut -d' ' -f1)
          if [ "$want" != "$have" ]; then
            echo "::error::$jar on $(hostname -s) is not the pinned tla2tools.jar v1.7.4 (sha256 $have, want $want): replace it with the pinned jar, then re-run"
            exit 1
          fi
          echo "TLA2TOOLS_JAR=$jar" >> "$GITHUB_ENV"
      - name: Caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          caches="$HOME/Library/Caches/nexus-ci"
          mkdir -p "$caches/ccache" "$caches/$RUNNER_NAME/prax-downloads"
          {
            echo "PR_DOWNLOAD_DIR=$caches/$RUNNER_NAME/prax-downloads"
            echo "CCACHE_DIR=$caches/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=4G"
            echo "JOBS=$(sh .github/job-cores.sh)"
            echo "TEST_JOBS=$(sysctl -n hw.ncpu)"
          } >> "$GITHUB_ENV"
      # Without the link's transport (mosh and protobuf), which the walk does not use.
      - name: Configure (Release)
        shell: bash
        run: |
          set -euo pipefail
          launcher=()
          if command -v ccache >/dev/null; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
                      -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_TLC_UNCAPPED=ON "${launcher[@]}"
      - name: Build the label and account-picker trace programs
        run: cmake --build build --parallel "$JOBS" --target label_walk account_picker_trace
      - name: Check tab-label and account-picker traces
        run: |
          for family in label_trace window_account_picker_trace; do
            bash .github/ctest.sh --test-dir build -L '^model$' -R "^tlc_${family}" -j "$TEST_JOBS" --output-on-failure || exit 1
          done

  # The watch's speech test (watch/tests/speech.cmake): recordings spoken by `say`, through the recognizer the phone
  # uses (SpeechTranscriber, on device, as nexus-watch-relay --transcribe) and the shared name matcher, and silence
  # refused with its reason; with its planted twin, which must fail. nexus-watch-relay links the link, so this is the
  # full configure (ci.yml's macOS Debug, from its cache: hosted-caches and nexus-build, which bring Ninja, protobuf and
  # the pinned Rust) on a runner with Xcode. Never the studio (Glenn's screen); the fleet's only other Mac, mini-m5, has
  # no Xcode and no runner label apart from the studio's, so this runs on GitHub's hosted macOS (macos-26) until a
  # fleet Mac off the studio carries Xcode.
  watch-speech:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Tools and caches
        uses: ./.github/actions/hosted-caches
        with:
          name: mac-debug
          require: "false"
          brew: ninja protobuf
          brew-keep: protobuf abseil
      - name: Build the relay and the matcher
        uses: ./.github/actions/nexus-build
        with:
          config: mac-debug
          targets: nexus_watch_relay_host watch_match
      - name: Speech
        run: bash .github/ctest.sh --test-dir build -R '^watch_speech(_planted)?$' --output-on-failure

  # Windows' functional tests, inside WSL2: on Windows the overlay stays native and everything else (nexus-server, the
  # link, the drivers and their tests) runs as the Linux build inside WSL2 (AGENTS.md, platform targets). So these run
  # on captain's WSL2 runners (label wsl2: Linux runners inside captain's WSL2 distro, from the fleet's record), with
  # the defaults' configure, as on Linux: the window's logic, the link and nexus-server (and the sandbox's bubblewrap
  # and socat), all but the window. The first step refuses to run anywhere but WSL2.
  # Caches as ci.yml's build-linux's, under ~/.cache/nexus-ci inside the distro.
  wsl2-functional:
    runs-on: [self-hosted, nexus-nightly, Linux, X64, wsl2]
    timeout-minutes: 15
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Inside WSL2, and caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          kernel=$(cat /proc/sys/kernel/osrelease)
          case "$kernel" in
            *microsoft*WSL2*|*WSL2*) echo "WSL2 kernel $kernel${WSL_DISTRO_NAME:+, distro $WSL_DISTRO_NAME}" ;;
            *) echo "::error::$(hostname -s) is not inside WSL2 (kernel $kernel): the wsl2 label belongs only to runners in captain's WSL2 distro"; exit 1 ;;
          esac
          caches="$HOME/.cache/nexus-ci"
          mkdir -p "$caches/ccache" "$caches/lto" "$caches/$RUNNER_NAME/prax-downloads"
          {
            echo "NEXUS_CACHES=$caches"
            echo "PR_DOWNLOAD_DIR=$caches/$RUNNER_NAME/prax-downloads"
            echo "CCACHE_DIR=$caches/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=4G"
            echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            echo "JOBS=$(sh .github/job-cores.sh)"
            echo "TEST_JOBS=$(nproc)"
          } >> "$GITHUB_ENV"
      - name: Configure (Release)
        shell: bash
        run: |
          set -euo pipefail
          if command -v ninja >/dev/null && [ ! -f build/CMakeCache.txt ]; then
            export CMAKE_GENERATOR=Ninja
          fi
          launcher=()
          if command -v ccache >/dev/null; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          else
            echo "::warning::no ccache on $(hostname -s): Prax compiles from scratch (install ccache there through the fleet play)"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${launcher[@]}" \
            -DCMAKE_LINKER_TYPE=LLD "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--thinlto-cache-dir=$NEXUS_CACHES/lto"
          for option in NEXUS_WINDOW_LOGIC NEXUS_LINK NEXUS_SANDBOX_TOOLS; do
            [ "$(sed -n "s/^$option:BOOL=//p" build/CMakeCache.txt)" = ON ] || { echo "::error::$option is not ON inside WSL2"; exit 1; }
          done
      - name: Build
        run: cmake --build build --parallel "$JOBS"
      - name: nexus-server is built
        run: test -x build/nexus-server
      - name: Functional tests
        run: bash .github/ctest.sh --test-dir build -L functional -j "$TEST_JOBS" --output-on-failure
      - name: ccache hits in this job
        if: always()
        shell: bash
        run: if command -v ccache >/dev/null && [ -f "$CCACHE_STATSLOG" ]; then ccache --show-log-stats; fi

  server-lock:
    runs-on: [self-hosted, nexus-nightly, macOS, ARM64, xcode]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build and exercise the server lock under contention
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_WINDOW=OFF
          cmake --build build --parallel "$(sh .github/job-cores.sh)" --target server_lock
          bash .github/ctest.sh --test-dir build -R '^server_lock_functional$' --output-on-failure

  # The Claude driver's token wall inside captain's WSL2 (claude-driver-wall-linux below runs it on hosted Ubuntu
  # too; WSL2 needs the fleet).
  claude-driver-wall-wsl2:
    strategy:
      fail-fast: false
      matrix:
        where: [wsl2]
        # The unlimited runs each in a job of its own: on WSL2 under load one run took 52 s, two past the cap. The two
        # limited runs share one: each took seconds on macOS (2026-11-15); WSL2 under load is the one to watch.
        run: [whole-wall, without-the-hook, "limited,limited-nohook"]
        include:
          - where: wsl2
            labels: [self-hosted, nexus-nightly, Linux, X64, wsl2]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.where == 'wsl2'
        with:
          node-version: '22.14.0'
      - name: Where this runs, and caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          kernel=$(cat /proc/sys/kernel/osrelease)
          case "$kernel" in *microsoft*|*WSL2*) wsl=wsl2 ;; *) wsl=ubuntu ;; esac
          if [ "$wsl" != "${{ matrix.where }}" ]; then
            echo "::error::$(hostname -s) (kernel $kernel) is not a ${{ matrix.where }} machine"
            exit 1
          fi
          restrict=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo none)
          echo "$(hostname -s): kernel $kernel; apparmor_restrict_unprivileged_userns: $restrict; passwordless sudo: $(sudo -n true 2>/dev/null && echo yes || echo no)"
          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "::error::no node or npm on $(hostname -s)'s runner PATH; the fleet installs Node (sdk/bin) on its runners"
            exit 1
          fi
          # The runs' directories under a temporary directory of this runner's own: two Claude sandboxes at once whose
          # working directories share an ancestor a few levels up fail each other's commands now and then (bwrap:
          # Can't find source path .../runner-tmp/.mcp.json; two jobs on amd-2, 2026-11-15). Always under /tmp (never an
          # inherited TMPDIR such as ~/.cache/runner-tmp, which pushes Unix domain socket paths past sun_path's 108-byte
          # limit on long runner names).
          runner_dir=${RUNNER_NAME// /_}
          own="/tmp/$runner_dir"
          mkdir -p "$own"
          echo "TMPDIR=$own" >> "$GITHUB_ENV"
          caches="$HOME/.cache/nexus-ci"
          mkdir -p "$caches/$runner_dir/prax-downloads"
          {
            echo "SANDBOX_BUILD=$caches/$runner_dir/sandbox-build"
            echo "PR_DOWNLOAD_DIR=$caches/$runner_dir/prax-downloads"
            echo "NEXUS_SANDBOX_BIN=$caches/$runner_dir/sandbox-build/sandbox"
          } >> "$GITHUB_ENV"
      - name: Build bubblewrap and socat
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$SANDBOX_BUILD" -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF \
            -DNEXUS_WINDOW_LOGIC=OFF -DNEXUS_SANDBOX_TOOLS=ON > /dev/null
          cmake --build "$SANDBOX_BUILD" --target nexus_sandbox_tools --parallel "$(sh .github/job-cores.sh)"
          "$NEXUS_SANDBOX_BIN/bwrap/bwrap" --version
          "$NEXUS_SANDBOX_BIN/socat/socat" -V | head -2
      - name: Install the pinned packages, with the Claude executable
        working-directory: drivers/claude
        # Installed once per lockfile on each runner and kept beside its other caches: WSL2's install took 24 to 47 s
        # when it asked the registry each time, and 26 to 38 s from npm's cache on a loaded captain (Ubuntu: 4 s).
        shell: bash
        run: |
          set -euo pipefail
          base="$HOME/.cache/nexus-ci/$RUNNER_NAME/claude-driver-packages"
          kept="$base/$(sha256sum package-lock.json | cut -c1-16)"
          if [ ! -d "$kept/node_modules" ]; then
            npm ci --prefer-offline --no-audit --no-fund
            rm -rf "$base"
            mkdir -p "$kept"
            mv node_modules "$kept/node_modules"
          fi
          rm -rf node_modules
          ln -s "$kept/node_modules" node_modules
      - name: Compile
        working-directory: drivers/claude
        run: npm run build
      - name: The token wall
        working-directory: drivers/claude
        env:
          NEXUS_WALL_REPORT: '1'
          NEXUS_WALL_FRESH_PROFILE: '1'
          NEXUS_WALL_RUN: ${{ matrix.run }}
        # Where this runner's own login reaches hulk, ssh there must work from the sandbox too, and from there no
        # login back to this machine. A runner with no login to hulk fails the job by name (the rest of the wall still
        # runs first): no probe is ever skipped.
        run: |
          if ssh -o BatchMode=yes -o ConnectTimeout=5 hulk true 2>/dev/null; then
            export NEXUS_WALL_SSH_HOST=hulk NEXUS_WALL_SSH_BACK="$(hostname -s)"
            ssh_out=ran
          else
            echo "::error title=ssh-out probe::no login to hulk from $(hostname -s) as $(id -un): the token wall's ssh-out probe cannot run, and no probe is skipped; the fleet gives this runner's login a key for hulk"
            ssh_out=missing
          fi
          # Separate runner workspaces still share /tmp/.mcp.json during SDK setup.
          # Serialize just this test on each Linux host, including across workflow runs.
          flock "$HOME/.cache/nexus-ci/claude-wall.lock" npm run test:functional
          [ "$ssh_out" = ran ]

  # The WSL2 terminal test (wsl2-terminal below), built with MSVC on a GitHub-hosted Windows runner as ci.yml's windows
  # job builds it (.github/actions/windows-build, from cache-warm's cache when there is one; no limit here).
  windows-wsl2-test:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Caches, configure and build
        uses: ./.github/actions/windows-build
        with:
          require: "false"
      - name: Keep the WSL2 terminal test for wsl2-terminal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wsl2-terminal-test
          path: ${{ env.NEXUS_BUILD }}\tests\window\Release\nexus_wsl2_terminal_tests.exe
          if-no-files-found: error
          retention-days: 1

  # A Windows terminal tab's shell for real (tests/window/test_wsl2_terminal.cpp, ctest wsl2_terminal): the probe through
  # wsl.exe, then the launch line on a Windows pseudoconsole through Prax's lib/process, as a terminal tab starts it; the
  # shell's prompt, TERM, home directory, Escape and exit. windows-wsl2-test builds it with MSVC on a GitHub-hosted runner; it runs here, on captain's
  # WSL2 runners, through WSL interop, which starts it on Windows as the user whose WSL2 distribution that is. It cannot
  # run in the windows job: those runners run as NETWORK SERVICE, which has no WSL2 distribution.
  wsl2-terminal:
    needs: windows-wsl2-test
    runs-on: [self-hosted, nexus-nightly, Linux, X64, wsl2]
    timeout-minutes: 30
    steps:
      - name: Inside WSL2, with interop to Windows
        shell: bash
        run: |
          set -euo pipefail
          kernel=$(cat /proc/sys/kernel/osrelease)
          case "$kernel" in
            *microsoft*WSL2*|*WSL2*) echo "WSL2 kernel $kernel${WSL_DISTRO_NAME:+, distro $WSL_DISTRO_NAME}" ;;
            *) echo "::error::$(hostname -s) is not inside WSL2 (kernel $kernel): the wsl2 label belongs only to runners in captain's WSL2 distro"; exit 1 ;;
          esac
          if [ ! -e /proc/sys/fs/binfmt_misc/WSLInterop ]; then
            echo "::error::WSL interop is off on $(hostname -s) (no /proc/sys/fs/binfmt_misc/WSLInterop): Windows programs cannot start from here; turn it on in /etc/wsl.conf ([interop] enabled=true)"
            exit 1
          fi
      - name: The test the windows job built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl2-terminal-test
          path: ${{ runner.temp }}/wsl2-terminal
      - name: wsl2_terminal (functional)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/wsl2-terminal/nexus_wsl2_terminal_tests.exe"
          "$RUNNER_TEMP/wsl2-terminal/nexus_wsl2_terminal_tests.exe"

  # The frame budget (docs/frame-budget.md): the frame thread timed on the real clock, against budgets set on the fleet's
  # Macs, so on a fleet Mac (a shared 3-core hosted VM is not that machine; ci.yml says so). Built Release with the
  # link, as ci.yml's build-macos, then run alone, with every nova-reserve slot on this host when it can have them
  # within 20 s; else shared.
  frame-budget:
    runs-on: [self-hosted, nexus-nightly, macOS, ARM64, xcode]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Configure (Release) and build the frame-budget test
        shell: bash
        run: |
          set -euo pipefail
          downloads="$HOME/Library/Caches/nexus-ci/$RUNNER_NAME/prax-downloads"
          mkdir -p "$downloads"
          export PR_DOWNLOAD_DIR="$downloads"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_E2E_TAILNET=
          cmake --build build --parallel "$(sh .github/job-cores.sh)" --target nexus_frame_tests
      - name: Frame budget, alone
        shell: bash
        run: |
          set -uo pipefail
          frames=(bash .github/ctest.sh --test-dir build -R '^window_frame_budget$' --output-on-failure)
          if command -v nova-reserve >/dev/null; then
            held="$RUNNER_TEMP/frame-budget-held"
            rm -f "$held"
            if nova-reserve run --exclusive --wait 20s --why "nexus CI frame budget" -- \
                sh -c 'touch "$0" && exec "$@"' "$held" "${frames[@]}"; then
              exit 0
            fi
            if [ -f "$held" ]; then
              exit 1
            fi
            echo "::notice::no exclusive hold on $(hostname -s) within 20 s: the frame budget runs shared"
          fi
          "${frames[@]}"

  # The Tailscale shim on Windows (tailscale-windows.yml), with no time limit: restoring its primed cache alone took 83 s
  # on the hosted Windows image (docs/tailscale.md), which does not fit a per-commit job's 2 minutes, so no per-commit
  # workflow calls it and it runs here. It saves the primed cache again when the pins changed.
  tailscale-windows:
    uses: ./.github/workflows/tailscale-windows.yml
    permissions:
      contents: read
    with:
      prime: true
      save: true

  # The shim on macOS with its x86_64 slice under Rosetta, and on Linux (tailscale.yml), with no time limit: the x86_64
  # build and run do not fit beside the arm64 one in a per-commit job, so ci.yml runs macOS arm64 and Linux and this
  # runs both slices. It saves the primed caches again when the pins changed.
  tailscale-rosetta:
    uses: ./.github/workflows/tailscale.yml
    permissions:
      contents: read
    with:
      prime: true
      save: true
      # Its unit tests run per pull request (ci.yml); here its functional tests.
      tests: '^functional$'

  # From ci.yml, so that a pull request asks for few hosted macOS runners (about five run at once for the
  # organisation): the macOS sanitizers, the Claude driver and its token wall on the fleet Mac, with no time limit. Their
  # Linux forms run here too, on hosted Ubuntu. The sanitizers restore no hosted cache (one built by another Xcode does not
  # configure here): ccache in ~/nexus-ci on the machine keeps their rebuilds short.
  # The model and its check programs built Debug with AddressSanitizer and UndefinedBehaviorSanitizer, which stop at
  # the first report: the unit tests, and the trace walks (the window's on every AI count, the overlay's) with every
  # fault (no TLC); the same for the link's states (src/sync) and their walks, and the store (store_test, durable_test
  # and journal_walk). Configured without the link's transport (NEXUS_LINK=OFF: mosh and protobuf), which these programs
  # do not use.
  sanitizers-macos:
    runs-on: [self-hosted, nexus-nightly, macOS, ARM64, xcode]
    name: sanitizers-macos (${{ matrix.part }}${{ matrix.half && format(' {0} of 4', matrix.half) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: units
            targets: >-
              model_test overlay_test nexus_terminal_watch_tests sync_test redial_test secrets_test signin_test
              store_test durable_test driver_protocol_test supervisor_test server_pass_test wire_test
              nexus_versions_test builds_test handover_test supervision_test migration_test takeover_test
          # The walks in four quarters (every fourth walk each): together they take over two minutes on the image's 3 cores.
          - part: walks
            half: 1
            targets: >-
              overlay_walk watch_walk trace_walk strip_walk link_walk reconnect_walk secrets_walk signin_walk
              journal_walk store_lock_walk supervisor_walk pass_walk builds_walk handover_walk supervision_walk
              migration_walk takeover_walk
          - part: walks
            half: 2
            targets: >-
              overlay_walk watch_walk trace_walk strip_walk link_walk reconnect_walk secrets_walk signin_walk
              journal_walk store_lock_walk supervisor_walk pass_walk builds_walk handover_walk supervision_walk
              migration_walk takeover_walk
          - part: walks
            half: 3
            targets: >-
              overlay_walk watch_walk trace_walk strip_walk link_walk reconnect_walk secrets_walk signin_walk
              journal_walk store_lock_walk supervisor_walk pass_walk builds_walk handover_walk supervision_walk
              migration_walk takeover_walk
          - part: walks
            half: 4
            targets: >-
              overlay_walk watch_walk trace_walk strip_walk link_walk reconnect_walk secrets_walk signin_walk
              journal_walk store_lock_walk supervisor_walk pass_walk builds_walk handover_walk supervision_walk
              migration_walk takeover_walk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Tools and caches
        uses: ./.github/actions/hosted-caches
        with:
          name: fleet-mac-asan-${{ matrix.part }}
          require: "false"
          brew: ninja
      - name: Configure and build the programs for this part
        uses: ./.github/actions/nexus-build
        with:
          config: mac-asan
          targets: ${{ matrix.targets }}
      # Each program runs in memory (MemFs where it has files; no sockets, processes or shared paths), so they run at
      # once, at most TEST_JOBS at a time, each with its own output under units/; a failure shows its program and output.
      - name: Unit tests under the sanitizers
        if: matrix.part == 'units'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p units
          printf '%s\n' \
            build/tests/model/model_test \
            build/tests/model/overlay_test \
            build/tests/window/nexus_terminal_watch_tests \
            build/tests/sync/sync_test \
            build/tests/sync/redial_test \
            build/tests/server/secrets_test \
            build/tests/server/signin_test \
            build/tests/store/store_test \
            build/tests/store/durable_test \
            build/tests/driver/driver_protocol_test \
            build/tests/server/supervisor_test \
            build/tests/server/server_pass_test \
            build/tests/server/builds_test \
            build/tests/server/handover_test \
            build/tests/server/supervision_test \
            build/tests/server/migration_test \
            build/tests/server/takeover_test \
            build/tests/wire/wire_test \
            build/tests/wire/nexus_versions_test \
            | xargs -P "$TEST_JOBS" -I{} sh -c 'out="units/$(basename "$1").out"; "$1" >"$out" 2>&1 || { echo "::error::unit failed: $1"; cat "$out"; exit 1; }' _ {}
          echo "19 unit programs passed"
      - name: Trace walks under the sanitizers
        if: matrix.part == 'walks'
        shell: bash
        env:
          HALF: ${{ matrix.half }}
        run: |
          set -euo pipefail
          # Bash 3.2-compatible parallel walk runner (macOS /bin/bash has no `wait -n`, and `set -u` rejects empty
          # `${arr[@]}`): runs up to TEST_JOBS walks concurrently in isolated directories under $RUNNER_TEMP/nexus-walks
          # (outside $GITHUB_WORKSPACE, so a SIGKILLed 0555 build directory never breaks the next checkout), checking
          # every exit status.
          walks_root="$RUNNER_TEMP/nexus-walks"
          if [ -e "$walks_root" ]; then chmod -R u+w "$walks_root"; fi
          rm -rf "$walks_root"
          launched=0
          in_batch=0
          batch_pids=()
          flush_walks() {
            if [ "$in_batch" -gt 0 ]; then
              for pid in "${batch_pids[@]}"; do
                wait "$pid"
              done
            fi
            batch_pids=()
            in_batch=0
          }
          # This job runs every fourth walk: HALF 1 the first, fifth, ...; HALF 2 the second, sixth, ...; and so on
          listed=0
          walk() {
            listed=$((listed + 1))
            if [ $((listed % 4)) -ne $((HALF % 4)) ]; then return 0; fi
            local dir="$walks_root/$launched"
            mkdir -p "$dir"
            ( "$@" "$dir/trace.tla" >"$dir/output" 2>&1 || { echo "::error::walk failed: $*"; cat "$dir/output"; exit 1; } ) &
            batch_pids+=($!)
            in_batch=$((in_batch + 1))
            launched=$((launched + 1))
            if [ "$in_batch" -ge "$TEST_JOBS" ]; then
              flush_walks
            fi
          }
          for seed in 1 2 3; do
            walk build/tests/model/overlay_walk "$seed" 1000
            walk build/tests/model/watch_walk "$seed" 1000
          done
          for fault in --faulty-hide-unkeyed --faulty-hotkey-hides; do
            walk build/tests/model/overlay_walk 1 1000 "$fault"
          done
          for fault in --faulty-aba --faulty-stale; do
            walk build/tests/model/watch_walk 1 1000 "$fault"
          done
          for friends in 0 1 2 3; do
            for seed in 1 2 3 4 5 6 7 8; do
              walk build/tests/model/trace_walk "$seed" 1000 "$friends"
            done
            walk build/tests/model/trace_walk 1 1000 "$friends" --no-sprint
          done
          for fault in --faulty --faulty-queue --faulty-move --faulty-queue-cap --faulty-send-trim --faulty-send-dedup --faulty-close --faulty-sprint-move --faulty-sprint-close --faulty-close-fallback; do
            walk build/tests/model/trace_walk 1 1000 3 "$fault"
          done
          walk build/tests/model/trace_walk 10 1000 3 --friends-churn
          walk build/tests/model/trace_walk 11 1000 0 --no-sprint --friends-churn
          walk build/tests/model/trace_walk 1 300 3 --friends-churn --faulty-remove-friend
          for seed in 1 2 3; do
            walk build/tests/model/strip_walk "$seed" 400 2
          done
          walk build/tests/model/strip_walk 4 400 3
          for fault in --faulty-forget --faulty-wait; do
            walk build/tests/model/strip_walk 1 400 2 "$fault"
          done
          for windows in 1 2 3 4; do
            for seed in 1 2 3 4; do
              walk build/tests/sync/link_walk "$seed" 1000 "$windows"
            done
          done
          for fault in --faulty-applier --faulty-mirror --faulty-tail; do
            walk build/tests/sync/link_walk 1 1000 2 "$fault"
          done
          for seed in 1 2 3 4; do
            walk build/tests/sync/reconnect_walk "$seed" 1000
          done
          for fault in --faulty-cached --faulty-no-reset; do
            walk build/tests/sync/reconnect_walk 1 1000 "$fault"
          done
          for seed in 1 2 3 4 5 6 7 8; do
            walk build/tests/sync/secrets_walk "$seed" 2000
            walk build/tests/sync/secrets_walk "$seed" 2000 --format 4
            walk build/tests/sync/secrets_walk "$seed" 2000 --format 5
          done
          walk build/tests/sync/secrets_walk 9 2000 --faulty-store-late
          for fault in --faulty-echo --faulty-driver --faulty-driver-echo; do
            walk build/tests/sync/secrets_walk 1 2000 "$fault"
          done
          for seed in 1 2 3 4 5 6 7 8; do
            walk build/tests/sync/signin_walk "$seed" 6000
          done
          for seed in 1 2 3 4 5 6 7 8; do
            walk build/tests/store/journal_walk "$seed" 1000
          done
          for fault in accept-torn cut-too-far no-truncate no-sync; do
            walk build/tests/store/journal_walk 1 1000 --fault "$fault"
          done
          for seed in 1 2 3 4 5 6 7 8; do
            walk build/tests/server/supervisor_walk "$seed" 1000
          done
          for fault in --faulty-turn --faulty-resume; do
            walk build/tests/server/supervisor_walk 1 1000 "$fault"
          done
          for seed in 13 14 15; do
            walk build/tests/server/supervisor_walk "$seed" 600 --friends-churn
          done
          walk build/tests/server/supervisor_walk 13 600 --friends-churn --faulty-remove
          walk build/tests/server/supervisor_walk 13 600 --friends-churn --faulty-unknown
          for seed in 1 2 3 4 5 6 7 8; do
            walk build/tests/server/pass_walk "$seed" 250
          done
          for fault in release-before-flush state-before-flush tick-before-flush no-hold release-on-fail; do
            walk build/tests/server/pass_walk 1 80 --fault "$fault"
          done
          for seed in 1 2 3 4 5; do
            walk build/tests/store/store_lock_walk "$seed" 2000
          done
          for fault in --faulty-unlocked --faulty-restore-first --faulty-held-refused --faulty-reader-busy --faulty-no-gate; do
            walk build/tests/store/store_lock_walk 1 2000 "$fault"
          done
          # Real-file takeover walks bounded for APFS F_FULLFSYNC (sanitizers-linux and the model shards run the full
          # 800, 600, 350, 300 and 120 step counts).
          for seed in 1 2 3; do
            walk build/tests/server/builds_walk "$seed" 300
          done
          for fault_seed in no-lock:1 no-sync:1 tested-program-only:1 reuse-tmp:1 prune-in-use:6 two-renames:1; do
            walk build/tests/server/builds_walk "${fault_seed#*:}" 300 --fault "${fault_seed%%:*}"
          done
          for seed in 1 2 3; do
            walk build/tests/server/handover_walk "$seed" 200
          done
          for fault_seed in no-lock:1 no-sync:1 in-memory-only:1 overwrite-prev:2 no-rollback:1 stop-cuts:1 allow-untested:1 serve-broken:1; do
            walk build/tests/server/handover_walk "${fault_seed#*:}" 200 --fault "${fault_seed%%:*}"
          done
          for seed in 1 2 3; do
            walk build/tests/server/supervision_walk "$seed" 120
          done
          for fault_seed in no-sup-lock:1 no-handover-lock:1 drain-stops:1 stop-restarts:1 no-post-start-rollback:1 ping-pong-rollback:2 no-halt-bound:2 in-memory-state:1 serve-untested:1; do
            walk build/tests/server/supervision_walk "${fault_seed#*:}" 120 --fault "${fault_seed%%:*}"
          done
          for seed in 1 2 3 4; do
            walk build/tests/server/migration_walk "$seed" 100
          done
          for fault_seed in no-lock:1 ignore-live-old:1 clobber-new:1 no-sync:3 no-plan:3 leave-old:3 blind-back:1 multihop:1 refuse-unknown-change:1; do
            walk build/tests/server/migration_walk "${fault_seed#*:}" 100 --fault "${fault_seed%%:*}"
          done
          for seed in 1 2 3 4; do
            walk build/tests/server/takeover_walk "$seed" 40
          done
          for fault in ignore-live-old skip-migration serve-untested no-handover-lock blind-rollback drain-cuts-turn stop-restarts drain-stops version-only-rollback spin-on-format-refusal blame-build-for-live-old; do
            walk build/tests/server/takeover_walk 1 40 --fault "$fault"
          done
          flush_walks
          if [ -e "$walks_root" ]; then chmod -R u+w "$walks_root"; fi
          rm -rf "$walks_root"
          echo "$launched of $listed walks passed (quarter $HALF; the other three jobs run the rest)"

  claude-driver-macos:
    runs-on: [self-hosted, nexus-nightly, macOS, ARM64, xcode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Node from the runner's machine
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "::error::no node or npm on $(hostname -s)'s runner PATH; the fleet installs Node (sdk/bin) on its runners"
            exit 1
          fi
          echo "node $(node --version), npm $(npm --version) on $(hostname -s)"
          if [ "$RUNNER_OS" = macOS ]; then caches="$HOME/Library/Caches"; else caches="$HOME/.cache"; fi
          downloads="$caches/nexus-ci/$RUNNER_NAME/prax-downloads"
          mkdir -p "$downloads"
          echo "PR_DOWNLOAD_DIR=$downloads" >> "$GITHUB_ENV"
          echo "JOBS=$(sh .github/job-cores.sh)" >> "$GITHUB_ENV"
          echo "TEST_JOBS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      - name: Install the pinned packages
        working-directory: drivers/claude
        run: npm ci --omit=optional --no-audit --no-fund
      - name: Compile, lint and unit tests
        working-directory: drivers/claude
        run: npm run check
      # Clang, as the other builds use: Prax does not build with the image's GCC.
      - name: Configure (the protocol and the conformance test only)
        env:
          CC: clang
          CXX: clang++
        shell: bash
        run: |
          set -euo pipefail
          # On Linux the Release build is ThinLTO, which only LLD links: the image's LLVM 18 linker, as hosted-caches links it.
          linker=()
          if [ "$RUNNER_OS" = Linux ]; then
            if [ ! -e /usr/bin/ld.lld ] && [ -x /usr/bin/ld.lld-18 ]; then sudo ln -s ld.lld-18 /usr/bin/ld.lld; fi
            linker=(-DCMAKE_LINKER_TYPE=LLD)
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF -DNEXUS_WINDOW_LOGIC=OFF ${linker[@]+"${linker[@]}"}
      - name: Build the conformance test
        run: cmake --build build --parallel "$JOBS" --target driver_conformance_test
      - name: Conformance of the Claude driver
        run: bash .github/ctest.sh --test-dir build -L claude_driver -j "$TEST_JOBS" --output-on-failure

  # The Claude driver's token wall (drivers/claude/src/wall.ts, docs/secrets.md "The token wall"), end to end: the real
  # Claude executable the pinned SDK ships (so npm ci with the optional per-platform package here), on a fake token,
  # against a fake Messages API on 127.0.0.1, in the OS sandbox, trying every way an AI could read its login. Spends
  # nothing and reaches no outside service. The test's runs in three jobs (NEXUS_WALL_RUN): the whole
  # wall, the wall without its hook, and together a friend limited to its directory with the hook and without it (two
  # short runs in one job: the setup is the cost).
  claude-driver-wall-macos:
    strategy:
      fail-fast: false
      matrix:
        run: [whole-wall, without-the-hook, "limited,limited-nohook"]
    runs-on: [self-hosted, nexus-nightly, macOS, ARM64, xcode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Node from the runner's machine
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "::error::no node or npm on $(hostname -s)'s runner PATH; the fleet installs Node (sdk/bin) on its runners"
            exit 1
          fi
          echo "node $(node --version), npm $(npm --version) on $(hostname -s)"
      - name: Install the pinned packages, with the Claude executable
        working-directory: drivers/claude
        run: npm ci --no-audit --no-fund
      - name: Compile
        working-directory: drivers/claude
        run: npm run build
      - name: The token wall
        working-directory: drivers/claude
        env:
          NEXUS_WALL_REPORT: '1'
          NEXUS_WALL_RUN: ${{ matrix.run }}
        # Where this runner's own login reaches hulk, ssh there must work from the sandbox too, and from there no
        # login back to this machine. A runner with no login to hulk fails the job by name (the rest of the wall still
        # runs first): no probe is ever skipped.
        run: |
          if ssh -o BatchMode=yes -o ConnectTimeout=5 hulk true 2>/dev/null; then
            export NEXUS_WALL_SSH_HOST=hulk NEXUS_WALL_SSH_BACK="$(hostname -s)"
            ssh_out=ran
          else
            echo "::error title=ssh-out probe::no login to hulk from $(hostname -s) as $(id -un): the token wall's ssh-out probe cannot run, and no probe is skipped; the fleet gives this runner's login a key for hulk"
            ssh_out=missing
          fi
          npm run test:functional
          [ "$ssh_out" = ran ]

  # The macOS Release build, with Prax's ThinLTO, and its unit and functional tests, on the fleet Mac with no time
  # limit: ci.yml builds Debug per pull request (no LTO, whose link alone took about 36 s on a hosted runner). The frame
  # budget and the server lock under contention have their own jobs above. Hosted caches are made by Xcode 26 and do not
  # fit this Mac's Xcode, so it starts from what is on this machine.
  macos-release:
    runs-on: [self-hosted, nexus-nightly, macOS, ARM64, xcode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Tools and caches
        uses: ./.github/actions/hosted-caches
        with:
          name: fleet-mac-release
          require: "false"
          brew: ninja protobuf
      - name: Configure and build
        uses: ./.github/actions/nexus-build
        with:
          config: mac-release
      - name: Unit tests
        run: bash .github/ctest.sh --test-dir build -L unit -j "$TEST_JOBS" --output-on-failure
      # The link's functional tests reach this machine over `ssh localhost` as the runner's login, which this Mac allows.
      # The watch's speech test runs in watch-speech, on hosted macOS, never here.
      - name: Functional tests
        run: >-
          bash .github/ctest.sh --test-dir build -L functional
          -E '^(window_frame_budget|window_frame_budget_injected_paced|server_lock_functional|watch_speech|watch_speech_planted)$'
          -j "$TEST_JOBS" --output-on-failure
      # The paced injected hitch measures Release's frame budgets (tests/window/CMakeLists.txt, unchanged), so it runs
      # here in the Release build rather than in ci.yml's Debug build; alone, so no other test shares the clock. A run
      # that finds no such test fails (.github/ctest.sh).
      - name: The paced injected hitch (Release's frame budgets)
        run: >-
          bash .github/ctest.sh --test-dir build -R '^window_frame_budget_injected_paced$' --output-on-failure

  # The tier_nightly tests (tests/tiers.txt, docs/ci-tiers.md): every test a pull request does not run, on each
  # configuration a pull request builds, with no time limit. The model checks (model, model_nightly) run in the model
  # jobs above and the Claude driver's conformance (claude_driver) in claude-driver-macos and claude-driver-linux; the
  # frame budgets and the server lock under contention, which time the real clock, in their own jobs (frame-budget,
  # macos-release, server-lock).
  #
  # macOS Debug, as a pull request builds it (asserts on), on the fleet Mac. The link's tests reach this machine over
  # `ssh localhost` as the runner's login, which this Mac allows. The watch's speech test runs in watch-speech,
  # on hosted macOS, never here.
  macos-debug:
    runs-on: [self-hosted, nexus-nightly, macOS, ARM64, xcode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Tools and caches
        uses: ./.github/actions/hosted-caches
        with:
          name: fleet-mac-debug
          require: "false"
          brew: ninja protobuf
      - name: Configure and build
        uses: ./.github/actions/nexus-build
        with:
          config: mac-debug
      - name: The tier_nightly tests
        run: >-
          bash .github/ctest.sh --test-dir build -L '^tier_nightly$' -LE '^(model|model_nightly|claude_driver)$'
          -E '^(window_frame_budget|window_frame_budget_injected_paced|server_lock_functional|watch_speech|watch_speech_planted)$'
          -j "$TEST_JOBS" --output-on-failure

  # Linux, as ci.yml's build-linux builds it, on hosted Ubuntu.
  linux-nightly:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Tools and caches
        uses: ./.github/actions/hosted-caches
        with:
          name: linux-release
          apt: libprotobuf-dev protobuf-compiler zlib1g-dev libssl-dev openssh-server
      - name: Configure and build
        uses: ./.github/actions/nexus-build
        with:
          config: linux-release
      # The link's functional tests reach this machine over `ssh localhost` without a password prompt
      # (tests/link/CMakeLists.txt): a key made here, for this job only, authorized for the runner's own login.
      - name: Passwordless ssh to this machine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ ! -f ~/.ssh/id_ed25519 ]; then ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519; fi
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod go-w ~
          if ! nc -z -w 2 127.0.0.1 22; then
            sudo systemctl start ssh
          fi
          ssh-keyscan -T 5 localhost 127.0.0.1 >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost true
          echo "ssh localhost works for $(id -un)"
      # The server lock under contention runs in server-lock (macOS) and inside WSL2 (wsl2-functional), as macos-debug
      # leaves it out too.
      - name: The tier_nightly tests
        run: >-
          bash .github/ctest.sh --test-dir build -L '^tier_nightly$' -LE '^(model|model_nightly|claude_driver)$'
          -E '^server_lock_functional$' -j "$TEST_JOBS" --output-on-failure

  # Windows, as ci.yml's windows job builds it, on hosted Windows: the unit tests too slow for a pull request. The WSL2
  # terminal test needs a WSL2 distribution, which hosted Windows lacks: wsl2-terminal runs it on captain.
  windows-nightly:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Caches, configure and build
        uses: ./.github/actions/windows-build
      - name: The tier_nightly tests
        run: |
          & ./.github/ctest.ps1 --test-dir "$env:NEXUS_BUILD" -C Release -L '^tier_nightly$' -LE '^(model|model_nightly|claude_driver|wsl2_terminal)$' -j $env:TEST_JOBS --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "ctest exited $LASTEXITCODE" }

  # The protocol's conformance cases against the Claude driver as a process (ctest -L claude_driver) on hosted Ubuntu,
  # as claude-driver-macos runs them on the fleet Mac; ci.yml's claude-driver runs the driver's own unit tests per pull
  # request.
  claude-driver-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Node from the runner's machine
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "::error::no node or npm on $(hostname -s)'s runner PATH"
            exit 1
          fi
          echo "node $(node --version), npm $(npm --version) on $(hostname -s)"
          downloads="$HOME/.cache/nexus-ci/$RUNNER_NAME/prax-downloads"
          mkdir -p "$downloads"
          echo "PR_DOWNLOAD_DIR=$downloads" >> "$GITHUB_ENV"
          echo "JOBS=$(sh .github/job-cores.sh)" >> "$GITHUB_ENV"
          echo "TEST_JOBS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      - name: Install the pinned packages
        working-directory: drivers/claude
        run: npm ci --omit=optional --no-audit --no-fund
      - name: Build the driver
        working-directory: drivers/claude
        run: npm run check
      # Clang, as the other builds use: Prax does not build with the image's GCC. The Release build is ThinLTO, which
      # only LLD links: the image's LLVM 18 linker.
      - name: Configure (the protocol and the conformance test only)
        env:
          CC: clang
          CXX: clang++
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /usr/bin/ld.lld ] && [ -x /usr/bin/ld.lld-18 ]; then sudo ln -s ld.lld-18 /usr/bin/ld.lld; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF -DNEXUS_WINDOW_LOGIC=OFF -DCMAKE_LINKER_TYPE=LLD
      - name: Build the conformance test
        run: cmake --build build --parallel "$JOBS" --target driver_conformance_test
      - name: Conformance of the Claude driver
        run: bash .github/ctest.sh --test-dir build -L claude_driver -j "$TEST_JOBS" --output-on-failure

  # The same wall on Linux, where Claude's sandbox is bubblewrap and socat, both built by nexus from pinned sources
  # (cmake/sandbox.cmake) and found by the driver (drivers/claude/src/tools.ts), with nothing installed for them: on an
  # Ubuntu bench (the tlc runners are the amd benches, never WSL2), whose AppArmor lets a program make user namespaces
  # only with a profile, which the driver loads for nexus's bwrap through passwordless sudo (the test unloads it first
  # where sudo -n can, NEXUS_WALL_FRESH_PROFILE, so that the real step runs each time). On GitHub-hosted Ubuntu, from
  # ci.yml (the happy path per pull request leaves it here); the same wall inside captain's WSL2 is claude-driver-wall-wsl2.
  claude-driver-wall-linux:
    strategy:
      fail-fast: false
      matrix:
        where: [ubuntu]
        # The unlimited runs each in a job of its own: on WSL2 under load one run took 52 s, two past the cap. The two
        # limited runs share one: each took seconds on macOS (2026-11-15); WSL2 under load is the one to watch.
        run: [whole-wall, without-the-hook, "limited,limited-nohook"]
        include:
          - where: ubuntu
            labels: ubuntu-24.04
    runs-on: ${{ matrix.labels }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Where this runs, and caches outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          kernel=$(cat /proc/sys/kernel/osrelease)
          case "$kernel" in *microsoft*|*WSL2*) wsl=wsl2 ;; *) wsl=ubuntu ;; esac
          if [ "$wsl" != "${{ matrix.where }}" ]; then
            echo "::error::$(hostname -s) (kernel $kernel) is not a ${{ matrix.where }} machine"
            exit 1
          fi
          restrict=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo none)
          echo "$(hostname -s): kernel $kernel; apparmor_restrict_unprivileged_userns: $restrict; passwordless sudo: $(sudo -n true 2>/dev/null && echo yes || echo no)"
          if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
            echo "::error::no node or npm on $(hostname -s)'s runner PATH; the fleet installs Node (sdk/bin) on its runners"
            exit 1
          fi
          # The runs' directories under a temporary directory of this runner's own: two Claude sandboxes at once whose
          # working directories share an ancestor a few levels up fail each other's commands now and then (bwrap:
          # Can't find source path .../runner-tmp/.mcp.json; two jobs on amd-2, 2026-11-15). Always under /tmp (never an
          # inherited TMPDIR such as ~/.cache/runner-tmp, which pushes Unix domain socket paths past sun_path's 108-byte
          # limit on long runner names).
          runner_dir=${RUNNER_NAME// /_}
          own="/tmp/$runner_dir"
          mkdir -p "$own"
          echo "TMPDIR=$own" >> "$GITHUB_ENV"
          caches="$HOME/.cache/nexus-ci"
          mkdir -p "$caches/$runner_dir/prax-downloads"
          {
            echo "SANDBOX_BUILD=$caches/$runner_dir/sandbox-build"
            echo "PR_DOWNLOAD_DIR=$caches/$runner_dir/prax-downloads"
            echo "NEXUS_SANDBOX_BIN=$caches/$runner_dir/sandbox-build/sandbox"
          } >> "$GITHUB_ENV"
      - name: Build bubblewrap and socat
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$SANDBOX_BUILD" -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF -DNEXUS_WINDOW=OFF \
            -DNEXUS_WINDOW_LOGIC=OFF -DNEXUS_SANDBOX_TOOLS=ON > /dev/null
          cmake --build "$SANDBOX_BUILD" --target nexus_sandbox_tools --parallel "$(sh .github/job-cores.sh)"
          "$NEXUS_SANDBOX_BIN/bwrap/bwrap" --version
          "$NEXUS_SANDBOX_BIN/socat/socat" -V | head -2
      - name: Install the pinned packages, with the Claude executable
        working-directory: drivers/claude
        # Installed once per lockfile on each runner and kept beside its other caches: WSL2's install took 24 to 47 s
        # when it asked the registry each time, and 26 to 38 s from npm's cache on a loaded captain (Ubuntu: 4 s).
        shell: bash
        run: |
          set -euo pipefail
          base="$HOME/.cache/nexus-ci/$RUNNER_NAME/claude-driver-packages"
          kept="$base/$(sha256sum package-lock.json | cut -c1-16)"
          if [ ! -d "$kept/node_modules" ]; then
            npm ci --prefer-offline --no-audit --no-fund
            rm -rf "$base"
            mkdir -p "$kept"
            mv node_modules "$kept/node_modules"
          fi
          rm -rf node_modules
          ln -s "$kept/node_modules" node_modules
      - name: Compile
        working-directory: drivers/claude
        run: npm run build
      - name: The token wall
        working-directory: drivers/claude
        env:
          NEXUS_WALL_REPORT: '1'
          NEXUS_WALL_FRESH_PROFILE: '1'
          NEXUS_WALL_RUN: ${{ matrix.run }}
        # Where this runner's own login reaches hulk, ssh there must work from the sandbox too, and from there no
        # login back to this machine; a runner with no fleet login skips that probe.
        run: |
          if ssh -o BatchMode=yes -o ConnectTimeout=5 hulk true 2>/dev/null; then
            export NEXUS_WALL_SSH_HOST=hulk NEXUS_WALL_SSH_BACK="$(hostname -s)"
          else
            echo "no login to hulk from $(hostname -s) as $(id -un): the ssh-out probe is skipped"
          fi
          # Separate runner workspaces still share /tmp/.mcp.json during SDK setup.
          # Serialize just this test on each Linux host, including across workflow runs.
          flock "$HOME/.cache/nexus-ci/claude-wall.lock" npm run test:functional



  # The macOS sanitizers job's programs and walks on Linux, with clang's AddressSanitizer and UndefinedBehaviorSanitizer.
  # One build, shared: build-linux-asan builds every program the parts run and uploads the build tree; three parts run
  # in parallel: the unit programs, and the trace walks with their faults in two halves. From ci.yml (the happy path per
  # pull request leaves it here).
  build-linux-asan:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Tools and caches
        uses: ./.github/actions/hosted-caches
        with:
          name: linux-asan
          apt: ""
      - name: Configure and build the programs the parts run
        uses: ./.github/actions/nexus-build
        with:
          config: linux-asan
          targets: >-
            model_test overlay_test nexus_terminal_watch_tests sync_test redial_test secrets_test signin_test
            store_test durable_test driver_protocol_test supervisor_test server_pass_test wire_test
            nexus_versions_test builds_test handover_test supervision_test migration_test takeover_test
            overlay_walk watch_walk trace_walk strip_walk link_walk reconnect_walk secrets_walk signin_walk
            journal_walk store_lock_walk supervisor_walk pass_walk builds_walk handover_walk supervision_walk
            migration_walk takeover_walk
      - name: Share the build tree
        uses: ./.github/actions/build-share
        with:
          name: build-linux-asan

  sanitizers-linux:
    needs: build-linux-asan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: units
          # The walks in two halves (every other walk each): together they took past 2 minutes on the image's 4 cores.
          - part: walks
            half: 1
          - part: walks
            half: 2
    name: sanitizers-linux (${{ matrix.part }}${{ matrix.half && format(' {0} of 2', matrix.half) || '' }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The build tree
        uses: ./.github/actions/build-fetch
        with:
          name: build-linux-asan
      # Every unit program here runs in memory (MemFs where it has files; no sockets, processes or shared paths), so
      # they are independent: they run at once, at most TEST_JOBS at a time, each with its own output under units/.
      - name: Unit tests under the sanitizers
        if: matrix.part == 'units'
        shell: bash
        run: |
          set -euo pipefail
          launched=0
          running=0
          unit() {
            local dir="units/$launched"
            mkdir -p "$dir"
            ( "$@" >"$dir/output" 2>&1 || { echo "::error::unit failed: $*"; cat "$dir/output"; exit 1; } ) &
            launched=$((launched + 1))
            running=$((running + 1))
            if [ "$running" -ge "$TEST_JOBS" ]; then
              wait -n
              running=$((running - 1))
            fi
          }
          unit build/tests/model/model_test
          unit build/tests/model/overlay_test
          unit build/tests/window/nexus_terminal_watch_tests
          unit build/tests/sync/sync_test
          unit build/tests/sync/redial_test
          # the secret dialog: every unit group, the leak test among them
          unit build/tests/server/secrets_test
          # in-app sign-in: every unit group, the leak test among them
          unit build/tests/server/signin_test
          # the store: every unit group (MemFs, crashes at every write and sync, the lock, the start-up order), and
          # the server's tabs on it
          unit build/tests/store/store_test
          unit build/tests/store/durable_test
          # the driver protocol: every group (the parser and the reader over every chunking)
          unit build/tests/driver/driver_protocol_test
          # the driver supervisor: every group
          unit build/tests/server/supervisor_test
          unit build/tests/server/server_pass_test
          # placement: every group (the manifest, the hash, the evidence, the formats rule, the names, prune's choice)
          unit build/tests/server/builds_test
          # handover: every group (drain, state, handover, rollback, MemFs crash sweep, refusals)
          unit build/tests/server/handover_test
          # supervision: every group (state, units, lifecycle, post-start rollback, dual-fail shunning, MemFs crashes)
          unit build/tests/server/supervision_test
          # layer 5 migration and store format against rollback
          unit build/tests/server/migration_test
          # layer 6 end-to-end takeover composition seams
          unit build/tests/server/takeover_test
          # the formats as schema's tables: every table read back, and two versions reading each other both ways, in
          # schema's own tables and in nexus's state and actions
          unit build/tests/wire/wire_test
          unit build/tests/wire/nexus_versions_test
          while [ "$running" -gt 0 ]; do
            wait -n
            running=$((running - 1))
          done
          echo "$launched unit programs passed"
      # Each walk drives its code in memory (MemFs where it has files; the store lock's walk on real files in a store
      # directory beside its own trace) and writes only the trace it is given, so they are independent: they run at
      # once, at most TEST_JOBS at a time, each in a directory of its own under $RUNNER_TEMP/nexus-walks (outside
      # $GITHUB_WORKSPACE, so a SIGKILLed 0555 build directory never breaks the next checkout) holding its trace and its
      # output. Any failure fails the step, with that walk's command and output.
      - name: Trace walks and their faults under the sanitizers
        if: matrix.part == 'walks'
        shell: bash
        env:
          HALF: ${{ matrix.half }}
        run: |
          set -euo pipefail
          walks_root="$RUNNER_TEMP/nexus-walks"
          if [ -e "$walks_root" ]; then chmod -R u+w "$walks_root"; fi
          rm -rf "$walks_root"
          launched=0
          running=0
          # This job runs every other walk: HALF 1 the first, third, ...; HALF 2 the second, fourth, ...
          listed=0
          walk() {
            listed=$((listed + 1))
            if [ $((listed % 2)) -ne $((HALF % 2)) ]; then return 0; fi
            local dir="$walks_root/$launched"
            mkdir -p "$dir"
            ( "$@" "$dir/trace.tla" >"$dir/output" 2>&1 || { echo "::error::walk failed: $*"; cat "$dir/output"; exit 1; } ) &
            launched=$((launched + 1))
            running=$((running + 1))
            if [ "$running" -ge "$TEST_JOBS" ]; then
              wait -n
              running=$((running - 1))
            fi
          }
          for seed in 1 2 3; do
            walk build/tests/model/overlay_walk "$seed" 1000
            walk build/tests/model/watch_walk "$seed" 1000
          done
          for fault in --faulty-hide-unkeyed --faulty-hotkey-hides; do
            walk build/tests/model/overlay_walk 1 1000 "$fault"
          done
          for fault in --faulty-aba --faulty-stale; do
            walk build/tests/model/watch_walk 1 1000 "$fault"
          done
          for friends in 0 1 2 3; do
            for seed in 1 2 3 4 5 6 7 8; do
              walk build/tests/model/trace_walk "$seed" 1000 "$friends"
            done
            walk build/tests/model/trace_walk 1 1000 "$friends" --no-sprint
          done
          for fault in --faulty --faulty-queue --faulty-move --faulty-queue-cap --faulty-send-trim --faulty-send-dedup --faulty-close --faulty-sprint-move --faulty-sprint-close --faulty-close-fallback; do
            walk build/tests/model/trace_walk 1 1000 3 "$fault"
          done
          # the friends coming and going, and the friend strip's walks and faults
          walk build/tests/model/trace_walk 10 1000 3 --friends-churn
          walk build/tests/model/trace_walk 11 1000 0 --no-sprint --friends-churn
          walk build/tests/model/trace_walk 1 300 3 --friends-churn --faulty-remove-friend
          for seed in 1 2 3; do
            walk build/tests/model/strip_walk "$seed" 400 2
          done
          walk build/tests/model/strip_walk 4 400 3
          for fault in --faulty-forget --faulty-wait; do
            walk build/tests/model/strip_walk 1 400 2 "$fault"
          done
          for windows in 1 2 3 4; do
            for seed in 1 2 3 4; do
              walk build/tests/sync/link_walk "$seed" 1000 "$windows"
            done
          done
          for fault in --faulty-applier --faulty-mirror --faulty-tail; do
            walk build/tests/sync/link_walk 1 1000 2 "$fault"
          done
          # the link making its session again: its walks and faults
          for seed in 1 2 3 4; do
            walk build/tests/sync/reconnect_walk "$seed" 1000
          done
          for fault in --faulty-cached --faulty-no-reset; do
            walk build/tests/sync/reconnect_walk 1 1000 "$fault"
          done
          # the secret dialog's walks, each failing if a value's bytes reach anything but the keeper
          for seed in 1 2 3 4 5 6 7 8; do
            walk build/tests/sync/secrets_walk "$seed" 2000
            walk build/tests/sync/secrets_walk "$seed" 2000 --format 4
            walk build/tests/sync/secrets_walk "$seed" 2000 --format 5
          done
          walk build/tests/sync/secrets_walk 9 2000 --faulty-store-late
          for fault in --faulty-echo --faulty-driver --faulty-driver-echo; do
            walk build/tests/sync/secrets_walk 1 2000 "$fault"
          done
          # in-app sign-in's walks, each failing if a log line holds a URL, a state, a code or a login
          for seed in 1 2 3 4 5 6 7 8; do
            walk build/tests/sync/signin_walk "$seed" 6000
          done
          # the journal's walks
          for seed in 1 2 3 4 5 6 7 8; do
            walk build/tests/store/journal_walk "$seed" 1000
          done
          for fault in accept-torn cut-too-far no-truncate no-sync; do
            walk build/tests/store/journal_walk 1 1000 --fault "$fault"
          done
          # the store's lock and the start-up order: their walks and the faulty orders
          for seed in 1 2 3 4 5; do
            walk build/tests/store/store_lock_walk "$seed" 2000
          done
          for fault in --faulty-unlocked --faulty-restore-first --faulty-held-refused --faulty-reader-busy --faulty-no-gate; do
            walk build/tests/store/store_lock_walk 1 2000 "$fault"
          done
          # the driver supervisor's walks and their faults
          for seed in 1 2 3 4 5 6 7 8; do
            walk build/tests/server/supervisor_walk "$seed" 1000
          done
          for fault in --faulty-turn --faulty-resume; do
            walk build/tests/server/supervisor_walk 1 1000 "$fault"
          done
          # the friend taken out of friends.json and put back, and a start holding no friends list, and their faults
          for seed in 13 14 15; do
            walk build/tests/server/supervisor_walk "$seed" 600 --friends-churn
          done
          walk build/tests/server/supervisor_walk 13 600 --friends-churn --faulty-remove
          walk build/tests/server/supervisor_walk 13 600 --friends-churn --faulty-unknown
          # placement's walks on real files (each in walk-files beside its trace) and their faults, at the seeds the
          # trace checks use (tests/server/CMakeLists.txt)
          for seed in 1 2 3; do
            walk build/tests/server/builds_walk "$seed" 800
          done
          for fault_seed in no-lock:1 no-sync:1 tested-program-only:1 reuse-tmp:1 prune-in-use:6 two-renames:1; do
            walk build/tests/server/builds_walk "${fault_seed#*:}" 800 --fault "${fault_seed%%:*}"
          done
          # one pass of nexus-server's loop: its walks and their faults
          for seed in 1 2 3 4 5 6 7 8; do
            walk build/tests/server/pass_walk "$seed" 250
          done
          for fault in release-before-flush state-before-flush tick-before-flush no-hold release-on-fail; do
            walk build/tests/server/pass_walk 1 80 --fault "$fault"
          done
          # handover's walks on real files and OS locks, and their faults
          for seed in 1 2 3; do
            walk build/tests/server/handover_walk "$seed" 600
          done
          for fault_seed in no-lock:1 no-sync:1 in-memory-only:1 overwrite-prev:2 no-rollback:1 stop-cuts:1 allow-untested:1 serve-broken:1; do
            walk build/tests/server/handover_walk "${fault_seed#*:}" 600 --fault "${fault_seed%%:*}"
          done
          # supervision's walks on real files and OS locks, and their faults
          for seed in 1 2 3; do
            walk build/tests/server/supervision_walk "$seed" 350
          done
          for fault_seed in no-sup-lock:1 no-handover-lock:1 drain-stops:1 stop-restarts:1 no-post-start-rollback:1 ping-pong-rollback:2 no-halt-bound:2 in-memory-state:1 serve-untested:1; do
            walk build/tests/server/supervision_walk "${fault_seed#*:}" 350 --fault "${fault_seed%%:*}"
          done
          # layer 5 migration's walks on real files and their faults
          for seed in 1 2 3 4; do
            walk build/tests/server/migration_walk "$seed" 300
          done
          for fault_seed in no-lock:1 ignore-live-old:1 clobber-new:1 no-sync:3 no-plan:3 leave-old:3 blind-back:1 multihop:1 refuse-unknown-change:1; do
            walk build/tests/server/migration_walk "${fault_seed#*:}" 300 --fault "${fault_seed%%:*}"
          done
          # layer 6 end-to-end takeover walks across all five layers and their eleven faults
          for seed in 1 2 3 4; do
            walk build/tests/server/takeover_walk "$seed" 120
          done
          for fault in ignore-live-old skip-migration serve-untested no-handover-lock blind-rollback drain-cuts-turn stop-restarts drain-stops version-only-rollback spin-on-format-refusal blame-build-for-live-old; do
            walk build/tests/server/takeover_walk 1 120 --fault "$fault"
          done
          while [ "$running" -gt 0 ]; do
            wait -n
            running=$((running - 1))
          done
          if [ -e "$walks_root" ]; then chmod -R u+w "$walks_root"; fi
          rm -rf "$walks_root"
          echo "$launched of $listed walks passed (half $HALF; the other job runs the rest)"


  # The Python tests that need a real Mac (.github/python-native-tests.txt): macOS Seatbelt, APFS's case-insensitive
  # file system, and the vendors' own CLIs (codex, grok, agy, and Muse through NEXUS_TEST_MUSE_BINARY), which the
  # fleet installs on its Mac runners. server-policy runs every other Python test on each PR. No test here needs a key
  # or a sign-in. .github/python-tests.py fails on any skip, so a CLI missing from the runner fails this job by name.
  python-native:
    runs-on: [self-hosted, nexus-nightly, macOS, ARM64, xcode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The vendors' CLIs on the runner
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for cli in codex grok agy muse; do
            if path=$(command -v "$cli"); then echo "$cli: $path"; else missing+=("$cli"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=python-native::no ${missing[*]} on $(hostname -s)'s runner PATH: the fleet installs them on its Mac runners; their tests below fail by name"
          fi
          if path=$(command -v muse); then echo "NEXUS_TEST_MUSE_BINARY=$path" >> "$GITHUB_ENV"; fi
      - name: The native tests
        shell: bash
        run: |
          set -euo pipefail
          runtime=$(mktemp -d "$RUNNER_TEMP/nexus-native.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          python3 -m venv "$runtime"
          "$runtime/bin/python" -I -m pip --disable-pip-version-check install ./policy ./drivers/rpc
          "$runtime/bin/python" .github/python-tests.py --tier native --start drivers/rpc
