# Nightly for nexus: the TLA+ instances too large for the per-commit model job (ctest label model_nightly), on the
# standard GitHub macOS runners (the per-commit shards run on Linux). ci.yml checks every property on every pull request,
# on the smaller instances, with
# every witness and trace check; this workflow adds the largest instances (tests/model/CMakeLists.txt,
# tests/sync/CMakeLists.txt, tests/store/CMakeLists.txt and tests/server/CMakeLists.txt say which and why). Nightlies have no 2-minute limit.
#
# Use the hosted JDK and verify TLC against the same digest as the per-commit model checks.

name: nightly

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  model-large:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Prepare the pinned TLC jar
        shell: bash
        run: |
          set -euo pipefail
          jdk=$(/usr/libexec/java_home -v 21)
          "$jdk/bin/java" -version
          echo "$jdk/bin" >> "$GITHUB_PATH"
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$jar"
          echo "$(cut -d' ' -f1 .github/tla2tools.sha256)  $jar" | shasum -a 256 -c -
          echo "TLA2TOOLS_JAR=$jar" >> "$GITHUB_ENV"
      - name: Prax's download cache, one per runner
        shell: bash
        run: |
          set -euo pipefail
          downloads="$HOME/Library/Caches/nexus-ci/$RUNNER_NAME/prax-downloads"
          mkdir -p "$downloads"
          echo "PR_DOWNLOAD_DIR=$downloads" >> "$GITHUB_ENV"
          echo "JOBS=$(sh .github/job-cores.sh)" >> "$GITHUB_ENV"
          echo "TEST_JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
      # Without the link's transport (mosh and protobuf), which no check program uses.
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_LINK=OFF
      - name: Build the model checks
        run: cmake --build build --parallel "$JOBS" --target model_checks
      - name: The largest instances
        run: ctest --test-dir build -L '^model_nightly$' -j "$TEST_JOBS" --output-on-failure
