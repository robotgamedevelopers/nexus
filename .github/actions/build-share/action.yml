# Shares a job's build tree with the jobs that only run its tests (ci.yml: one build per configuration, then test jobs
# that download it). The tree is packed with tar (which keeps executable bits and symlinks, as an artifact's zip does
# not) and zstd, without what only the compiler and linker read (object files and static libraries; Slang, the shader
# compiler Prax runs at build time: 194 MB of the 1.33 GB macOS tree, and no test links or runs it; Prax's download
# steps), and uploaded as one artifact for this run. A test job restores it at the same path
# (.github/actions/build-fetch), so CTest's absolute paths hold: every hosted runner of an OS has the same workspace
# path.
name: build-share
description: Pack the build tree and upload it for this run's test jobs
inputs:
  name:
    description: the artifact's name (one per configuration)
    required: true
runs:
  using: composite
  steps:
    - name: Pack the build tree
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v zstd >/dev/null 2>&1; then echo "::error::no zstd on $(hostname -s)"; exit 1; fi
        start=$(date +%s)
        tar -cf - --exclude='*.o' --exclude='*.a' --exclude='*.obj' --exclude='build/_deps/slang-src' --exclude='build/_deps/prax-subbuild' build | zstd -q -T0 -1 -o "$RUNNER_TEMP/build.tar.zst"
        echo "packed $(du -h "$RUNNER_TEMP/build.tar.zst" | cut -f1) in $(( $(date +%s) - start )) s"
    - name: Upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/build.tar.zst
        compression-level: 0
        retention-days: 1
        if-no-files-found: error
