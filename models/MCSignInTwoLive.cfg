\* Two windows, one on the server's machine (c1) and one on another (c2, which forwards the callback), one account, one
\* flow, no restart: a claim from each window (one process only), a reconnect mid-flow, a flow taken over after its
\* window went, the callback through the gate or straight to the listener, and the disk failing once at the capture.
\* MCSignInTwo.cfg's instance with every property, liveness included: nightly (tlc_signin_spec_two_live), since the
\* liveness check over this graph is past a per-commit run's time on a CI host.
CONSTANTS
    Clients = {c1, c2}
    Remote = {c2}
    Accounts = {a1}
    Tokens = {t1}
    MaxFlows = 1
    MaxRestarts = 0
    MaxFailures = 1
    MaxLosses = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneFlowPerAccount
    OneProcessPerAccount
    ProcessHasItsFlow
    OneCallbackPerFlow
    CallbackOnlyMatching
    GateForwardsOnlyMatching
    TokenNeverDropped
    HeldOnlyCaptured
    EveryPrintTaken
    GateForEveryPage
    SignedInHasLogin
    NoAskWhenSignedIn
    NoTokenInLog
    NoTokenToWindows
PROPERTIES
    ProcessOnlyFromNeeded
    EndedStaysEnded
    RunningEnds
    HeldIsWritten
    ProcessEnds
