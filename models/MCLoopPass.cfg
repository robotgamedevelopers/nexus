\* One window, up to two actions (Send, Queue, Stop), a store/flush failure, and a crash anywhere in any pass
\* (including torn partial-batch writes before sync returns): every pass state, driver turn, queue take, stop,
\* failed flush and recovery path is reachable.
CONSTANTS
    Clients = {1}
    MaxActs = 2
    Kinds = {"Send", "Queue", "Stop"}
    MaxCrashes = 1
    MaxFails = 1
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
    ExactlyOnce
    PromptAtMostOnce
    TurnsIncrease
    DriverOnlyDurable
    LinkStateDurable
    AckedOnlyDurable
PROPERTIES
    DurableMonotonic
    NoOutBeforeFlush
    Converges
