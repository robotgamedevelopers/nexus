\* The session's limit, per commit: two prompts (each sent or queued), one may wait (and one queue), one failed start
\* before the hold, no restart, no model, account or directory to change to, and one change: the limit tightened
\* (with a turn open on a driver started without it, between turns, or while a driver starts), or a change of the
\* drivers file. A driver may say hello without the "limit" feature. MCSupervisorLimitWide.cfg (two changes: tightened
\* and loosened again) runs nightly.
CONSTANTS
    Prompts = 2
    MaxWaiting = 1
    MaxFailedStarts = 1
    MaxRestarts = 0
    Sessions = {"a"}
    Models = {}
    Efforts = {}
    Accounts = {}
    Dirs = {}
    MaxSwitches = 1
    SignIns <- NoSignIns
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDriver
    OneTurn
    TurnsIncrease
    AtMostOnce
    WaitingSound
    QueueSound
    StopOnce
    LimitHolds
    IdleWaitsForPerson
    NoDriverShowsDown
    NeverWeaker
PROPERTIES
    EffectsForOpen
    EndsAnsweredOrCut
    TextKept
    StartsSound
    NoSendWithoutCredential
    StopForOpen
    StopEndsWhatRuns
    NoLatchedStop
    TakesAtTurnEnd
    WrittenWithSetting
    SettingLeavesTurn
    NoSendOnOldAccount
    AccountKeepsTurn
    NoSendInOldPlace
    PlaceKeepsTurn
    ResumesItsDir
    SummaryOwed
    SummaryCarried
    CrashShowsDown
    DownLeavesByWork
    Settles
    NoSendWeaker
    LooseningKeepsTurn
