\* The session's limit, per commit: one prompt, one may wait, one failed start before the hold, no restart, no
\* model, account or directory to change to, and one change: the limit tightened (with a turn open on a driver
\* started without it, between turns, or while a driver starts), or a change of the drivers file. A driver may say
\* hello without the "limit" feature. The AI stays in ais.json (with it taken out and put back as well:
\* MCSupervisorLimitAI.cfg, nightly). Nightly: MCSupervisorLimitTwo.cfg (two prompts) and MCSupervisorLimitWide.cfg
\* (two prompts, two changes: tightened and loosened again).
CONSTANTS
    Prompts = 1
    MaxWaiting = 1
    MaxFailedStarts = 1
    MaxRestarts = 0
    Sessions = {"a"}
    Models = {}
    Efforts = {}
    Accounts = {}
    Dirs = {}
    MaxSwitches = 1
    MaxRemovals = 0
    SignIns <- NoSignIns
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDriver
    OneTurn
    TurnsIncrease
    AtMostOnce
    WaitingSound
    QueueSound
    StopOnce
    LimitHolds
    IdleWaitsForPerson
    NoDriverShowsDown
    NeverWeaker
PROPERTIES
    EffectsForOpen
    EndsAnsweredOrCut
    TextKept
    StartsSound
    NoSendWithoutCredential
    StopForOpen
    StopEndsWhatRuns
    NoLatchedStop
    TakesAtTurnEnd
    WrittenWithSetting
    SettingLeavesTurn
    NoSendOnOldAccount
    AccountKeepsTurn
    NoSendInOldPlace
    PlaceKeepsTurn
    ResumesItsDir
    SummaryOwed
    SummaryCarried
    CrashShowsDown
    DownLeavesByWork
    Settles
    NoSendWeaker
    LooseningKeepsTurn
