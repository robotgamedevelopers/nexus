\* One window on another machine than the server, two accounts, a flow each: two pages that each need the window's one
\* gate, the second waiting, unopened, while the first's gate waits for its callback (GateForEveryPage).
CONSTANTS
    Clients = {c1}
    Remote = {c1}
    Accounts = {a1, a2}
    Tokens = {t1}
    MaxFlows = 2
    MaxRestarts = 0
    MaxFailures = 0
    MaxLosses = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneFlowPerAccount
    OneProcessPerAccount
    ProcessHasItsFlow
    OneCallbackPerFlow
    CallbackOnlyMatching
    GateForwardsOnlyMatching
    TokenNeverDropped
    HeldOnlyCaptured
    EveryPrintTaken
    GateForEveryPage
    SignedInHasLogin
    NoTokenInLog
    NoTokenToWindows
PROPERTIES
    ProcessOnlyFromNeeded
    EndedStaysEnded
