\* One window, two tabs, sends only: the friend's open entries grow in both tabs at once, close, and are cut by a
\* restart; each open entry is numbered once, whichever tab it grows in.
CONSTANTS
    Clients = {1}
    Friends = {"a", "b"}
    Start <- StartAB
    MaxSessions = 2
    MaxActions = 2
    W = 1
    MaxGrows = 3
    MaxRestarts = 1
    Kinds = {"Send"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnce
    ServerHoldsEach
    ViewMatches
    QueueMatches
    NoticesSound
    EachClosedOnce
    LiveSound
    IdsNeverReused
    EnsureMakesOne
    ShowsFirst
PROPERTIES
    OnlyGrow
    OpenGrows
    SessionsKept
    Converges
