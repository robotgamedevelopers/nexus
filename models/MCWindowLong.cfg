\* Window.tla on two friends, in both orders, no terminals (MCWindow.cfg has them), transcripts and queues up to 2
\* entries, so that orders of entries and of queued prompts show. Every property, no error expected.
\* One all-whitespace draft (MCDrafts3): the spec does not compute whitespace, so a second adds only states.
CONSTANTS
    FriendList <- MCFriends2
    Idx <- MCIdx2
    Drafts <- MCDrafts3
    Blank <- MCBlank3
    AppendEntries <- MCAppendEntries
    MaxTerms <- MCMaxTerms0
    MaxLen = 2
SPECIFICATION Spec
CONSTRAINT Bounded
VIEW ModelView
INVARIANTS
    TypeOK
    ActiveValid
    NoTabLost
    NoTabDuplicated
    IdsHandedOut
    ZonesOrdered
PROPERTIES
    SelectExact
    SetDraftExact
    SendResult
    TerminalTakesNoText
    SendAppendsOne
    QueueAppendsOne
    QueueLeavesTranscripts
    OnlyQueueTouchesQueues
    SendClearsOnlyItsDraft
    SendTouchesNoOtherTab
    AppendExact
    MovePlaces
    MoveKeepsTabs
    OnlyMoveReorders
    ActiveFriendKept
    AddAppends
    AddFreshId
    NextIdGrows
    CloseRemovesExactly
    CloseKeepsFriends
    CloseActiveRule
    RefusedChangesNothing
    TranscriptsOnlyGrow
    QueuesOnlyGrow
    FriendsFixed
