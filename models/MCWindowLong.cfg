\* Window.tla with no dashboard, on two AIs, in both orders, no terminals (MCWindow.cfg has them), transcripts and
\* queues up to 2 entries, so that orders of entries and of queued prompts show. Every property, no error expected.
\* One all-whitespace draft (MCDrafts3): the spec does not compute whitespace, so a second adds only states.
CONSTANTS
    AIList <- MCAIs2
    Idx <- MCIdx2
    BoardList <- MCBoards0
    Drafts <- MCDrafts3
    Blank <- MCBlank3
    AppendEntries <- MCAppendEntries
    MaxTerms <- MCMaxTerms0
    MaxLen = 2
SPECIFICATION Spec
CONSTRAINT Bounded
VIEW ModelView
INVARIANTS
    TypeOK
    ActiveValid
    NoTabLost
    NoTabDuplicated
    IdsHandedOut
    ZonesOrdered
    BoardNamesOnce
    HistoryOpen
    HistoryOnce
    HistoryEndsActive
PROPERTIES
    SelectExact
    SetDraftExact
    SendResult
    TerminalTakesNoText
    BoardTakesNoText
    BoardNeverCloses
    SendAppendsOne
    QueueAppendsOne
    QueueLeavesTranscripts
    OnlyQueueTouchesQueues
    TakeExact
    SendClearsOnlyItsDraft
    SendTouchesNoOtherTab
    AppendExact
    MovePlaces
    MoveKeepsTabs
    OnlyMoveReorders
    ActiveAIKept
    AddAppends
    AddFreshId
    NextIdGrows
    CloseRemovesExactly
    CloseKeepsAIs
    CloseActiveRule
    SelectMovesToEnd
    CloseForgets
    RefusedChangesNothing
    TranscriptsOnlyGrow
    QueuesOnlyGrow
    AIsFixed
    BoardsFixed
    AddBoardExact
    RemoveBoardExact
    BoardOpsKeepAIs
