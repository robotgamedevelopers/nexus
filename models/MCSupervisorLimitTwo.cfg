\* The session's limit, nightly: MCSupervisorLimit.cfg with two prompts (each sent or queued), so a prompt waiting
\* or queued behind the turn the tightening stops is sent on the limited driver. 54,428 states; 69 s on two TLC
\* workers on an idle machine, too long for a per-commit shard. MCSupervisorLimitWide.cfg (two changes: tightened and
\* loosened again) also runs nightly.
CONSTANTS
    Prompts = 2
    MaxWaiting = 1
    MaxFailedStarts = 1
    MaxRestarts = 0
    Sessions = {"a"}
    Models = {}
    Efforts = {}
    Accounts = {}
    Dirs = {}
    MaxSwitches = 1
    SignIns <- NoSignIns
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDriver
    OneTurn
    TurnsIncrease
    AtMostOnce
    WaitingSound
    QueueSound
    StopOnce
    LimitHolds
    IdleWaitsForPerson
    NoDriverShowsDown
    NeverWeaker
PROPERTIES
    EffectsForOpen
    EndsAnsweredOrCut
    TextKept
    StartsSound
    NoSendWithoutCredential
    StopForOpen
    StopEndsWhatRuns
    NoLatchedStop
    TakesAtTurnEnd
    WrittenWithSetting
    SettingLeavesTurn
    NoSendOnOldAccount
    AccountKeepsTurn
    NoSendInOldPlace
    PlaceKeepsTurn
    ResumesItsDir
    SummaryOwed
    SummaryCarried
    CrashShowsDown
    DownLeavesByWork
    Settles
    NoSendWeaker
    LooseningKeepsTurn
