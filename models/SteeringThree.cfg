\* Steering.tla on its second small instance (ctest label model, which CI runs nightly, not per pull request): three
\* messages (a prompt, a steer and a follow-up can share a turn) in one driver process that names all three, a tool
\* round per turn, two messages held for the AI at most. Every invariant, action property and temporal property.
\* 32,182 distinct states, 16 s on one core.
SPECIFICATION Spec
CONSTANTS
    MaxIds = 3
    MaxStarts = 1
    MaxTools = 1
    MaxRetries = 0
    MaxWaiting = 2
    FeatureSets = {{"steer", "follow", "settled"}}
    Fault = "none"
INVARIANTS AtMostOnce NeverLost WaitingFits ViewMatches NamedOnly DriverKeptRules ServerKeptRules
PROPERTIES CutOnlyOnExit FollowAtRunEnd SettleEmpty TurnsEnd Resolved
CHECK_DEADLOCK FALSE
