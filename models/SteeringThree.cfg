\* Steering.tla on its second per-commit instance: three messages (a prompt, a steer and a follow-up can share a turn)
\* in one driver process that names all three, a tool round per turn. Every invariant, action property and temporal
\* property. 29,734 distinct states, 19 s on one core.
SPECIFICATION Spec
CONSTANTS
    MaxIds = 3
    MaxStarts = 1
    MaxTools = 1
    MaxRetries = 0
    FeatureSets = {{"steer", "follow", "settled"}}
    Fault = "none"
INVARIANTS AtMostOnce NeverLost ViewMatches NamedOnly DriverKeptRules ServerKeptRules
PROPERTIES CutOnlyOnExit FollowAtRunEnd SettleEmpty TurnsEnd Resolved
CHECK_DEADLOCK FALSE
