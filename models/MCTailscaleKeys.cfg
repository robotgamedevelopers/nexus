\* Tailscale.tla, every property, with auth keys: two node slots on one state directory, each started with an auth
\* key or without, one control outage, one refused login (key expiry is MCTailscale.cfg's).
CONSTANTS
    N = 2
    D = 1
    MaxOutages = 1
    MaxExpiries = 0
    MaxRefusals = 1
    Broken = {}
    StartKeys = {FALSE, TRUE}
    StartCerts = {FALSE}
    RefusalClasses = {"refused"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ReadyHasPeers
    ClosedNeverRunning
    URLOnlyInNeedsLogin
    OneNodePerDir
    StatesNamed
    CertNeverReady
PROPERTIES
    GetsReady
    CertFails
