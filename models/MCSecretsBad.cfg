\* One window, one account, one request, a value of the right shape and one not of it (b1), and the disk failing once:
\* a malformed paste refused; a good one held while the disk fails and stored once it is fixed; an answer that crosses
\* its deadline stored. Every one-chance witness (WSecDropOnFailure, WSecLateAfterDeadline, WSecStoredBeforeDurable,
\* WSecMalformedStored, WSecHeldNeverRetried) is rejected on these constants. 2,771 states, under a second; with two
\* requests (asked again after a malformed paste, a crossing answer made stale by a newer request) it is
\* MCSecretsBadTwo.cfg, 168,610 states, nightly.
CONSTANTS
    Clients = {c1}
    OldClients = {}
    Accounts = {a1}
    Askers = {server}
    Values = {v1, b1}
    BadValues = {b1}
    MaxRequests = 1
    MaxRestarts = 0
    MaxFailures = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSecretToAsker
    NoSecretInTranscript
    NoSecretInLog
    NoSecretToWindows
    AtMostOneStored
    StoredWhenStored
    OneOpenPerAccount
    AnsweredOnce
    AnsweredWhenEnded
    ReceivedNeverDropped
    StoredOnlyDurable
    HeldOnlyWhileHolding
    NoMalformedStored
PROPERTIES
    ClosedStaysClosed
    AskNeedsTaker
    HeldOnlyStored
    EveryRequestEnds
    DialogsClose
    HeldIsStored
