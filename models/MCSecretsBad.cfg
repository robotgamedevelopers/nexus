\* One window, one account, two requests, a value of the right shape and one not of it (b1), and the disk failing once:
\* a malformed paste refused and asked again; a good one held while the disk fails and stored once it is fixed; an
\* answer that crosses its deadline stored while its request is still the newest of the account.
CONSTANTS
    Clients = {c1}
    OldClients = {}
    Accounts = {a1}
    Askers = {server}
    Values = {v1, b1}
    BadValues = {b1}
    MaxRequests = 2
    MaxRestarts = 0
    MaxFailures = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSecretToAsker
    NoSecretInTranscript
    NoSecretInLog
    NoSecretToWindows
    AtMostOneStored
    StoredWhenStored
    OneOpenPerAccount
    AnsweredOnce
    AnsweredWhenEnded
    ReceivedNeverDropped
    StoredOnlyDurable
    HeldOnlyWhileHolding
    NoMalformedStored
PROPERTIES
    ClosedStaysClosed
    AskNeedsTaker
    HeldOnlyStored
    EveryRequestEnds
    DialogsClose
    HeldIsStored
