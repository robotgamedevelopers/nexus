\* One window, one account, two requests and one restart: a second request while one is open is refused as busy; a
\* request after a restart takes a fresh id, so an answer from before it is late, never taken by the new request.
CONSTANTS
    Clients = {c1}
    OldClients = {}
    Accounts = {a1}
    Askers = {ai}
    Values = {v1}
    MaxRequests = 2
    MaxRestarts = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSecretToAsker
    NoSecretInTranscript
    NoSecretInLog
    NoSecretToWindows
    AtMostOneStored
    StoredWhenStored
    OneOpenPerAccount
    AnsweredOnce
    AnsweredWhenEnded
PROPERTIES
    ClosedStaysClosed
    AskNeedsTaker
    EveryRequestEnds
    DialogsClose
