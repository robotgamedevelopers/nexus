\* One window, one account, two requests: a second request while one is open is refused as busy, and one asked after
\* the first ended opens with a fresh id, so an answer for the first is late, never taken by the second. With a restart
\* between them, MCSecretsWide.cfg (nightly).
CONSTANTS
    Clients = {c1}
    OldClients = {}
    Accounts = {a1}
    Askers = {ai}
    Values = {v1}
    BadValues = {}
    MaxRequests = 2
    MaxRestarts = 0
    MaxFailures = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSecretToAsker
    NoSecretInTranscript
    NoSecretInLog
    NoSecretToWindows
    AtMostOneStored
    StoredWhenStored
    OneOpenPerAccount
    AnsweredOnce
    AnsweredWhenEnded
    ReceivedNeverDropped
    StoredOnlyDurable
    HeldOnlyWhileHolding
    NoMalformedStored
PROPERTIES
    ClosedStaysClosed
    AskNeedsTaker
    HeldOnlyStored
    EveryRequestEnds
    DialogsClose
    HeldIsStored
