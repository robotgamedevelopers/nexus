\* One code trace (ClientLockTraceData.tla, written by tests/model/lock_walk) checked against ClientLock.tla. The walk's
\* idle timeout is three seconds; its attempts are bounded only by its steps. Deadlock checking stays on: a step the
\* spec cannot take is a deadlock.
CONSTANTS
    Timeout = 3
    MaxAttempt = 1000000
SPECIFICATION TraceSpec
INVARIANTS
    TraceMatches
    TypeOK
    UnlockedByAuth
    UnlockedSaysNothing
    IdleOnlyUnlocked
    IdleBelowTimeout
    PromptPending
PROPERTIES
    LockSpec
    ContentOnlyUnlocked
    InputOnlyUnlocked
    UnlockOnlyByCurrent
    StaleIgnored
    RefusalSaysWhy
    RelockLocks
    IdleLocks
    PromptOnlyLocked
