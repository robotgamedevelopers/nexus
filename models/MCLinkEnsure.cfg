\* Two windows, each ensuring its AI's session at launch and then sending in the session it shows, with no session
\* at the start: the AI gets one session, both windows show it, and a send that names a session not yet made is
\* refused and counted. (No restart here: MCLinkSessions has one.)
CONSTANTS
    Clients = {1, 2}
    AIs = {"a"}
    Start <- StartNone
    MaxSessions = 2
    MaxActions = 2
    W = 1
    MaxGrows = 1
    MaxRestarts = 0
    Kinds = {"Send", "Ensure"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnce
    ServerHoldsEach
    ViewMatches
    QueueMatches
    NoticesSound
    EachClosedOnce
    LiveSound
    IdsNeverReused
    EnsureMakesOne
    ShowsFirst
PROPERTIES
    OnlyGrow
    OpenGrows
    SessionsKept
    Converges
