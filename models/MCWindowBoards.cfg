\* Window.tla with the dashboards coming and going (MCSpecBoards): one dashboard (d1) and one AI at the start, and
\* add_board (d1 again, d3 and the empty name: MCBoardArrivals) and remove_board at every position, among up to two
\* tabs more (dashboards or terminals): d1 refused while it stands, removed while active and selected, and added again as
\* a new tab at the dashboards' end; transcripts and queues up to 1 entry. Every property, no error expected.
