\* Two servers on one store whose directory may be moved aside once, with a new store made at its name: each server
\* started once by a person and again by the service after any end but exit 0, one stop, one death. A holder of the
\* moved directory goes on in it, through its descriptor, and a stop removes only its own socket's file.
CONSTANTS
    Writers = {"a", "b"}
    Readers = {}
    MaxStarts = 1
    MaxReads = 0
    MaxWrites = 3
    MaxStops = 1
    MaxDeaths = 1
    MaxMoves = 1
    MaxFails = 0
    ReaderWait = 1
    HeldWait = 2
    Bug = "none"
SPECIFICATION Live
INVARIANTS
    TypeOK
    OneWriter
    OpenHoldsLock
    LockedWrites
    ListenedWrites
    SeqsUnique
    SentOnce
    Holders
    SocketKept
PROPERTY
    Serves
