\* Two servers and a reader on one store: each server started up to twice by a person and again by the service after
\* any end but exit 0, one stop, one death, the reader once; every interleaving of their starts, waits, steps, stops
\* and deaths. The safety properties, and Serves under fairness (Live): a start is never left with nothing serving.
CONSTANTS
    Writers = {"a", "b"}
    Readers = {"r"}
    MaxStarts = 2
    MaxReads = 1
    MaxWrites = 3
    MaxStops = 1
    MaxDeaths = 1
    MaxMoves = 0
    ReaderWait = 1
    HeldWait = 2
    Bug = "none"
SPECIFICATION Live
INVARIANTS
    TypeOK
    OneWriter
    OpenHoldsLock
    LockedWrites
    ListenedWrites
    SeqsUnique
    SentOnce
    Holders
    SocketKept
PROPERTY
    Serves
