\* Two processes on one store, each started up to twice, up to four records: every interleaving of their starts, steps
\* and deaths (a refused start, a kill -9 at any step, a start after a death).
CONSTANTS
    Procs = {"p1", "p2"}
    MaxStarts = 2
    MaxWrites = 4
    Bug = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneWriter
    OpenHoldsLock
    LockedWrites
    ListenedWrites
    SeqsUnique
    SentOnce
    Holders
