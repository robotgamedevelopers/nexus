\* Two servers and a reader on one store: each server started up to twice by a person and again by the service after
\* any end but exit 0, one stop (accepted, then the socket closed), one death, the reader once; every interleaving of
\* their starts, waits, steps, stops and deaths (the failed steps are StoreLockFail.cfg's). The safety
\* properties, the gate's (no reader starts while a writer waits on readers), and under fairness (Live): a start is
\* never left with nothing serving (Serves), and a start refused because a server served leads to one serving unless
\* that server was stopped on purpose (RefusedServes).
CONSTANTS
    Writers = {"a", "b"}
    Readers = {"r"}
    MaxStarts = 2
    MaxReads = 1
    MaxWrites = 3
    MaxStops = 1
    MaxDeaths = 1
    MaxMoves = 0
    MaxFails = 0
    ReaderWait = 1
    HeldWait = 2
    Bug = "none"
SPECIFICATION Live
INVARIANTS
    TypeOK
    OneWriter
    OpenHoldsLock
    LockedWrites
    ListenedWrites
    SeqsUnique
    SentOnce
    Holders
    SocketKept
PROPERTIES
    Serves
    RefusedServes
    NoNewReaderWhileWriterWaits
