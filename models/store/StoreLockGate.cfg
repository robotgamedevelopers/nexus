\* Two writers and two readers with no bound on reads (each reader takes the lock again and again, overlapping the
\* other): while a writer waits on readers, no reader takes the lock, so it waits only for those already in. The safety
\* properties too. No liveness is claimed here: a reader that is suspended holds its lock for as long as it is, and the
\* writer gives up after its wait (exit 1); models/store/README.md says what stays unbounded.
CONSTANTS
    Writers = {"a", "b"}
    Readers = {"r", "s"}
    MaxStarts = 1
    MaxReads = 0
    MaxWrites = 2
    MaxStops = 1
    MaxDeaths = 0
    MaxMoves = 0
    MaxFails = 0
    ReaderWait = 2
    HeldWait = 2
    Bug = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneWriter
    OpenHoldsLock
    LockedWrites
    ListenedWrites
    SeqsUnique
    SentOnce
    Holders
    SocketKept
PROPERTY
    NoNewReaderWhileWriterWaits
