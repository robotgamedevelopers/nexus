\* Three processes on one store, each started up to twice, up to five records.
CONSTANTS
    Procs = {"p1", "p2", "p3"}
    MaxStarts = 2
    MaxWrites = 5
    Bug = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneWriter
    OpenHoldsLock
    LockedWrites
    ListenedWrites
    SeqsUnique
    SentOnce
    Holders
