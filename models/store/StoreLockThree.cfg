\* Three servers on one store, each started up to twice, up to three records, one stop, one death. The safety
\* properties only (the readers and the liveness are StoreLock.cfg's; with a reader too it is 17 million states).
CONSTANTS
    Writers = {"a", "b", "c"}
    Readers = {}
    MaxStarts = 2
    MaxReads = 0
    MaxWrites = 3
    MaxStops = 1
    MaxDeaths = 1
    MaxMoves = 0
    MaxFails = 0
    ReaderWait = 1
    HeldWait = 2
    Bug = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneWriter
    OpenHoldsLock
    LockedWrites
    ListenedWrites
    SeqsUnique
    SentOnce
    Holders
    SocketKept
