\* Two servers on one store, each started up to twice by a person and again by the service after any end but exit 0,
\* one stop, one death, and up to two failed steps (an open after the lock, a listen, a restore: each exit 1, its lock
\* released and its own socket removed). The safety properties, and under fairness (Live) Serves and RefusedServes.
CONSTANTS
    Writers = {"a", "b"}
    Readers = {}
    MaxStarts = 2
    MaxReads = 0
    MaxWrites = 3
    MaxStops = 1
    MaxDeaths = 1
    MaxMoves = 0
    MaxFails = 2
    ReaderWait = 1
    HeldWait = 2
    Bug = "none"
SPECIFICATION Live
INVARIANTS
    TypeOK
    OneWriter
    OpenHoldsLock
    LockedWrites
    ListenedWrites
    SeqsUnique
    SentOnce
    Holders
    SocketKept
PROPERTIES
    Serves
    RefusedServes
