\* The journal at capacity 4: four writes (records of three units behind a two-unit header, and snapshots of two),
\* three crashes, two compactions; every crash plan (each pending directory change kept or not, each changed file
\* reverted, cut short or damaged anywhere in what it kept).
CONSTANTS
    Hdr = 2
    SnapHdr = 1
    RecLens = {3}
    SnapLens = {2}
    MaxWrites = 4
    MaxCrashes = 3
    MaxCompacts = 2
    Bug = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NotBroken
    NoTornAccepted
    RecoveredWritten
    NoAckedLost
    CutExact
