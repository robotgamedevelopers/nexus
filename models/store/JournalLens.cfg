\* Records of two lengths (three and four units), so that offsets do not fall on a fixed stride: three writes, three
\* crashes, one compaction.
CONSTANTS
    Hdr = 2
    SnapHdr = 1
    RecLens = {3, 4}
    SnapLens = {2}
    MaxWrites = 3
    MaxCrashes = 3
    MaxCompacts = 1
    Bug = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NotBroken
    NoTornAccepted
    RecoveredWritten
    NoAckedLost
    CutExact
