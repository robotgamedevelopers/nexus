\* Reversed witness: compaction writes the snapshot without syncing the log first, so a crash before the log is
\* replaced can leave a log that ends before the snapshot's number; the next record would follow a gap. NotBroken must
\* be violated (open refuses that disk).
CONSTANTS
    Hdr = 1
    SnapHdr = 1
    RecLens = {2}
    SnapLens = {2}
    MaxWrites = 3
    MaxCrashes = 1
    MaxCompacts = 1
    Bug = "compactnosync"
SPECIFICATION Spec
INVARIANT NotBroken
