\* Reversed witness: a lock held by a writer taken as another server, exit 0 at once. A start that comes while a server
\* is stopping (its socket closed, its drivers ending, its lock held) exits 0, and the stopping one goes: nothing serves,
\* and nothing starts it again. Serves must be violated, under fairness.
CONSTANTS
    Writers = {"a", "b"}
    Readers = {}
    MaxStarts = 1
    MaxReads = 0
    MaxWrites = 3
    MaxStops = 1
    MaxDeaths = 0
    MaxMoves = 0
    MaxFails = 0
    ReaderWait = 1
    HeldWait = 2
    Bug = "held_refused"
SPECIFICATION Live
PROPERTY Serves
