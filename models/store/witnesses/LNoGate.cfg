\* Reversed witness: no gate, so a reader takes the lock while a writer waits on readers, and a stream of readers (no
\* bound on reads, each overlapping the next) keeps the writer out until its wait runs out.
\* NoNewReaderWhileWriterWaits must be violated.
CONSTANTS
    Writers = {"a"}
    Readers = {"r", "s"}
    MaxStarts = 1
    MaxReads = 0
    MaxWrites = 2
    MaxStops = 0
    MaxDeaths = 0
    MaxMoves = 0
    MaxFails = 0
    ReaderWait = 2
    HeldWait = 2
    Bug = "no_gate"
SPECIFICATION Spec
PROPERTY NoNewReaderWhileWriterWaits
