    Hdr = 1
    SnapHdr = 1
    RecLens = {2}
    SnapLens = {2}
    MaxWrites = 2
    MaxCrashes = 2
    MaxCompacts = 0
    Bug = "notruncate"
SPECIFICATION Spec
INVARIANT NoAckedLost
