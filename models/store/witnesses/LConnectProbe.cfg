\* Reversed witness: a connection to the control socket taken as a server serving (the probe before `status`). A server
\* that has accepted `stop` still holds its socket; a start that connects then exits 0, and once the stop ends nothing
\* serves. RefusedServes must be violated.
CONSTANTS
    Writers = {"a", "b"}
    Readers = {}
    MaxStarts = 1
    MaxReads = 0
    MaxWrites = 3
    MaxStops = 1
    MaxDeaths = 0
    MaxMoves = 0
    MaxFails = 0
    ReaderWait = 1
    HeldWait = 2
    Bug = "connect_probe"
SPECIFICATION Live
PROPERTY RefusedServes
