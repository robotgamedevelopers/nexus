\* Reversed witness: the directory is not synced between the snapshot's rename and the log's, so a crash can keep the
\* empty log and lose the snapshot, and with it the acknowledged records the old log held. NoAckedLost must be
\* violated.
CONSTANTS
    Hdr = 1
    SnapHdr = 1
    RecLens = {2}
    SnapLens = {2}
    MaxWrites = 2
    MaxCrashes = 1
    MaxCompacts = 1
    Bug = "nodirsync"
SPECIFICATION Spec
INVARIANT NoAckedLost
