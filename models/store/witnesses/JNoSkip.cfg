\* Reversed witness: open replays the records the snapshot already stands for (a crash after the snapshot, before the
\* log is replaced), so they are applied twice. RecoveredWritten must be violated.
CONSTANTS
    Hdr = 1
    SnapHdr = 1
    RecLens = {2}
    SnapLens = {2}
    MaxWrites = 2
    MaxCrashes = 1
    MaxCompacts = 1
    Bug = "noskip"
SPECIFICATION Spec
INVARIANT RecoveredWritten
