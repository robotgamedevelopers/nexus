\* Reversed witness: the snapshot is renamed into place before it is synced, so a crash can leave the name on a torn
\* snapshot, and open must refuse the disk. NotBroken must be violated.
CONSTANTS
    Hdr = 1
    SnapHdr = 1
    RecLens = {2}
    SnapLens = {2}
    MaxWrites = 2
    MaxCrashes = 1
    MaxCompacts = 1
    Bug = "renamebeforesync"
SPECIFICATION Spec
INVARIANT NotBroken
