\* Reversed witness: a record is acknowledged once appended, before the log is synced. NoAckedLost must be violated.
CONSTANTS
    Hdr = 1
    SnapHdr = 1
    RecLens = {2}
    SnapLens = {2}
    MaxWrites = 1
    MaxCrashes = 1
    MaxCompacts = 0
    Bug = "ackbeforesync"
SPECIFICATION Spec
INVARIANT NoAckedLost
