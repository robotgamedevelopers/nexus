\* One code trace (SignInTraceData.tla, written by tests/sync/signin_walk) checked against SignIn.tla.
\* Deadlock checking stays on: a step the spec cannot take is a deadlock.
\* The logins are model values, as in the model checks' configs (SignInTraceData.tla declares them).
CONSTANTS
    t1 = t1
    t2 = t2
SPECIFICATION TraceSpec
INVARIANTS
    CodeOneProcessPerAccount
    CodeOneCallbackPerFlow
    CodeCallbackOnlyMatching
    CodeGateForwardsOnlyMatching
    CodeNoTokenToWindows
    CodeOneFlowPerAccount
    MatchServer
    MatchCallbacks
    MatchWindows
    MatchViews
    MatchGates
    MatchUp
    MatchStore
    TraceMatches
    TypeOK
    OneFlowPerAccount
    OneProcessPerAccount
    ProcessHasItsFlow
    OneCallbackPerFlow
    CallbackOnlyMatching
    GateForwardsOnlyMatching
    TokenNeverDropped
    HeldOnlyCaptured
    EveryPrintTaken
    GateForEveryPage
    SignedInHasLogin
    NoAskWhenSignedIn
    NoTokenToWindows
PROPERTIES
    ProcessOnlyFromNeeded
    EndedStaysEnded
