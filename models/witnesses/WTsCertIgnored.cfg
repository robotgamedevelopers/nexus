\* Reversed witness of Tailscale.tla: a control server whose certificate is not trusted is talked to anyway, so a node
\* of it gets its map and is ready. Must fail: CertNeverReady.
CONSTANTS
    N = 2
    D = 1
    MaxOutages = 1
    MaxExpiries = 1
    MaxRefusals = 1
    Broken = {"cert-ignored"}
    StartKeys = {FALSE}
    StartCerts = {FALSE, TRUE}
    RefusalClasses = {"refused"}
SPECIFICATION Spec
INVARIANT CertNeverReady
