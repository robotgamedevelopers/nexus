\* Must pass: with a window's gate that sends up anything, the server still replays only the matching callback, once.
CONSTANTS
    Clients = {c1, c2}
    Remote = {c1, c2}
    Accounts = {a1}
    Tokens = {t1}
    MaxFlows = 1
    MaxRestarts = 0
    MaxFailures = 0
    MaxLosses = 0
SPECIFICATION HostileSpec
INVARIANTS
    OneCallbackPerFlow
    CallbackOnlyMatching
    OneProcessPerAccount
    TokenNeverDropped
