\* A restart that forgets the id counter: a create after it mints an id held already.
CONSTANTS
    Clients = {1}
    Friends = {"a"}
    Start <- StartA
    MaxSessions = 2
    MaxActions = 1
    W = 1
    MaxGrows = 0
    MaxRestarts = 1
    Kinds = {"Create"}
SPECIFICATION BrokenSpec
INVARIANT IdsNeverReused
