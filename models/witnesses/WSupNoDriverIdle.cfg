\* Must fail: invariant BrokenNoDriverShowsDown. One prompt and one change: the drivers file loses the AI's driver.
CONSTANTS
    Prompts = 1
    MaxWaiting = 1
    MaxFailedStarts = 2
    MaxRestarts = 0
    Sessions = {"a"}
    Models = {}
    Efforts = {}
    Accounts = {}
    Dirs = {}
    MaxSwitches = 1
    LimitChanges <- NoLimitChanges
    MaxRemovals = 0
SPECIFICATION BrokenSpec
INVARIANT BrokenNoDriverShowsDown
