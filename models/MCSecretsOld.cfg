\* A window of this version and an older one, which never receives a request: with only the older one connected, the
\* asker is told "no-client" at once.
CONSTANTS
    Clients = {c1, c2}
    OldClients = {c2}
    Accounts = {a1}
    Askers = {ai}
    Values = {v1}
    BadValues = {}
    MaxRequests = 1
    MaxRestarts = 0
    MaxFailures = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSecretToAsker
    NoSecretInTranscript
    NoSecretInLog
    NoSecretToWindows
    AtMostOneStored
    StoredWhenStored
    OneOpenPerAccount
    AnsweredOnce
    AnsweredWhenEnded
    ReceivedNeverDropped
    StoredOnlyDurable
    HeldOnlyWhileHolding
    NoMalformedStored
PROPERTIES
    ClosedStaysClosed
    AskNeedsTaker
    HeldOnlyStored
    EveryRequestEnds
    DialogsClose
    HeldIsStored
