\* Tailscale.tla, every property: two node slots on one state directory (a start refused while the other holds it, and
\* a restart on an enrolled directory), one control outage, one key expiry, one refused login, interactive sign-ins
\* (MCTailscaleKeys.cfg adds auth keys, MCTailscaleCerts.cfg untrusted certificates).
CONSTANTS
    N = 2
    D = 1
    MaxOutages = 1
    MaxExpiries = 1
    MaxRefusals = 1
    Broken = {}
    StartKeys = {FALSE}
    StartCerts = {FALSE}
    RefusalClasses = {"refused"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ReadyHasPeers
    ClosedNeverRunning
    URLOnlyInNeedsLogin
    OneNodePerDir
    StatesNamed
    CertNeverReady
PROPERTIES
    GetsReady
    CertFails
