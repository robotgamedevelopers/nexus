\* Window.tla with the sprint tab first, then three friends in all six orders, up to one terminal, transcripts and
\* queues empty (MaxLen 0): the moves around the sprint tab with three friends and a terminal, small enough for seconds. Every property.
\* Two drafts, empty and text (MCDrafts2): every order of the selection history multiplies the states.
