\* Steering.tla on its wide instance for a driver that names all three features (ctest label model_nightly): three
\* messages, two driver processes, a tool round and a retry per turn, two messages held for the AI at most. Every
\* invariant, action property and temporal property. 202,531 distinct states, 79 s on one core.
\* SteeringWideRest.cfg takes the other four sets of features.
SPECIFICATION Spec
CONSTANTS
    MaxIds = 3
    MaxStarts = 2
    MaxTools = 1
    MaxRetries = 1
    MaxWaiting = 2
    FeatureSets = {{"steer", "follow", "settled"}}
    Fault = "none"
INVARIANTS AtMostOnce NeverLost WaitingFits ViewMatches NamedOnly DriverKeptRules ServerKeptRules
PROPERTIES CutOnlyOnExit FollowAtRunEnd SettleEmpty TurnsEnd Resolved
CHECK_DEADLOCK FALSE
