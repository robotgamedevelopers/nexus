    FeatureSets = {{}, {"settled"}, {"steer", "settled"}, {"follow", "settled"}, {"steer", "follow", "settled"}}
    Fault = "none"
INVARIANTS AtMostOnce NeverLost ViewMatches NamedOnly DriverKeptRules ServerKeptRules
PROPERTIES CutOnlyOnExit FollowAtRunEnd SettleEmpty TurnsEnd Resolved
