\* Window.tla on two friends, in both orders, with up to two terminals added, moved and closed, transcripts and queues
\* up to 1 entry. Every property, no error expected.
\* One all-whitespace draft (MCDrafts3): the spec does not compute whitespace, so a second adds only states.
CONSTANTS
    FriendList <- MCFriends2
    Idx <- MCIdxT2
    Drafts <- MCDrafts3
    Blank <- MCBlank3
    AppendEntries <- MCAppendEntries3
    MaxTerms <- MCMaxTerms2
    MaxLen = 1
SPECIFICATION Spec
CONSTRAINT Bounded
VIEW ModelView
INVARIANTS
    TypeOK
    ActiveValid
    NoTabLost
    NoTabDuplicated
    IdsHandedOut
    ZonesOrdered
PROPERTIES
    SelectExact
    SetDraftExact
    SendResult
    TerminalTakesNoText
    SendAppendsOne
    QueueAppendsOne
    QueueLeavesTranscripts
    OnlyQueueTouchesQueues
    SendClearsOnlyItsDraft
    SendTouchesNoOtherTab
    AppendExact
    MovePlaces
    MoveKeepsTabs
    OnlyMoveReorders
    ActiveFriendKept
    AddAppends
    AddFreshId
    NextIdGrows
    CloseRemovesExactly
    CloseKeepsFriends
    CloseActiveRule
    RefusedChangesNothing
    TranscriptsOnlyGrow
    QueuesOnlyGrow
    FriendsFixed
