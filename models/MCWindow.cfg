\* Window.tla with the sprint tab first, then two friends in both orders, with up to two terminals added, moved and closed, transcripts and queues
\* up to 1 entry. Every property, no error expected.
\* One all-whitespace draft (MCDrafts3): the spec does not compute whitespace, so a second adds only states.
CONSTANTS
    FriendList <- MCFriends2
    Idx <- MCIdxS2T2
    Sprint = TRUE
    Drafts <- MCDrafts3
    Blank <- MCBlank3
    AppendEntries <- MCAppendEntries3
    MaxTerms <- MCMaxTerms2
    MaxLen = 1
SPECIFICATION Spec
CONSTRAINT Bounded
VIEW ModelView
INVARIANTS
    TypeOK
    ActiveValid
    NoTabLost
    NoTabDuplicated
    IdsHandedOut
    ZonesOrdered
    SprintFirst
    HistoryOpen
    HistoryOnce
    HistoryEndsActive
PROPERTIES
    SelectExact
    SetDraftExact
    SendResult
    TerminalTakesNoText
    SprintTakesNoText
    SprintNeverMoves
    SprintNeverCloses
    SendAppendsOne
    QueueAppendsOne
    QueueLeavesTranscripts
    OnlyQueueTouchesQueues
    TakeExact
    SendClearsOnlyItsDraft
    SendTouchesNoOtherTab
    AppendExact
    MovePlaces
    MoveKeepsTabs
    OnlyMoveReorders
    ActiveFriendKept
    AddAppends
    AddFreshId
    NextIdGrows
    CloseRemovesExactly
    CloseKeepsFriends
    CloseActiveRule
    SelectMovesToEnd
    CloseForgets
    RefusedChangesNothing
    TranscriptsOnlyGrow
    QueuesOnlyGrow
    FriendsFixed
