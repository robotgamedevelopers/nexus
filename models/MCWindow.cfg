\* Window.tla with one dashboard first, then two AIs in both orders, with up to two terminals added, moved and closed,
\* transcripts and queues up to 1 entry. Every property, no error expected.
\* One all-whitespace draft (MCDrafts3): the spec does not compute whitespace, so a second adds only states.
CONSTANTS
    AIList <- MCAIs2
    Idx <- MCIdxS2T2
    BoardList <- MCBoards1
    Drafts <- MCDrafts3
    Blank <- MCBlank3
    AppendEntries <- MCAppendEntries3
    MaxTerms <- MCMaxTerms2
    MaxLen = 1
SPECIFICATION Spec
CONSTRAINT Bounded
VIEW ModelView
INVARIANTS
    TypeOK
    ActiveValid
    NoTabLost
    NoTabDuplicated
    IdsHandedOut
    ZonesOrdered
    BoardNamesOnce
    HistoryOpen
    HistoryOnce
    HistoryEndsActive
PROPERTIES
    SelectExact
    SetDraftExact
    SendResult
    TerminalTakesNoText
    BoardTakesNoText
    BoardNeverCloses
    SendAppendsOne
    QueueAppendsOne
    QueueLeavesTranscripts
    OnlyQueueTouchesQueues
    TakeExact
    SendClearsOnlyItsDraft
    SendTouchesNoOtherTab
    AppendExact
    MovePlaces
    MoveKeepsTabs
    OnlyMoveReorders
    ActiveAIKept
    AddAppends
    AddFreshId
    NextIdGrows
    CloseRemovesExactly
    CloseKeepsAIs
    CloseActiveRule
    SelectMovesToEnd
    CloseForgets
    RefusedChangesNothing
    TranscriptsOnlyGrow
    QueuesOnlyGrow
    AIsFixed
    BoardsFixed
