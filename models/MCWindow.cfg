\* Window.tla on two tabs, in both orders, transcripts and queues up to 2 entries. Every property, no error expected.
\* One all-whitespace draft (MCDrafts3): the spec does not compute whitespace, so a second adds only states.
CONSTANTS
    FriendList <- MCFriends2
    Idx <- MCIdx2
    Drafts <- MCDrafts3
    Blank <- MCBlank3
    AppendEntries <- MCAppendEntries
    MaxLen = 2
SPECIFICATION Spec
CONSTRAINT Bounded
VIEW ModelView
INVARIANTS
    TypeOK
    ActiveValid
    NoTabLost
    NoTabDuplicated
PROPERTIES
    SelectExact
    SetDraftExact
    SendResult
    SendAppendsOne
    QueueAppendsOne
    QueueLeavesTranscripts
    OnlyQueueTouchesQueues
    SendClearsOnlyItsDraft
    SendTouchesNoOtherTab
    AppendExact
    MovePlaces
    MoveKeepsTabs
    OnlyMoveReorders
    ActiveFriendKept
    RefusedChangesNothing
    TranscriptsOnlyGrow
    QueuesOnlyGrow
    FriendsFixed
