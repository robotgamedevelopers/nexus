\* The bench instance, not a per-commit or nightly test: an earlier form of the model was past 14 million distinct
\* states in 30 minutes on four workers, unfinished. MCSignInOne.cfg and MCSignInTwo.cfg are the tests.
\* Two windows, one on the server's machine (c1) and one on another (c2, which forwards the callback), one account and
\* two flows: a claim from each window and a reconnect mid-flow (one process only); a flow taken over after its window
\* went; a callback forwarded once; a decline on the page; a deadline; the disk failing once at the capture (the token
\* held, then written); a login lost and signed in again; one server restart with a flow live or a token held.
CONSTANTS
    Clients = {c1, c2}
    Remote = {c2}
    Accounts = {a1}
    Tokens = {t1}
    MaxFlows = 2
    MaxRestarts = 1
    MaxFailures = 1
    MaxLosses = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneFlowPerAccount
    OneProcessPerAccount
    ProcessHasItsFlow
    OneCallbackPerFlow
    CallbackOnlyMatching
    GateForwardsOnlyMatching
    TokenNeverDropped
    HeldOnlyCaptured
    EveryPrintTaken
    GateForEveryPage
    SignedInHasLogin
    NoAskWhenSignedIn
    NoTokenInLog
    NoTokenToWindows
PROPERTIES
    ProcessOnlyFromNeeded
    EndedStaysEnded
    RunningEnds
    HeldIsWritten
    ProcessEnds
