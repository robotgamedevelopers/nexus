\* Window.tla with the sprint tab first, then two friends in both orders, with up to two terminals added, selected, moved
\* and closed, transcripts and queues empty (MaxLen 0): the selection history over every kind of tab, small enough for
\* seconds. MCWindow.cfg is the same with entries (MaxLen 1), nightly. Every property, no error expected.
