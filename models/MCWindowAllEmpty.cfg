\* Window.tla from an empty strip, as the window starts (MCSpecAll): no dashboard and no AI, then the server's
\* dashboards and AIs arriving and leaving among terminals (add_board and add_ai into an empty strip, where the new tab is
\* active and starts the history; a dashboard arriving after an AI goes in front of it), down to no tab at all. Every
\* property, no error expected.
