\* Nightly: two windows sharing one tab, two actions each of any kind (sends, queues, stops), a tail of one entry, no
\* open entries: every send pushes an entry out of the tail, so the windows' mirrors write notices, and queued prompts
\* are taken between them (643,703 states; 1 min 53 s on four workers in a login session on the studio).
CONSTANTS
    Clients = {1, 2}
    TabNames = {"a"}
    MaxActions = 2
    W = 1
    MaxGrows = 0
    MaxRestarts = 0
    Kinds = {"Send", "Queue", "Stop"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnce
    ServerHoldsEach
    ViewMatches
    QueueMatches
    NoticesSound
    EachClosedOnce
    LiveSound
PROPERTIES
    OnlyGrow
    OpenGrows
    Converges
