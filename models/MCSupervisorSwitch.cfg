\* The session's settings and account: two prompts (each sent or queued), one may wait (and one queue), one failed
\* start before the hold, no restart, one model (no effort) and one account besides the defaults, one change in
\* all: a change of the model or effort with a turn open or between turns, and a change of the account with a driver
\* running, which is ended once no turn is open and never counted as a failed start. MCSupervisorSwitchWide.cfg (two
\* failed starts, a restart, two changes) runs nightly.
CONSTANTS
    Prompts = 2
    MaxWaiting = 1
    MaxFailedStarts = 1
    MaxRestarts = 0
    Sessions = {"a"}
    Models = {"m"}
    Efforts = {}
    Accounts = {"x"}
    Dirs = {}
    MaxSwitches = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDriver
    OneTurn
    TurnsIncrease
    AtMostOnce
    WaitingSound
    QueueSound
    StopOnce
    LimitHolds
    IdleWaitsForPerson
    NoDriverShowsDown
PROPERTIES
    EffectsForOpen
    EndsAnsweredOrCut
    TextKept
    StartsSound
    NoSendWithoutCredential
    StopForOpen
    StopEndsWhatRuns
    NoLatchedStop
    TakesAtTurnEnd
    WrittenWithSetting
    SettingLeavesTurn
    NoSendOnOldAccount
    AccountKeepsTurn
    NoSendInOldPlace
    PlaceKeepsTurn
    ResumesItsDir
    SummaryOwed
    SummaryCarried
    CrashShowsDown
    DownLeavesByWork
    Settles
