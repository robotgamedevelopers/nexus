\* One window on another machine than the server, one account, one flow, no restart: the whole path through the
\* window's gate, with the disk failing once.
CONSTANTS
    Clients = {c1}
    Remote = {c1}
    Accounts = {a1}
    Tokens = {t1}
    MaxFlows = 1
    MaxRestarts = 0
    MaxFailures = 1
    MaxLosses = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneFlowPerAccount
    OneProcessPerAccount
    ProcessHasItsFlow
    OneCallbackPerFlow
    CallbackOnlyMatching
    GateForwardsOnlyMatching
    TokenNeverDropped
    HeldOnlyCaptured
    EveryPrintTaken
    GateForEveryPage
    SignedInHasLogin
    NoAskWhenSignedIn
    NoTokenInLog
    NoTokenToWindows
PROPERTIES
    ProcessOnlyFromNeeded
    EndedStaysEnded
    RunningEnds
    HeldIsWritten
    ProcessEnds
