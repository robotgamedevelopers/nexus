\* Two actors and a server. Build 1 current and build 2 placed (both tested); tree 3 (tree 1 with its driver changed
\* after tree 1's tests) not placed and untested. Each actor runs one verb at once with the other (place any tree with
\* any evidence, make any build current, switch back, prune), one actor dies, the machine crashes once, a server starts
\* once from any build. Every safety property, and under fairness every verb begun ends (VerbsEnd).
CONSTANTS
    Actors = {"a1", "a2"}
    Servers = {"s1"}
    Trees = {1, 2, 3}
    Tested = {1, 2}
    Initial = 1
    Others = {2}
    MaxOps = 1
    MaxCrashes = 1
    MaxDeaths = 1
    MaxServes = 1
    MaxFolders = 6
    Bug = "none"
SPECIFICATION Live
INVARIANTS
    TypeOK
    CurrentValid
    PreviousValid
    PointerResolves
    PrevIsLastCurrent
    NamedWhole
    SealedUnchanged
    InUseKept
    OneSwitcher
    LockHeld
PROPERTIES
    VerbsEnd
