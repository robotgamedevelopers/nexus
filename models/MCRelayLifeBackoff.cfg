\* RelayLife.tla: six relays and one action, so that the backoff reaches its cap (1, 2, 4, 8, 10, 10), every property;
\* a state with nothing left to do is no deadlock.
CONSTANTS
    MaxRelays = 6
    MaxActions = 1
    First = 1
    Last = 10
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneRelay
    AppliedOnce
    AckTrue
    Covered
    BackoffOK
PROPERTIES
    CutOnlyUnacked
    WaitsBackoff
    CutTold
    Restarts
CHECK_DEADLOCK FALSE
