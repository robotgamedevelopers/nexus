\* Window.tla with the friends coming and going (MCSpecFriends): the sprint tab, one friend at the start, and add_friend
\* and remove_friend at every position among up to two terminals, the friend removed while active and selected, and added
\* again as a new tab; transcripts and queues up to 1 entry, so a removed tab's are seen to go with it. Every property,
\* no error expected.
