\* Steering.tla on its first small instance (ctest label model, which CI runs nightly, not per pull request): two
\* messages, two driver processes, a tool round and a retry per turn, one message held for the AI at most, a driver that
\* names nothing and one that names all three. SteeringThree.cfg takes three messages in one driver process;
\* SteeringWide.cfg and SteeringWideRest.cfg (model_nightly) take every set of features. Every invariant, action
\* property and temporal property. 20,066 distinct states, 10 s on one core.
SPECIFICATION Spec
CONSTANTS
    MaxIds = 2
    MaxStarts = 2
    MaxTools = 1
    MaxRetries = 1
    MaxWaiting = 1
    FeatureSets = {{}, {"steer", "follow", "settled"}}
    Fault = "none"
INVARIANTS AtMostOnce NeverLost WaitingFits ViewMatches NamedOnly DriverKeptRules ServerKeptRules
PROPERTIES CutOnlyOnExit FollowAtRunEnd SettleEmpty TurnsEnd Resolved
CHECK_DEADLOCK FALSE
