\* Steering.tla on its first per-commit instance: two messages, two driver processes, a tool round and a retry per
\* turn, a driver that names nothing and one that names all three. SteeringThree.cfg takes three messages in one driver
\* process; SteeringWide.cfg (nightly) takes every feature set with three messages and two processes. Every invariant,
\* action property and temporal property. 17,168 distinct states, 7 s on one core.
SPECIFICATION Spec
CONSTANTS
    MaxIds = 2
    MaxStarts = 2
    MaxTools = 1
    MaxRetries = 1
    FeatureSets = {{}, {"steer", "follow", "settled"}}
    Fault = "none"
INVARIANTS AtMostOnce NeverLost ViewMatches NamedOnly DriverKeptRules ServerKeptRules
PROPERTIES CutOnlyOnExit FollowAtRunEnd SettleEmpty TurnsEnd Resolved
CHECK_DEADLOCK FALSE
