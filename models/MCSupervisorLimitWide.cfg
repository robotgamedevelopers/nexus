\* The session's limit, nightly: MCSupervisorLimit.cfg with two changes, so the limit is tightened and
\* loosened again, where LooseningKeepsTurn bites.
CONSTANTS
    Prompts = 2
    MaxWaiting = 1
    MaxFailedStarts = 1
    MaxRestarts = 0
    Sessions = {"a"}
    Models = {}
    Efforts = {}
    Accounts = {}
    Dirs = {}
    MaxSwitches = 2
    SignIns <- NoSignIns
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDriver
    OneTurn
    TurnsIncrease
    AtMostOnce
    WaitingSound
    QueueSound
    StopOnce
    LimitHolds
    IdleWaitsForPerson
    NoDriverShowsDown
    NeverWeaker
PROPERTIES
    EffectsForOpen
    EndsAnsweredOrCut
    TextKept
    StartsSound
    NoSendWithoutCredential
    StopForOpen
    StopEndsWhatRuns
    NoLatchedStop
    TakesAtTurnEnd
    WrittenWithSetting
    SettingLeavesTurn
    NoSendOnOldAccount
    AccountKeepsTurn
    NoSendInOldPlace
    PlaceKeepsTurn
    ResumesItsDir
    SummaryOwed
    SummaryCarried
    CrashShowsDown
    DownLeavesByWork
    Settles
    NoSendWeaker
    LooseningKeepsTurn
