\* Three groups (a shell and two ssh sessions), up to two foreground changes (covering G_sh -> G_ssh -> G_sh ABA and
\* G_sh -> G_ssh1 -> G_ssh2) and two title observations, every safety and liveness property.
SPECIFICATION Spec
CONSTANTS
    Groups = {1, 2, 3}
    SshGroups = {2, 3}
    MaxChanges = 2
    MaxTitles = 2
INVARIANTS
    TypeOK
    SeqOrdered
    RemoteMatchesGroup
PROPERTIES
    SeqMonotone
    FrameSeesTitleGroup
    PollNeverClobbersFrame
    OverlapAsksRecheck
    SettlesToForeground
