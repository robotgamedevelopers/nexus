\* Two windows, one on the server's machine (c1) and one on another (c2, which forwards the callback), one account, one
\* flow, no restart: a claim from each window (one process only), a reconnect mid-flow, a flow taken over after its
\* window went, the callback through the gate or straight to the listener, and the disk failing once at the capture.
\* The per-commit two-window instance, its safety alone: liveness over this graph is past a per-commit run's time on a
\* CI host, so it is checked nightly (MCSignInTwoLive.cfg, the same instance), and per commit on MCSignInOne.cfg.
\* MCSignIn.cfg (two flows, a restart, a lost login) is a bench run.
CONSTANTS
    Clients = {c1, c2}
    Remote = {c2}
    Accounts = {a1}
    Tokens = {t1}
    MaxFlows = 1
    MaxRestarts = 0
    MaxFailures = 1
    MaxLosses = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneFlowPerAccount
    OneProcessPerAccount
    ProcessHasItsFlow
    OneCallbackPerFlow
    CallbackOnlyMatching
    GateForwardsOnlyMatching
    TokenNeverDropped
    HeldOnlyCaptured
    EveryPrintTaken
    GateForEveryPage
    SignedInHasLogin
    NoTokenInLog
    NoTokenToWindows
PROPERTIES
    ProcessOnlyFromNeeded
    EndedStaysEnded
