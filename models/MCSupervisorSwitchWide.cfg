\* Nightly: the session's settings and account as in MCSupervisorSwitch.cfg, with two failed starts before the hold,
\* one server restart, an effort as well as the model, and two changes in all, so a change can follow a restart, or undo
\* the one before it (a model or effort put back to the default ends a driver told it).
CONSTANTS
    Prompts = 2
    MaxWaiting = 1
    MaxFailedStarts = 2
    MaxRestarts = 1
    Sessions = {"a"}
    Models = {"m"}
    Efforts = {"high"}
    Accounts = {"x"}
    MaxSwitches = 2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDriver
    OneTurn
    TurnsIncrease
    AtMostOnce
    WaitingSound
    QueueSound
    StopOnce
    LimitHolds
    IdleWaitsForPerson
PROPERTIES
    EffectsForOpen
    EndsAnsweredOrCut
    TextKept
    StartsSound
    NoSendWithoutCredential
    StopForOpen
    StopEndsWhatRuns
    NoLatchedStop
    TakesAtTurnEnd
    WrittenWithSetting
    SettingLeavesTurn
    NoSendOnOldAccount
    AccountKeepsTurn
    CrashShowsDown
    DownLeavesByWork
    Settles
