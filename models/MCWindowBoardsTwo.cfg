\* Window.tla with several dashboards coming and going (MCSpecBoards): two dashboards (d1, d2) at the start and no AI,
\* add_board (d1 again, d3 and the empty name) and remove_board at every position, among up to two tabs more
\* (dashboards or terminals), and the dashboards moved among themselves: an added one goes after the dashboards that
\* stand, wherever the person moved them. Every property, no error expected.
