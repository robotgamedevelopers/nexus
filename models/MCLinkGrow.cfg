\* One window, one tab, the server's own steps: the AI's open entry grows, closes, and is cut by a restart;
\* queued prompts are taken at a turn's end; stops reach the tab, or are refused before the tab exists.
CONSTANTS
    Clients = {1}
    AIs = {"a"}
    Start <- StartA
    MaxSessions = 1
    MaxActions = 2
    W = 1
    MaxGrows = 2
    MaxRestarts = 1
    Kinds = {"Send", "Queue", "Stop"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnce
    ServerHoldsEach
    ViewMatches
    QueueMatches
    NoticesSound
    EachClosedOnce
    LiveSound
    IdsNeverReused
    EnsureMakesOne
    ShowsFirst
PROPERTIES
    OnlyGrow
    OpenGrows
    SessionsKept
    Converges
