\* Nightly: one window, up to three actions (Send, Queue, Stop), two crashes across passes and a store/flush failure.
CONSTANTS
    Clients = {1}
    MaxActs = 3
    Kinds = {"Send", "Queue", "Stop"}
    MaxCrashes = 2
    MaxFails = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnce
    PromptAtMostOnce
    TurnsIncrease
    DriverOnlyDurable
    LinkStateDurable
    AckedOnlyDurable
PROPERTIES
    DurableMonotonic
    NoOutBeforeFlush
