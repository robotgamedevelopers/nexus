\* Two prompts (each sent or queued), one may wait (and one queue), two failed starts before the hold, one server
\* restart, one session id: every rule's path is reachable (a cut, a stop, a refused prompt, the hold and its lifting,
\* a restart with a turn open, a queued prompt taken at a turn's end). MCSupervisorQueue.cfg (three prompts, so two
\* queue at once) and MCSupervisorWide.cfg run nightly.
CONSTANTS
    Prompts = 2
    MaxWaiting = 1
    MaxFailedStarts = 2
    MaxRestarts = 1
    Sessions = {"a"}
    Models = {}
    Efforts = {}
    Accounts = {}
    Dirs = {}
    MaxSwitches = 0
    LimitChanges <- NoLimitChanges
    MaxRemovals = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDriver
    OneTurn
    TurnsIncrease
    AtMostOnce
    WaitingSound
    QueueSound
    StopOnce
    LimitHolds
    IdleWaitsForPerson
    NoDriverShowsDown
PROPERTIES
    EffectsForOpen
    EndsAnsweredOrCut
    TextKept
    StartsSound
    NoSendWithoutCredential
    StopForOpen
    StopEndsWhatRuns
    NoLatchedStop
    TakesAtTurnEnd
    WrittenWithSetting
    SettingLeavesTurn
    NoSendOnOldAccount
    AccountKeepsTurn
    NoSendInOldPlace
    PlaceKeepsTurn
    ResumesItsDir
    SummaryOwed
    SummaryCarried
    CrashShowsDown
    DownLeavesByWork
    Settles
