\* Three prompts, two may wait, two failed starts before the hold, one server restart, one session id: every rule's
\* path is reachable (a cut, a stop, a refused prompt, the hold and its lifting, a restart with a turn open).
\* MCSupervisorWide.cfg, nightly, is larger.
CONSTANTS
    Prompts = 3
    MaxWaiting = 2
    MaxFailedStarts = 2
    MaxRestarts = 1
    Sessions = {"a"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDriver
    OneTurn
    TurnsIncrease
    AtMostOnce
    WaitingSound
    LimitHolds
PROPERTIES
    EffectsForOpen
    EndsAnsweredOrCut
    TextKept
    StartsSound
    NoSendWithoutCredential
    Settles
