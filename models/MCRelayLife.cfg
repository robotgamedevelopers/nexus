\* RelayLife.tla: three relays in turn and three actions, the backoff as the code has it (1 s doubling to 10 s), every
\* property. The window may exit and the relays run out: a state with nothing left to do is no deadlock.
CONSTANTS
    MaxRelays = 3
    MaxActions = 3
    First = 1
    Last = 10
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneRelay
    AppliedOnce
    AckTrue
    Covered
    BackoffOK
PROPERTIES
    CutOnlyUnacked
    WaitsBackoff
    CutTold
    Restarts
CHECK_DEADLOCK FALSE
