\* SignInPaste.tla, the nightly instance: two windows, one on the server's machine (c1) and one on another (c2),
\* two codes, two flows, two stray codes (from either window, for any flow: another window's, a second, one with
\* no flow waiting) and a restart.
CONSTANTS
    Clients = {c1, c2}
    Remote = {c2}
    Codes = {k1, k2}
    MaxFlows = 2
    MaxStrays = 2
    MaxRestarts = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneFlow
    ProcessHasItsFlow
    OneCodePerFlow
    CodeOnlyFromHolder
    CodeOnlyWhenAsked
    NoCodeInLog
    NoCodeToWindows
    AskOnlyToHolder
PROPERTIES
    EndedStaysEnded
    RunningEnds
