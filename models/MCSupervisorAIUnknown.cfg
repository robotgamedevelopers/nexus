\* No AIs list held, per commit: one prompt (sent or queued), one failed start before the hold, one server restart
\* (which may come up holding no list: RestartUnknown, then the first list applied, Learn), no change of the person's,
\* and the AI taken out once and put back, so that the restart can fall while it is out, with a prompt queued.
CONSTANTS
    Prompts = 1
    MaxWaiting = 1
    MaxFailedStarts = 1
    MaxRestarts = 1
    Sessions = {"a"}
    Models = {}
    Efforts = {}
    Accounts = {}
    Dirs = {}
    MaxSwitches = 0
    LimitChanges <- NoLimitChanges
    MaxRemovals = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDriver
    OneTurn
    TurnsIncrease
    AtMostOnce
    WaitingSound
    QueueSound
    StopOnce
    LimitHolds
    IdleWaitsForPerson
    NoDriverShowsDown
    AbsentRunsNothing
    UnknownRunsNothing
PROPERTIES
    NoSendUnknown
    EffectsForOpen
    EndsAnsweredOrCut
    TextKept
    StartsSound
    NoSendWithoutCredential
    StopForOpen
    StopEndsWhatRuns
    NoLatchedStop
    TakesAtTurnEnd
    WrittenWithSetting
    SettingLeavesTurn
    NoSendOnOldAccount
    AccountKeepsTurn
    NoSendInOldPlace
    PlaceKeepsTurn
    ResumesItsDir
    SummaryOwed
