\* Tailscale.tla, every property, with untrusted certificates: two node slots on one state directory, each with a
\* control server whose certificate is trusted or not, one control outage, one key expiry, one refused login.
CONSTANTS
    N = 2
    D = 1
    MaxOutages = 1
    MaxExpiries = 1
    MaxRefusals = 1
    Broken = {}
    StartKeys = {FALSE}
    StartCerts = {FALSE, TRUE}
    RefusalClasses = {"refused"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ReadyHasPeers
    ClosedNeverRunning
    URLOnlyInNeedsLogin
    OneNodePerDir
    StatesNamed
    CertNeverReady
PROPERTIES
    GetsReady
    CertFails
