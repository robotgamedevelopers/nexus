\* The session's place, per commit: two prompts (each sent or queued), one may wait (and one queue), one failed
\* start before the hold, no restart, one session id, one directory besides the first and one change: a move to
\* another directory or machine, or a change of the drivers file, with a driver idle, working or starting, the harness
\* session dropped and the summary owed. MCSupervisorPlaceWide.cfg, nightly, has two changes and a restart; a
\* sign-in is MCSupervisorSignIn.cfg's.
CONSTANTS
    Prompts = 2
    MaxWaiting = 1
    MaxFailedStarts = 1
    MaxRestarts = 0
    Sessions = {"a"}
    Models = {}
    Efforts = {}
    Accounts = {}
    Dirs = {"d"}
    MaxSwitches = 1
    SignIns <- NoSignIns
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDriver
    OneTurn
    TurnsIncrease
    AtMostOnce
    WaitingSound
    QueueSound
    StopOnce
    LimitHolds
    IdleWaitsForPerson
    NoDriverShowsDown
PROPERTIES
    EffectsForOpen
    EndsAnsweredOrCut
    TextKept
    StartsSound
    NoSendWithoutCredential
    StopForOpen
    StopEndsWhatRuns
    NoLatchedStop
    TakesAtTurnEnd
    WrittenWithSetting
    SettingLeavesTurn
    NoSendOnOldAccount
    AccountKeepsTurn
    NoSendInOldPlace
    PlaceKeepsTurn
    ResumesItsDir
    SummaryOwed
    SummaryCarried
    CrashShowsDown
    DownLeavesByWork
    Settles
