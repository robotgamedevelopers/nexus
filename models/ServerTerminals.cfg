\* The server's terminals (ServerTerminals.tla): two windows, one slot (taken again after a restart), two actions each, one restart; about a minute on four cores of a loaded bench.
SPECIFICATION Spec
CONSTANTS
    Clients = {c1, c2}
    Slots = {1}
    MaxSends = 2
    MaxRestarts = 1
INVARIANTS
    TypeOK
    InputOnceInOrder
    InputOnlyToItsRun
PROPERTIES
    NoInputUnlessRunning
    DetachKeepsRunning
    RestartShown
    ExitShown
    RestartNeverSilent
    ActionsApplied
