\* The Claude driver's turns and secret asks (ClaudeDriver.tla), every property, no error: two turns, two asks (so an
\* earlier turn's stopped ask can answer while a later turn's ask waits), one setting, with or without --resume.
CONSTANTS
    MaxTurn = 2
    MaxAsk = 2
    Fields = {"model"}
    Values = {"a"}
    Resumes = {"none", "given"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDone
    StopNeverLater
    AskOnlyRunning
PROPERTIES
    NoDoneInBlock
    AskGate
    SecretMatchesAsk
    SettingsNeverChangeOpen
    SettingsFromNextSend
    StopEndsWhatRuns
    NoLatchedStop
    EveryTurnEnds
    InterruptsAnswered
