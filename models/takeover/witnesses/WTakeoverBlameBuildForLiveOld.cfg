\* Reversed witness: letting `supervise` count startup failures while a live old server holds ~/.nexus/server.sock
\* permanently halts a healthy build even after the old server stops!
SPECIFICATION Live
CONSTANTS
    AllowedBuilds = {1}
    InitPlaced = {1}
    InitTested = {1}
    InitCur = 1
    InitOldLayout = "live"
    StartupBroken = {}
    LateBroken = {}
    Format5Writers = {}
    MaxCrashesBeforeRollback = 2
    MaxRestarts = 3
    MaxHandovers = 0
    MaxCuts = 0
    MaxSupDeaths = 0
    MaxTurns = 0
    MaxStops = 0
    Bug = "blame_build_for_live_old"
PROPERTY WorkingFallbackServes
