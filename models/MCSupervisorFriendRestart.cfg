\* The friend taken out of friends.json, nightly: two prompts (each sent or queued), one may wait (and one queue),
\* one failed start before the hold, one server restart, no change of the person's, and the friend taken out once and
\* put back, with a driver idle, working, stopping or starting, a prompt waiting or queued, and a restart while it is
\* out.
