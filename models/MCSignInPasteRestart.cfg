\* SignInPaste.tla, the per-change instance across flows: one window, on another machine than the server, one code,
\* two flows (the second after the first ended), a restart, and one stray code (for any flow: an ended one, a second).
CONSTANTS
    Clients = {c1}
    Remote = {c1}
    Codes = {k1}
    MaxFlows = 2
    MaxStrays = 1
    MaxRestarts = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneFlow
    ProcessHasItsFlow
    OneCodePerFlow
    CodeOnlyFromHolder
    CodeOnlyWhenAsked
    NoCodeInLog
    NoCodeToWindows
    AskOnlyToHolder
PROPERTIES
    EndedStaysEnded
    RunningEnds
