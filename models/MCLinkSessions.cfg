\* Sessions: one window over two AIs, where AI "a" has a session at the start and "b" none; two actions of
\* any kind, sends and stops naming any of three ids (held or not), creates from the defaults or from a session, and
\* ensures; an open entry grown once and a restart. Ids minted, refused past the limit, never reused; each tab shows
\* its AI's first session.
CONSTANTS
    Clients = {1}
    AIs = {"a", "b"}
    Start <- StartA
    MaxSessions = 3
    MaxActions = 2
    W = 1
    MaxGrows = 1
    MaxRestarts = 1
    Kinds = {"Send", "Stop", "Create", "Ensure"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnce
    ServerHoldsEach
    ViewMatches
    QueueMatches
    NoticesSound
    EachClosedOnce
    LiveSound
    IdsNeverReused
    EnsureMakesOne
    ShowsFirst
PROPERTIES
    OnlyGrow
    OpenGrows
    SessionsKept
    Converges
