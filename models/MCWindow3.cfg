\* Window.tla with no dashboard, on three AIs, in all six orders, no terminals (MCWindow.cfg has them), transcripts and
\* queues up to 1 entry, with fewer drafts and entries (MCDrafts3, MCAppendEntries3). Every property, no error expected.
CONSTANTS
    AIList <- MCAIs3
    Idx <- MCIdx3
    BoardList <- MCBoards0
    Drafts <- MCDrafts3
    Blank <- MCBlank3
    AppendEntries <- MCAppendEntries3
    MaxTerms <- MCMaxTerms0
    MaxLen = 1
