\* Post-start failure rollback instance: build 1 healthy, build 2 tested but fails after SERVING; handover switches to 2,
\* 2 serves and crashes, supervision rolls back to 1 and settles serving 1 (with supervisor death in flight too).
SPECIFICATION RollbackLive
CONSTANTS
    SupActors = {"s1", "s2"}
    Builds = {1, 2}
    Tested = {1, 2}
    StartupBroken = {}
    LateBroken = {2}
    Initial = 1
    MaxCrashesBeforeRollback = 2
    MaxRestarts = 3
    MaxLockRaces = 1
    MaxSupDeaths = 1
    MaxHandovers = 1
    MaxStops = 0
    Bug = "none"
INVARIANTS
    TypeOK
    OneSupervisor
    HandoverSerialized
    CurrentTested
    RestartsBounded
PROPERTIES
    NeverRollsBackToShunned
    StopStaysStopped
    DrainRestartsCurrent
    SupervisorSettles
    SettledHealthy
