\* Nightly: three prompts (each sent or queued), two may wait, two failed starts, no restart, one session id: two
\* prompts in the queue at once, so the oldest-first take is checked.
CONSTANTS
    Prompts = 3
    MaxWaiting = 2
    MaxFailedStarts = 2
    MaxRestarts = 0
    Sessions = {"a"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDriver
    OneTurn
    TurnsIncrease
    AtMostOnce
    WaitingSound
    QueueSound
    StopOnce
    LimitHolds
PROPERTIES
    EffectsForOpen
    EndsAnsweredOrCut
    TextKept
    StartsSound
    NoSendWithoutCredential
    StopForOpen
    TakesAtTurnEnd
    Settles
