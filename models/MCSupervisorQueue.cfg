    Prompts = 3
    MaxWaiting = 2
    MaxFailedStarts = 2
    MaxRestarts = 0
    Sessions = {"a"}
    Models = {}
    Efforts = {}
    Accounts = {}
    Dirs = {}
    MaxSwitches = 0
