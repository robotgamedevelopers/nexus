\* Nightly: two windows, one action each, up to two crashes across passes and a store/flush failure; plus a
\* second nightly instance (MCLoopPassThree.cfg) with three actions on one window across two crashes.
CONSTANTS
    Clients = {1, 2}
    MaxActs = 1
    Kinds = {"Send", "Queue", "Stop"}
    MaxCrashes = 2
    MaxFails = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnce
    PromptAtMostOnce
    TurnsIncrease
    DriverOnlyDurable
    LinkStateDurable
    AckedOnlyDurable
PROPERTIES
    DurableMonotonic
    NoOutBeforeFlush
