\* Two windows sharing one tab, one action each of any kind, a tail of one entry, an open entry grown once and a
\* restart: both windows' actions interleave in the tab with the server's own steps. (MCLinkStops.cfg, nightly, has two
\* actions each.)
CONSTANTS
    Clients = {1, 2}
    TabNames = {"a"}
    MaxActions = 1
    W = 1
    MaxGrows = 1
    MaxRestarts = 1
    Kinds = {"Send", "Queue", "Stop"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnce
    ServerHoldsEach
    ViewMatches
    QueueMatches
    NoticesSound
    EachClosedOnce
    LiveSound
PROPERTIES
    OnlyGrow
    OpenGrows
    Converges
