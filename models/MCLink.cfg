\* Two windows sharing one tab, two actions each, a tail of one entry: both windows' actions interleave in the tab, and
\* every send pushes an entry out of the tail, so the windows' mirrors write notices. (MCLinkOne.cfg has two tabs;
\* MCLinkWide.cfg, nightly, has both.)
CONSTANTS
    Clients = {1, 2}
    TabNames = {"a"}
    MaxActions = 2
    W = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnce
    ServerHoldsEach
    ViewMatches
    QueueMatches
    NoticesSound
PROPERTIES
    OnlyGrow
    Converges
