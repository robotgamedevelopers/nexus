\* Two windows sharing session 1 in the same batches, one action each (Send, Queue, Stop), a store/flush failure,
\* and a crash anywhere in any pass (including partial-batch recovery where one window's action survived on disk and
\* the other's did not).
CONSTANTS
    Clients = {1, 2}
    MaxActs = 1
    Kinds = {"Send", "Queue", "Stop"}
    MaxCrashes = 1
    MaxFails = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ExactlyOnce
    PromptAtMostOnce
    TurnsIncrease
    DriverOnlyDurable
    LinkStateDurable
    AckedOnlyDurable
PROPERTIES
    DurableMonotonic
    NoOutBeforeFlush
