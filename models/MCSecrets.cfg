\* Two windows of this version offered one request for one account, and one server restart: both show the dialog,
\* one answers and the other's closes; both answer and the second is late; a cancel; a deadline; a window lost
\* mid-entry; a restart with the request open and stale dialogs after it; the disk failing once: the value held, written
\* again once the disk is fixed, or lost at the restart.
CONSTANTS
    Clients = {c1, c2}
    OldClients = {}
    Accounts = {a1}
    Askers = {ai}
    Values = {v1}
    BadValues = {}
    MaxRequests = 1
    MaxRestarts = 1
    MaxFailures = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSecretToAsker
    NoSecretInTranscript
    NoSecretInLog
    NoSecretToWindows
    AtMostOneStored
    StoredWhenStored
    OneOpenPerAccount
    AnsweredOnce
    AnsweredWhenEnded
    ReceivedNeverDropped
    StoredOnlyDurable
    HeldOnlyWhileHolding
    NoMalformedStored
PROPERTIES
    ClosedStaysClosed
    AskNeedsTaker
    HeldOnlyStored
    EveryRequestEnds
    DialogsClose
    HeldIsStored
