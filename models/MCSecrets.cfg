\* Two windows of this version offered one request for one account, and one server restart: both show the dialog,
\* one answers and the other's closes; both answer and the second is late; a cancel; a deadline; a window lost
\* mid-entry; a restart with the request open and stale dialogs after it.
CONSTANTS
    Clients = {c1, c2}
    OldClients = {}
    Accounts = {a1}
    Askers = {ai}
    Values = {v1}
    MaxRequests = 1
    MaxRestarts = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSecretToAsker
    NoSecretInTranscript
    NoSecretInLog
    NoSecretToWindows
    AtMostOneStored
    StoredWhenStored
    OneOpenPerAccount
    AnsweredOnce
    AnsweredWhenEnded
PROPERTIES
    ClosedStaysClosed
    AskNeedsTaker
    EveryRequestEnds
    DialogsClose
