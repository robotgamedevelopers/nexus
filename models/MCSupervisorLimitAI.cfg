\* The session's limit with its AI taken out of ais.json, nightly: MCSupervisorLimit.cfg's instance (one
\* prompt, one change: the limit tightened or a change of the drivers file), with the AI also taken out once and
\* put back, before, during or after the change of limit, so that a tightening and a removal meet (both stop an open
\* turn; one stop is written). 15,450 states, 40 s on two workers on an M-series Mac, most of it the liveness check.
CONSTANTS
    Prompts = 1
    MaxWaiting = 1
    MaxFailedStarts = 1
    MaxRestarts = 0
    Sessions = {"a"}
    Models = {}
    Efforts = {}
    Accounts = {}
    Dirs = {}
    MaxSwitches = 1
    MaxRemovals = 1
    SignIns <- NoSignIns
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDriver
    OneTurn
    TurnsIncrease
    AtMostOnce
    WaitingSound
    QueueSound
    StopOnce
    LimitHolds
    IdleWaitsForPerson
    NoDriverShowsDown
    NeverWeaker
    AbsentRunsNothing
PROPERTIES
    EffectsForOpen
    EndsAnsweredOrCut
    TextKept
    StartsSound
    NoSendWithoutCredential
    StopForOpen
    StopEndsWhatRuns
    NoLatchedStop
    TakesAtTurnEnd
    WrittenWithSetting
    SettingLeavesTurn
    NoSendOnOldAccount
    AccountKeepsTurn
    NoSendInOldPlace
    PlaceKeepsTurn
    ResumesItsDir
    SummaryOwed
    SummaryCarried
    CrashShowsDown
    DownLeavesByWork
    Settles
    NoSendWeaker
    LooseningKeepsTurn
    AbsentStartsNothing
    AbsentKeepsPrompts
    AbsentEnds
