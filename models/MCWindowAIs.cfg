\* Window.tla with the AIs coming and going (MCSpecAIs): the sprint tab, one AI at the start, and add_ai
\* and remove_ai at every position among up to two terminals, the AI removed while active and selected, and added
\* again as a new tab; transcripts and queues up to 1 entry, so a removed tab's are seen to go with it. Every property,
\* no error expected.
CONSTANTS
    AIList <- MCAIs1
    Idx <- MCIdxF
    Sprint = TRUE
    Drafts <- MCDrafts2
    Blank <- MCBlank2
    AppendEntries <- MCAppendEntries3
    MaxTerms <- MCMaxTerms2
    MaxLen = 1
SPECIFICATION MCSpecAIs
CONSTRAINT Bounded
VIEW ModelView
INVARIANTS
    TypeOK
    ActiveValid
    NoTabLost
    NoTabDuplicated
    NamesOnce
    IdsHandedOut
    ZonesOrdered
    SprintFirst
    HistoryOpen
    HistoryOnce
    HistoryEndsActive
PROPERTIES
    SelectExact
    SetDraftExact
    SendResult
    TerminalTakesNoText
    SprintTakesNoText
    SprintNeverMoves
    SprintNeverCloses
    SendAppendsOne
    QueueAppendsOne
    QueueLeavesTranscripts
    OnlyQueueTouchesQueues
    TakeExact
    SendClearsOnlyItsDraft
    SendTouchesNoOtherTab
    AppendExact
    MovePlaces
    MoveKeepsTabs
    OnlyMoveReorders
    ActiveAIKept
    AddAppends
    AddFreshId
    NextIdGrows
    CloseRemovesExactly
    CloseKeepsAIs
    CloseActiveRule
    SelectMovesToEnd
    CloseForgets
    RefusedChangesNothing
    TranscriptsOnlyGrow
    QueuesOnlyGrow
    AIsFixed
    AddAIExact
    RemoveAIExact
    AIOpsKeepOthers
    RemoveForgets
    RemoveActiveRule
