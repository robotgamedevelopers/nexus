\* SignInPaste.tla, the per-change instance: two windows, one on the server's machine (c1) and one on another (c2),
\* one code, one flow and one stray code (from either window: another window's, a second, one with no flow waiting).
\* MCSignInPasteRestart.cfg adds a second flow and a restart with one window; MCSignInPasteWide.cfg has both, nightly.
CONSTANTS
    Clients = {c1, c2}
    Remote = {c2}
    Codes = {k1}
    MaxFlows = 1
    MaxStrays = 1
    MaxRestarts = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneFlow
    ProcessHasItsFlow
    OneCodePerFlow
    CodeOnlyFromHolder
    CodeOnlyWhenAsked
    NoCodeInLog
    NoCodeToWindows
    AskOnlyToHolder
PROPERTIES
    EndedStaysEnded
    RunningEnds
