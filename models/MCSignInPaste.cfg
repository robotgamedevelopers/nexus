\* SignInPaste.tla, the per-change instance: two windows, one on the server's machine (c1) and one on another (c2),
\* one code, two flows, one stray code (from either window, for any flow: another window's, a second, one with no flow
\* waiting) and a restart. MCSignInPasteWide.cfg (two codes, two strays) runs nightly.
CONSTANTS
    Clients = {c1, c2}
    Remote = {c2}
    Codes = {k1}
    MaxFlows = 2
    MaxStrays = 1
    MaxRestarts = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneFlow
    ProcessHasItsFlow
    OneCodePerFlow
    CodeOnlyFromHolder
    CodeOnlyWhenAsked
    NoCodeInLog
    NoCodeToWindows
    AskOnlyToHolder
PROPERTIES
    EndedStaysEnded
    RunningEnds
