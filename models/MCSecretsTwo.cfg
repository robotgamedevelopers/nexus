    Clients = {c1}
    OldClients = {}
    Accounts = {a1, a2}
    Askers = {ai}
    Values = {v1}
    BadValues = {}
    MaxRequests = 2
    MaxRestarts = 0
    MaxFailures = 0
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSecretToAsker
    NoSecretInTranscript
    NoSecretInLog
    NoSecretToWindows
    AtMostOneStored
    StoredWhenStored
    OneOpenPerAccount
    AnsweredOnce
    AnsweredWhenEnded
    ReceivedNeverDropped
    StoredOnlyDurable
    HeldOnlyWhileHolding
    NoMalformedStored
PROPERTIES
