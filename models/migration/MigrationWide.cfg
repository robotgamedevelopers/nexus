\* Nightly wide instance: all four old-layout parts (snap, log, drivers, config), two actors, live old store lock,
\* two crashes, one death, and five build/store/rollback steps across builds 1..3.
CONSTANTS
    Actors = {"a1", "a2"}
    ActiveParts = {"snap", "log", "drivers", "config"}
    InitTop = {"snap", "log", "drivers", "config"}
    InitTopSock = TRUE
    InitOldSrv = "locked"
    InitDir = {}
    AllowedBuilds = {1, 2, 3}
    MaxRuns = 1
    MaxCrashes = 2
    MaxDeaths = 1
    MaxBuildOps = 5
    Bug = "none"
SPECIFICATION Live
INVARIANTS
    TypeOK
    LockHeld
    LiveOldRefused
    NeverClobbersNewStore
    OldDataNeverLost
    MovesOnce
    CurAlwaysReadsStore
    RollbackReadable
PROPERTIES
    CutAnywhereResumes
