\* Pre-existing populated ~/.nexus/server/store alongside ~/.nexus/store: neither is overwritten or deleted.
CONSTANTS
    Actors = {"a1", "a2"}
    ActiveParts = {"snap", "log", "drivers"}
    InitTop = {"snap", "log", "drivers"}
    InitTopSock = FALSE
    InitOldSrv = "off"
    InitDir = {"log"}
    AllowedBuilds = {1, 2}
    MaxRuns = 2
    MaxCrashes = 1
    MaxDeaths = 1
    MaxBuildOps = 2
    Bug = "none"
SPECIFICATION Live
INVARIANTS
    TypeOK
    LockHeld
    LiveOldRefused
    NeverClobbersNewStore
    OldDataNeverLost
    MovesOnce
    CurAlwaysReadsStore
    RollbackReadable
PROPERTIES
    CutAnywhereResumes
