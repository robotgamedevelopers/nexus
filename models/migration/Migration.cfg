\* Two actors, a live old server on ~/.nexus/server.sock, old store (snap + log) and drivers in ~/.nexus, empty
\* ~/.nexus/server, one crash, one death, and builds 1..3 (3/3, 5/3 appended, 5/5 breaking) switching, writing and
\* rolling back once migrated. Every invariant and CutAnywhereResumes under fairness.
CONSTANTS
    Actors = {"a1", "a2"}
    ActiveParts = {"snap", "log", "drivers"}
    InitTop = {"snap", "log", "drivers"}
    InitTopSock = TRUE
    InitOldSrv = "sock"
    InitDir = {}
    AllowedBuilds = {1, 2, 3}
    MaxRuns = 1
    MaxCrashes = 1
    MaxDeaths = 1
    MaxBuildOps = 4
    Bug = "none"
SPECIFICATION Live
INVARIANTS
    TypeOK
    LockHeld
    LiveOldRefused
    NeverClobbersNewStore
    OldDataNeverLost
    MovesOnce
    CurAlwaysReadsStore
    RollbackReadable
PROPERTIES
    CutAnywhereResumes
