\* Handover from a pre-drain legacy server (StartSrv = 9) with an open turn, across working (3) and broken (2) targets.
SPECIFICATION CutResumeLive
CONSTANTS
    Actors = {"a1", "a2"}
    Builds = {1, 2, 3}
    Tested = {1, 2, 3}
    Broken = {2}
    Initial = 1
    StartSrv = 9
    MaxOps = 1
    MaxCrashes = 1
    MaxDeaths = 1
    MaxTurns = 1
    Bug = "none"
INVARIANTS
    TypeOK
    OneHandover
    CurrentTested
    NeverServesBroken
    StateValid
    IdleCurrentWorks
PROPERTIES
    DrainCutsOnlyLate
    StopOnlyLegacy
    HandoverEnds
    AlwaysRecoversToServing
