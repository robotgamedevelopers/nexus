\* Two concurrent actors (handover and resume), three builds (1 good initial, 2 broken tested, 3 untested),
\* one actor death, one machine crash, one AI turn: all invariants, action properties, and HandoverEnds.
SPECIFICATION Live
CONSTANTS
    Actors = {"a1", "a2"}
    Builds = {1, 2, 3}
    Tested = {1, 2}
    Broken = {2}
    Initial = 1
    StartSrv = 1
    MaxOps = 1
    MaxCrashes = 1
    MaxDeaths = 1
    MaxTurns = 1
    Bug = "none"
INVARIANTS
    TypeOK
    OneHandover
    CurrentTested
    NeverServesBroken
    StateValid
    IdleCurrentWorks
PROPERTIES
    DrainCutsOnlyLate
    StopOnlyLegacy
    HandoverEnds
