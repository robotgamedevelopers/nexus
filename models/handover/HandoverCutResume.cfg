\* Cut-and-resume across working (1, 3) and broken (2) builds: actor a1 starts a handover and may be killed or
\* crashed at any step while a turn opens; actor a2 runs `handover resume` and proves AlwaysRecoversToServing.
SPECIFICATION CutResumeLive
CONSTANTS
    Actors = {"a1", "a2"}
    Builds = {1, 2, 3}
    Tested = {1, 2, 3}
    Broken = {2}
    Initial = 1
    StartSrv = 1
    MaxOps = 1
    MaxCrashes = 1
    MaxDeaths = 1
    MaxTurns = 1
    Bug = "none"
INVARIANTS
    TypeOK
    OneHandover
    CurrentTested
    NeverServesBroken
    StateValid
    IdleCurrentWorks
PROPERTIES
    DrainCutsOnlyLate
    StopOnlyLegacy
    HandoverEnds
    AlwaysRecoversToServing
