\* Reversed witness: handover keeps its progress in memory only (`handover/state` is never written); when the actor
\* dies after switching `current` to a broken build, nothing on disk knows to roll back. Caught by IdleCurrentWorks.
SPECIFICATION Spec
CONSTANTS
    Actors = {"a1"}
    Builds = {1, 2}
    Tested = {1, 2}
    Broken = {2}
    Initial = 1
    StartSrv = 1
    MaxOps = 1
    MaxCrashes = 0
    MaxDeaths = 1
    MaxTurns = 0
    Bug = "in_memory_only"
INVARIANT IdleCurrentWorks
