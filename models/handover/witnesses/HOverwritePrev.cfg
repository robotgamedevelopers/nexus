\* Reversed witness: a new handover ignores an unfinished `handover/state` on disk and takes `cur` (a broken build
\* whose interrupted handover never finished) as `previous`, losing the last good build. Caught by StateValid.
SPECIFICATION Spec
CONSTANTS
    Actors = {"a1", "a2"}
    Builds = {1, 2, 3}
    Tested = {1, 2, 3}
    Broken = {2, 3}
    Initial = 1
    StartSrv = 1
    MaxOps = 1
    MaxCrashes = 0
    MaxDeaths = 1
    MaxTurns = 0
    Bug = "overwrite_prev"
INVARIANT StateValid
