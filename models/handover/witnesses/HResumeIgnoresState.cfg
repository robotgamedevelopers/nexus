\* Reversed witness: with progress kept in memory only, `handover resume` after a crash during a broken build's
\* handover cannot recover to a serving build. Caught by AlwaysRecoversToServing.
SPECIFICATION CutResumeLive
CONSTANTS
    Actors = {"a1", "a2"}
    Builds = {1, 2}
    Tested = {1, 2}
    Broken = {2}
    Initial = 1
    StartSrv = 1
    MaxOps = 1
    MaxCrashes = 1
    MaxDeaths = 0
    MaxTurns = 0
    Bug = "in_memory_only"
PROPERTY AlwaysRecoversToServing
