\* Nightly: three turns, two secret asks, one setting of two values, with or without --resume.
CONSTANTS
    MaxTurn = 3
    MaxAsk = 2
    Fields = {"model"}
    Values = {"a", "b"}
    Resumes = {"none", "given"}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneDone
    StopNeverLater
    AskOnlyRunning
PROPERTIES
    NoDoneInBlock
    AskGate
    SecretMatchesAsk
    SettingsNeverChangeOpen
    SettingsFromNextSend
    StopEndsWhatRuns
    NoLatchedStop
    EveryTurnEnds
    InterruptsAnswered
